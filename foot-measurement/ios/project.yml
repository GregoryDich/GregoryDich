# XcodeGen spec:  brew install xcodegen && xcodegen generate  -> FootCapture.xcodeproj
# Then open the project in Xcode, set your Team under Signing & Capabilities, run on the iPhone.
name: FootCapture
options:
  bundleIdPrefix: com.gregorydich
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  FootCapture:
    type: application
    platform: iOS
    sources:
      - path: FootCapture/Sources
    settings:
      base:
        INFOPLIST_FILE: FootCapture/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.gregorydich.footcapture
        PRODUCT_NAME: FootCapture
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SUPPORTS_MACCATALYST: NO
