<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>🐠 Морской аквариум</title>
<style>
  /* V5: страница тёмная с первого мгновения (и ночью, и днём), холст проявляется за 0.4 с, когда есть
     настоящий кадр — без белой/голубой вспышки и без процедурного рифа до прихода постера */
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #02101c;
  }
  @media (prefers-color-scheme: dark) { html, body { background: #010818; } }
  #tank { display: block; width: 100vw; height: 100vh; cursor: default; opacity: 0; transition: opacity 0.4s ease-out; }
  #tank.on { opacity: 1; }
  body.hide-cursor #tank { cursor: none; }
  #hint {
    position: fixed; left: 18px; bottom: 16px; margin: 0; padding: 9px 14px;
    border-radius: 12px;
    font: 13px/1.5 -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    color: rgba(255,255,255,0.92);
    background: rgba(6,40,66,0.42);
    border: 1px solid rgba(255,255,255,0.16);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 22px rgba(0,0,0,0.28);
    user-select: none; pointer-events: none; transition: opacity 0.6s ease; z-index: 10;
  }
  #hint b { color: #ffd86b; font-weight: 600; }
  #hint.faded { opacity: 0; }
</style>
</head>
<body>
  <canvas id="tank"></canvas>
  <p id="hint">
    <b>F</b> — на весь экран&nbsp;&nbsp;·&nbsp;&nbsp;<b>Пробел</b> — пауза&nbsp;&nbsp;·&nbsp;&nbsp;<b>Клик</b> — покормить&nbsp;&nbsp;·&nbsp;&nbsp;<b>+ / −</b> — рыбок
  </p>

<!-- Список рыб (имена/описания/картинки). Если PNG нет — рисуются векторные рыбки. -->
<script src="fish/manifest.js"></script>
<!-- Сцена: геометрия рифа, свет, точки поведения (window.AQUARIUM_SCENE). Применяется
     только к тому заднику, для которого написана (backdrop.src). -->
<script src="scene/scene.js"></script>
<!-- Библиотека колоний переднего рифа (этап V3): window.CORAL_CATALOG — сцена ссылается на них по id. -->
<script src="scene/corals/catalog.js"></script>
<script>
"use strict";
/* ============================================================
   Морской аквариум — анимированная заставка для macOS
   Палитра подобрана под оригинал Living Marine Aquarium 2:
   тёплый насыщенный риф на холодной тропической голубой воде.
   Self-contained HTML5 Canvas, без зависимостей.
   ============================================================ */
(function () {
  const canvas = document.getElementById("tank");
  const mainCtx = canvas.getContext("2d", { alpha: false });
  // ctx — текущая цель рисования: главный холст или (E4) буфер группы вычитания; OX/OY — её начало
  // в CSS px экрана (у главного холста 0). Рыбы, пузырьки и хлопья ставят преобразования с −OX/−OY.
  let ctx = mainCtx, OX = 0, OY = 0;
  const baseT = () => ctx.setTransform(RS, 0, 0, RS, -RS * OX, -RS * OY);
  const hint = document.getElementById("hint");

  /* ---------- флаги URL ----------
     ?wallpaper=1  режим обоев: без подсказки, курсора и управления (так грузит macOS-приложение)
     ?test=1       детерминированный режим: от rAF симуляция НЕ идёт, кадр — только по window.__aq.step()
     ?seed=N       один сидированный ГПСЧ вместо Math.random — воспроизводимые прогоны
     ?debug=1      оверлей: RS, уровень качества, счётчики вызовов canvas, мс JS на кадр
                   (?debug=2 — плюс геометрия сцены: линия пола, точки, источники пузырьков, safeX)
     ?nofilter=1   HAS_FILTER = false (как в WebKit/WKWebView, где ctx.filter выключен)
     ?nobg=1       задник не грузится — процедурный векторный риф (проверка фолбэка)
     ?gov=0        регулятор качества выключен (замеры харнессом с синтетическим временем)
     ?theme=day|night  тема принудительно (иначе — по оформлению macOS, см. «ТЕМЫ»)
     ?bgvideo=0    без видео-задника (только постер); в тесте: ?bgvideo=webm|intra — тестовые копии из
                   tools/aquarium-test/media (вне бандла), ?bgvideo=mp4 — отгружаемые MP4 (см. «ЗАДНИК»)   */
  const PARAMS = new URLSearchParams(location.search);
  const flag = (k) => PARAMS.has(k) && PARAMS.get(k) !== "0";
  const WALLPAPER = flag("wallpaper") || window.__WALLPAPER === true;
  const TEST = flag("test"), NOBG = flag("nobg"), GOV_ON = PARAMS.get("gov") !== "0";
  if (TEST) canvas.style.transition = "none";      // тест: кадр виден сразу (снимки не ловят проявление)
  const DEBUG = flag("debug") ? Math.max(1, parseInt(PARAMS.get("debug"), 10) || 1) : 0;
  const COUNTING = TEST || DEBUG > 0;          // обёртки-счётчики canvas — только в этих режимах
  // ctx.filter в WebKit выключен (SPEC F1) — в отгружаемом коде он не используется вовсе;
  // флаг оставлен для проверок (кадры с ?nofilter=1 и без должны совпадать)
  const HAS_FILTER = !flag("nofilter") && ("filter" in ctx);
  let paused = false;

  /* ---------- wallpaper / power mode (driven by the macOS app) ----------
     The app can throttle us for battery via:
       webView.evaluateJavaScript("aquariumSetPower('low')")   // 30 fps
       webView.evaluateJavaScript("aquariumSetPower('paused')")// stop drawing
       webView.evaluateJavaScript("aquariumSetPower('high')")  // 60 fps   */
  const normPower = (m) => (m === "low" || m === "paused") ? m : "high";
  /* P1.1: стартовые данные приложения (WKUserScript до загрузки страницы):
       window.__AQ_BOOT = { power, hud, budget, screen: {id, w, h, scale, maxFps, main}, crashes, loadReason, appVersion }
     hud — HUD сразу включён; budget — Мп холста (число; второй экран — 2) или {mp, fps}; остальное — в снимок
     диагностики и HUD. window.__AQ_POWER оставлен для совместимости (у него приоритет над boot.power). */
  const BOOT = window.__AQ_BOOT && typeof window.__AQ_BOOT === "object" ? window.__AQ_BOOT : null;
  // V5: приложение передаёт режим ещё до загрузки страницы (WKUserScript: window.__AQ_POWER) — первый кадр
  // уже в нужном режиме (вызов evaluateJavaScript до загрузки терялся: на батарее шло 60 к/с)
  let POWER = normPower(window.__AQ_POWER || (BOOT && BOOT.power));
  window.aquariumSetPower = (m) => {
    m = normPower(m);
    if (m === POWER) return;                     // тот же режим — не сбрасывать замер регулятора
    perfEvent("power", { from: POWER, to: m });
    POWER = m; PERF.armed = false;               // «чёрный ящик»: сон/пробуждение дисплея — не «застой»
    if (m !== "paused") budgetChanged();         // бюджет пикселей зависит от питания (P1.3)
    lastShown = 0; govReset();                   // смена режима — замер интервалов заново
    syncVideos();                                // 'paused' — видео-задник тоже на паузу (и обратно)
  };

  /* ---------- ЕДИНЫЙ ГПСЧ (mulberry32) ----------
     Заменяет Math.random во всём движке. ?seed=N — воспроизводимо; без него — сид от часов. */
  const SEED = PARAMS.has("seed")
    ? (parseInt(PARAMS.get("seed"), 10) >>> 0)
    : ((Date.now() ^ Math.floor(performance.now() * 1000)) >>> 0);
  let rngState = SEED | 0;
  function R() {
    rngState = (rngState + 0x6D2B79F5) | 0;
    let q = rngState;
    q = Math.imul(q ^ (q >>> 15), q | 1);
    q ^= q + Math.imul(q ^ (q >>> 7), q | 61);
    return ((q ^ (q >>> 14)) >>> 0) / 4294967296;
  }

  /* ---------- счётчики вызовов canvas (только ?test=1 / ?debug=1; иначе — ноль накладных) ----------
     Обёртки на прототипе: считают и главный холст, и все offscreen-холсты. Сброс — в начале кадра. */
  const CNT = { drawImage: 0, setTransform: 0, gradients: 0, patterns: 0, save: 0, restore: 0, getImageData: 0, filter: 0,
                e1Light: 0, e1Bubbles: 0, e1Particles: 0,      // e1* — drawImage разделов света/воды (этап E1)
                e3Fish: 0, e3Fog: 0, e3Lit: 0, e3Food: 0,       // e3* — drawImage рыб (всё / из них дымка / свет) и корма
                e4Scene: 0, e4Group: 0,                         // e4* — слой сцены (патчи, тени, пропсы) / накладные групп вычитания
                e4MsMembers: 0, e4MsSub: 0, e4MsComp: 0, e4MsLL: 0, e4MsList: 0, e4MsLLC: 0, e4MsBuf: 0, e4MsReefC: 0,
                pBack: 0, pScene: 0, pCaus: 0, pReef: 0, pBand: 0, pList: 0, pLight: 0, pTail: 0 };   // мс по стадиям render (профиль)   // мс (профиль, только счёт): члены / вычитание / сложение групп, стирание света, список, сложение света
  const CNT_KEYS = Object.keys(CNT);
  if (COUNTING) {
    const P = CanvasRenderingContext2D.prototype;
    const wrap = (name, key) => {
      const orig = P[name];
      if (typeof orig !== "function") return;
      P[name] = function () { CNT[key]++; return orig.apply(this, arguments); };
    };
    wrap("drawImage", "drawImage"); wrap("setTransform", "setTransform");
    wrap("createLinearGradient", "gradients"); wrap("createRadialGradient", "gradients"); wrap("createConicGradient", "gradients");
    wrap("createPattern", "patterns"); wrap("save", "save"); wrap("restore", "restore");
    wrap("getImageData", "getImageData");
    const fd = Object.getOwnPropertyDescriptor(P, "filter");   // любое включение ctx.filter — нарушение правил
    if (fd && fd.set) Object.defineProperty(P, "filter", { configurable: true, enumerable: fd.enumerable, get: fd.get,
      set(v) { if (v !== "none") CNT.filter++; fd.set.call(this, v); } });
  }

  /* ---------- плотность пикселей ----------
     V5 (P1.3): бюджет пикселей вместо потолка 8.3 Мп. Кадр упирается в заливку (≈4–5 полноэкранных проходов
     с режимами смешивания), а видео-задник — 2560×1440 = 3.7 Мп: буфер больше видео только множит заливку.
       RS = min(DPR, √(бюджет / (W·H)), max(1, 1.1 / BGX.sc)) × QUALITY.rsMul, округление до 1/16;
       бюджет: от сети ('high') 3.7 Мп, на батарее ('low') 2.4 Мп; ?budget=Мп — вручную (тест, A/B);
       третий член — не больше 1.1 device px на пиксель видео (не ниже 1).
     Всё рисуется в CSS-пикселях: ctx.setTransform(RS, …). */
  const MAX_BACKING_PX = 8.3e6;
  const BUDGET_Q = PARAMS.has("budget") ? Math.min(8.3, Math.max(0.5, parseFloat(PARAMS.get("budget")) || 3.7)) * 1e6 : 0;
  /* P1.1/P1.2: бюджет и предел к/с от приложения — aquariumSetBudget({mp, fps}) или __AQ_BOOT.budget (второй экран:
     2 Мп и 30 к/с); PROBE_BUDGET — временно, только на время зонда aquariumPerfProbe. Порядок: зонд → ?budget → приложение
     → питание. NOVIDCAP — зонд «как было»: без предела «1.1 пикселя устройства на пиксель видео». */
  let APP_BUDGET = 0, APP_FPS = 0, PROBE_BUDGET = 0, NOVIDCAP = false;
  function setAppBudget(o) {
    if (typeof o === "number") o = { mp: o };
    o = o && typeof o === "object" ? o : {};
    const mp = +o.mp, fps = +o.fps;
    APP_BUDGET = mp > 0 ? Math.min(8.3, Math.max(0.5, mp)) * 1e6 : 0;
    APP_FPS = fps > 0 ? Math.min(60, Math.max(10, Math.round(fps))) : 0;
  }
  if (BOOT && BOOT.budget != null) setAppBudget(BOOT.budget);
  const pixelBudget = () => PROBE_BUDGET || BUDGET_Q || APP_BUDGET || (POWER === "low" ? 2.4e6 : 3.7e6);
  const budgetSource = () => (PROBE_BUDGET ? "probe" : BUDGET_Q ? "url" : APP_BUDGET ? "app" : POWER === "low" ? "battery" : "power");
  // целевые к/с: 'high' — 60, 'low' — 30; приложение может ограничить ещё (второй экран — 30)
  const fpsTarget = () => Math.min(POWER === "low" ? 30 : 60, APP_FPS > 0 ? APP_FPS : 60);
  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0, floorY = 0, RS = 1;
  // размер рыб: в видео-сцене — от масштаба задника (рыба той же величины относительно настоящего рифа на любом
  // соотношении сторон: на 3440×1440 было на ≈30% крупнее, чем на 4:3); иначе — доля ширины экрана (как в LMA2)
  const sizeScale = () => (bgReady && bgMode === "video" ? clamp(BGX.sc * 1.75, 0.6, 3) : clamp(W / 1300, 0.8, 2.8));

  /* ---------- регулятор качества (меряет сам себя — целевого железа под рукой нет) ----------
     p90 интервала показанных кадров > 1.25× цели 5 с подряд → ступень вниз:
     частицы −50% → срезы рыб −30% → буфер каустики 0.5→0.35 → RS −15%.
     30 с хороших кадров → ступень вверх (после «отскока» ожидание удваивается, до 10 мин).
     Остальные этапы ЧИТАЮТ QUALITY.particles / fishSlices / causticScale / rsMul. */
  const QUALITY_LEVELS = [
    { particles: 1.0, fishSlices: 1.0, causticScale: 0.5,  rsMul: 1.0 },
    { particles: 0.5, fishSlices: 1.0, causticScale: 0.5,  rsMul: 1.0 },
    { particles: 0.5, fishSlices: 0.7, causticScale: 0.5,  rsMul: 1.0 },
    { particles: 0.5, fishSlices: 0.7, causticScale: 0.35, rsMul: 1.0 },
    { particles: 0.5, fishSlices: 0.7, causticScale: 0.35, rsMul: 0.85 },
  ];
  const QUALITY = Object.assign({ level: 0 }, QUALITY_LEVELS[0]);
  function setQuality(level) {
    level = clamp(level | 0, 0, QUALITY_LEVELS.length - 1);
    const prevRs = QUALITY.rsMul;
    if (level !== QUALITY.level) perfEvent("gov", { from: QUALITY.level, to: level, p90: Math.round(GOV.p90 * 10) / 10 });
    Object.assign(QUALITY, QUALITY_LEVELS[level]);
    QUALITY.level = level;
    if (QUALITY.rsMul !== prevRs && W > 0) { applyBacking(); if (TEST) renderNow(); }
  }
  const GOV = { iv: new Float32Array(160), tmp: new Float32Array(160), n: 0, acc: 0,
                bad: 0, good: 0, p90: 0, fps: 0, recover: 30, clock: 0, lastUp: -1e9 };   // clock — мс показанных кадров
  function govReset() { GOV.n = 0; GOV.acc = 0; }
  function govSample(ms) {
    if (!(ms > 0) || ms > 500) return;           // паузы, скрытие, первый кадр — не в счёт
    GOV.fps = GOV.fps ? GOV.fps * 0.95 + (1000 / ms) * 0.05 : 1000 / ms;
    if (GOV.n < GOV.iv.length) GOV.iv[GOV.n++] = ms;
    GOV.acc += ms; GOV.clock += ms;
    if (GOV.acc < 1000) return;
    // p90 за последнюю секунду: копия в заранее выделенный буфер, сортировка на месте
    const n = GOV.n;
    for (let i = 0; i < GOV.tmp.length; i++) GOV.tmp[i] = i < n ? GOV.iv[i] : Infinity;
    GOV.tmp.sort();
    GOV.p90 = GOV.tmp[Math.min(n - 1, Math.floor(n * 0.9))];
    GOV.n = 0; GOV.acc = 0;
    const target = 1000 / fpsTarget();
    if (GOV.p90 > 1.25 * target) { GOV.bad++; GOV.good = 0; }
    else { GOV.bad = 0; if (GOV.p90 <= 1.1 * target) GOV.good++; else GOV.good = 0; }
    if (GOV.bad >= 5 && QUALITY.level < QUALITY_LEVELS.length - 1) {
      if (GOV.clock - GOV.lastUp < 15000) GOV.recover = Math.min(GOV.recover * 2, 600);   // без «качелей»
      setQuality(QUALITY.level + 1); GOV.bad = 0; GOV.good = 0;
    } else if (GOV.good >= GOV.recover && QUALITY.level > 0) {
      setQuality(QUALITY.level - 1); GOV.lastUp = GOV.clock; GOV.good = 0;
    }
  }

  /* ============================================================
     P1.1: ЗАМЕР ПРОИЗВОДИТЕЛЬНОСТИ — HUD, снимок, зонд (цифры с Mac владельца; картинку не меняет)
       • Кольца по 600 значений: интервалы ПОКАЗАННЫХ кадров (мс, по меткам rAF) и JS-мс кадра (performance.now()
         вокруг syncVideos + симуляции + отрисовки; в WebKit JS-мс — только запись команд, поэтому разница
         «интервал − JS» — ожидание растра). Гистограмма интервалов с запуска (ячейки по 1 мс, ≥ 250 — последняя).
         Сырые интервалы rAF (240, и пропущенные кадры) — оценка vsync (виден ли ProMotion 120 Гц).
         Пишется всегда (снимок нужен и без HUD), без аллокаций на кадр.
       • Журнал событий (40, по кругу): ступени регулятора, смены RS, питание, тема, бюджет, видимость, ресайз,
         видео (сторож, ошибки, оборот петли — длительность перемотки и пропуск кадров по requestVideoFrameCallback,
         пропуски > 150 мс), кадры дольше 250 мс (подряд идущие — одной записью со счётчиком n).
       • HUD — DOM-элемент <pre> под строкой меню (не на холсте: не мерим сам HUD), обновляется 2 раза в секунду
         и только когда включён: aquariumSetDebug(true|false), __AQ_BOOT.hud или ?hud=1.
       • aquariumPerfSnapshot() — объект ≈3 КБ для «Скопировать диагностику»; aquariumPerfProbe() — Promise, ≈45 с
         по конфигурациям (регулятор на паузе), потом всё как было; aquariumSetBudget({mp, fps}) — второй экран.
     Метка загрузки (restart-investigation): sessionStorage.aqBoots растёт при перезагрузке той же страницы
     (сбой процесса WebContent) и начинается с 1 в новом WKWebView; тип навигации — navigate | reload.
     ============================================================ */
  const PERF = {
    N: 600, i: 0, n: 0, iv: new Float32Array(600), js: new Float32Array(600), tmp: new Float32Array(600),
    hist: new Uint32Array(251), frames: 0, maxAll: 0, maxAllT: 0,
    RN: 240, ri: 0, rn: 0, raw: new Float32Array(240), rtmp: new Float32Array(240),
    ev: new Array(40), ei: 0, en: 0, evTotal: 0,
    // «чёрный ящик»: показанные кадры с метками rAF (≥ 30 с при 60 к/с) — окно «последние 30 с»
    BN: 2048, bi: 0, bn: 0, biv: new Float32Array(2048), bjs: new Float32Array(2048), bts: new Float64Array(2048),
    btmp: new Float32Array(2048), btmp2: new Float32Array(2048),
    cbJs: 0, cbAt: 0, armed: false, stallNow: false,   // JS-мс и начало (performance.now) прошлого колбэка rAF; он был активным; застой в этом кадре
    noPace: false, hud: null, hudOn: false, hudTimer: 0,
  };
  const PAGE_BOOTS = (() => {
    try { const n = (parseInt(sessionStorage.getItem("aqBoots"), 10) || 0) + 1; sessionStorage.setItem("aqBoots", String(n)); return n; }
    catch (e) { return 0; }
  })();
  const NAV_TYPE = (() => {
    try {
      const e = performance.getEntriesByType ? performance.getEntriesByType("navigation")[0] : null;
      if (e && e.type) return e.type;
      const t = performance.navigation ? performance.navigation.type : -1;
      return t === 1 ? "reload" : t === 2 ? "back_forward" : t === 0 ? "navigate" : "?";
    } catch (e) { return "?"; }
  })();
  const r1 = (x) => Math.round((+x || 0) * 10) / 10, r2 = (x) => Math.round((+x || 0) * 100) / 100, r3 = (x) => Math.round((+x || 0) * 1000) / 1000;
  const EV_MERGE = { long: 1, vgap: 1, vstall: 1 };  // частые события (среди 4 последних, ≤ 10 с) — одной записью: n, t2, max ms
  function perfEvent(e, d) {
    const P = PERF, t = r1(performance.now() / 1000), L = P.ev.length;
    P.evTotal++;                                     // «чёрный ящик»: есть ли новое с прошлой записи
    if (EV_MERGE[e]) {
      for (let j = 1; j <= Math.min(4, P.en); j++) {
        const p = P.ev[(P.ei + L - j) % L];
        if (p.e !== e || (d && p.th !== d.th) || t - (p.t2 || p.t) >= 10) continue;
        p.n = (p.n || 1) + 1; p.t2 = t; if (d && d.ms > p.ms) p.ms = d.ms;
        return;
      }
    }
    const o = { t, e };
    if (d) for (const k in d) o[k] = d[k];
    P.ev[P.ei] = o; P.ei = (P.ei + 1) % L; if (P.en < L) P.en++;
  }
  function perfEvents(max) {
    const P = PERF, L = P.ev.length, n = Math.min(P.en, max || L), o = [];

      const vy = (PTS[i] + currentVY(t, x) + 1.5 * ss * Math.sin(0.17 * t + 1.3 * PTP[i])) * par;
      let nx = x + vx * dt, ny = PTY[i] + vy * dt;
      if (nx < -8) nx += W + 16; else if (nx > W + 8) nx -= W + 16;
      if (ny < top) ny += H - top + 8; else if (ny > H + 8) ny -= H - top + 8;
      PTX[i] = nx; PTY[i] = ny;
    }
  }
  function buildParticleSprites() {
    const mk = (px, sig) => {
      const c = document.createElement("canvas"); c.width = px; c.height = px;
      const g = c.getContext("2d"), id = g.createImageData(px, px), d = id.data;
      for (let j = 0; j < px; j++) for (let i = 0; i < px; i++) {
        const x = (i + 0.5) / px * 2 - 1, y = (j + 0.5) / px * 2 - 1, r2 = x * x + y * y, p = (j * px + i) * 4;
        d[p] = Math.round(TV.particle[0]); d[p + 1] = Math.round(TV.particle[1]); d[p + 2] = Math.round(TV.particle[2]);   // цвет темы
        d[p + 3] = Math.round(clamp(Math.exp(-r2 / (2 * sig * sig)) * (1 - r2), 0, 1) * 255);
      }
      g.putImageData(id, 0, 0);
      return c;
    };
    dotSprite = mk(16, 0.38); softSprite = mk(32, 0.5);
  }
  function drawParticles(t, near) {
    if (!dotSprite || !LAYERS.particles) return;
    const d0 = CNT.drawImage, n = Math.min(PT_N, Math.round(PT_N * QUALITY.particles * TV.particles));
    if (t !== ptLightT) { ptLightT = t; for (let i = 0; i < n; i++) PTLI[i] = lightAt(PTX[i], PTY[i]); }
    if (!near) {                                       // вне лучей — заливки путей по вёдрам
      ctx.fillStyle = TV_PART;
      for (let b = 0; b < 4; b++) {
        ctx.beginPath();
        let any = false;
        for (let i = 0; i < n; i++) {
          if (PTL[i] === 2 || PTB[i] !== b || PTLI[i] > 0.02) continue;
          const r = PTR[i] * (b < 2 ? 0.85 : 0.75), x = PTX[i], y = PTY[i];
          ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); any = true;
        }
        if (any) { ctx.globalAlpha = PT_BA[b]; ctx.fill(); }
      }
    }
    for (let i = 0; i < n; i++) {
      const L = PTL[i], li = PTLI[i];
      if ((L === 2) !== near || (L !== 2 && li <= 0.02)) continue;
      const glint = li > 0.02 ? li * (0.55 + 0.45 * Math.sin(PTF[i] * t + PTP[i])) : 0;   // кувыркается в луче
      ctx.globalAlpha = clamp(PTA[i] + glint * PT_GLINT[L], 0, 0.95);
      const s = PTR[i] * (L === 2 ? 4.2 : 3.2), x = PTX[i], y = PTY[i];
      ctx.drawImage(L === 2 ? softSprite : dotSprite, x - s / 2, y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    e1Count("e1Particles", d0);
  }

  /* ---------- сборка кэшей света и воды (зовёт applyBacking) ---------- */
  let lightBuilt = false;

    lmCtx = lmCan.getContext("2d"); lmImg = lmCtx.createImageData(lmCan.width, lmCan.height);

  }

  /* ============================================================
     РЫБЫ — этап E3 (SPEC 4.4 свет на рыбе, 4.5 тело, 4.6 глубина, 4.7 поведение и сюжет)
       • Мир. Рыба живёт в координатах плоскости стекла (X, Y — CSS px при z = 1) и глубине z
         (1.0 — стекло … 2.6 — задняя стенка). Проекция одна — точка схода (cx, hy) = bgMap(0.5, horizonBy):
         x = cx + (X − cx)/z, y = hy + (Y − hy)/z, масштаб 1/z; 1 z-единица = depthPx·W px (CAM.D).
         Пропорции держатся сами: масштаб ровно 1/z, рыскание вне разворота ≤ 30°, |ż| ≤ 0.12/с.
         Скорости — в длинах тела в секунду (SPEC F5): крупная рыба на большом экране не «ползёт».
       • Риф. depthGrid — глубина поверхности рифа по экрану: рыба держит z < сетка − 0.05 под всем
         телом (дальняя мелкая рыба не рисуется ПЕРЕД резким камнем). Исключение — за окклюдером
         (HIDE/PEEK): там предел — его zBack, рыба спрятана. Низ — плоскость песка (F4: песок свой).
       • Тело. Вертикальные срезы спрайта, у каждого — свой setTransform (знаковая ширина = зеркальный
         срез; отрицательная ширина drawImage по спецификации НЕ зеркалит). Курс среза = курс рыбы +
         изгиб разворота + биение хвоста; срезы укладываются от носа назад в 3D: опорная точка —
         полная перспектива, тело — «слабая» на её глубине (камера SPEC ≈116°: полная перспектива по
         точкам тела сплющивала и заваливала рыбу у краёв кадра), высота среза — по его собственной z.
         Поэтому хвост бьёт РЫСКАНИЕМ (в проекции укорачивается и удлиняется), разворот — изгиб,
         ведомый головой (C-образно), а не переворот карточки (|cos| ≥ 0.15 на срез; бок «ребром»
         чуть темнее), а при заплыве вглубь нос дальше — и меньше. Срезов: голова 60% — 2, хвост 40% —
         4…10, n ≤ clamp(L_dev/36, 6, 18); на развороте — равные и чаще (L_dev/14, 10…18: при 6 изгиб
         читался «карточками»; разворачиваются единицы рыб). Перекрытие 0.5 device px — без «жалюзи».
       • Мипы по экранному размеру (1.0 ≤ 800 px, 0.5, 0.25), дымка к цвету воды по z — второй проход
         силуэта, α = 0.85·(1 − e^{−0.42(z−1)}); свет лучей — полоса, скользящая по телу: подсвеченный
         вариант спрайта × поле света лучей (те же текстуры полос, ¼ экрана) × блики каустики,
         'lighter' (≈ c·(1 + α), α ≤ 0.55); вспышка бока на развороте. Тень на песке — только у дна.
       • Поведение: CRUISE GRAZE PICK HOVER HIDE PEEK HOME SHOAL LURK CHASE FLEE FEED OFFSTAGE
         (+ рывок DART — модификатор), стая — ведущий и ведомые со слотами и запаздыванием разворота,
         клоуны — в своей актинии, режиссёр сюжета (биты с паузами), автокормушка в режиме обоев;
         ближний проход у стекла (z ≈ 0.9) и дальний — в «окне» открытой воды (z ≈ 2.3).
       • Для E4: окклюдеры/пропсы — в общий список отрисовки со своим z (рыба с бо́льшим z — за ними);
         клоуны держат z = z актинии ± 0.025 (слои актинии — z ± 0.03); STORY_HOOKS.crab — бит краба;
         homeOf() читает props[].imgW/imgH (размер картинки актинии), если E4 их проставит.

     ============================================================ */
  const DEG = Math.PI / 180;
  const YAW_MAX = 30 * DEG, PITCH_MAX = 15 * DEG, PITCH_DOWN = 25 * DEG, DZ_MAX = 0.12;
  const Z_GLASS = 1.0, Z_NEAR = 0.86;                  // стекло; ближний проход режиссёра — до 0.86
  const FISH_MIP_CAP = 800, SL_MAX = 18, U_PIV = 0.6;   // цвет дымки — по теме (TV_FOG, раздел «ТЕМЫ»)
  const FISH_LIT_A = 0.55;                             // предел подсветки лучом (SPEC 4.4)
  const ST = { CRUISE: "CRUISE", GRAZE: "GRAZE", PICK: "PICK", HOVER: "HOVER", HIDE: "HIDE", PEEK: "PEEK",
               HOME: "HOME", SHOAL: "SHOAL", LURK: "LURK", CHASE: "CHASE", FLEE: "FLEE", FEED: "FEED", OFF: "OFFSTAGE" };
  const STATE_LIST = ["CRUISE", "GRAZE", "PICK", "HOVER", "HIDE", "PEEK", "HOME", "SHOAL", "LURK", "CHASE", "FLEE", "FEED", "OFFSTAGE"];

  /* ---------- камера: точка схода, глубина, дымка, плоскость песка ---------- */
  const CAM = { cx: 0, hy: 0, D: 1, fogK: 0.42, floorW: 0 };
  function layoutCamera() {
    const c = SCENE.camera || {};
    CAM.cx = bgX(c.horizonBx != null ? +c.horizonBx : 0.5); CAM.hy = bgY(c.horizonBy != null ? c.horizonBy : 0.42);
    CAM.D = Math.max(1, (c.depthPx || 0.31) * W);
    CAM.fogK = c.fogSigma > 0 ? c.fogSigma : 0.42;
    // дно — плоскость камеры, пересекающая стекло (z = 1) на by = camera.floorBy (видео: 1.243 — ниже кадра,
    // камера висит над дном; фото: 0.975 — тот же пол, что в depthGrid A2); процедурный риф — через floorY
    CAM.floorW = bgReady ? bgY(c.floorBy != null ? +c.floorBy : 0.975) : floorY + 4;
  }
  const projX = (X, z) => CAM.cx + (X - CAM.cx) / z;
  const projY = (Y, z) => CAM.hy + (Y - CAM.hy) / z;
  const worldX = (x, z) => CAM.cx + (x - CAM.cx) * z;
  const worldY = (y, z) => CAM.hy + (y - CAM.hy) * z;
  const sandYAt = (z) => projY(CAM.floorW, z);         // экранная линия плоскости песка на глубине z
  const waterTop = () => (bgReady ? 0 : H * 0.06);       // поверхности в кадре нет — вода до верхней кромки
  // дымка по z; ночью — ещё и «окружающий» свет LED (TV.fogMin): даже у стекла рыба чуть в синеве, а не в дневных цветах
  const fogAlpha = (z) => Math.max(TV.fogMin, z <= 1 ? 0 : 0.85 * (1 - Math.exp(-CAM.fogK * (z - 1))));

  /* ---------- глубина рифа под точкой экрана ----------
     depthGrid (A2) — поверхность рифа вдоль луча зрения. behind = true (рыба прячется): внутри
     прямоугольника окклюдера там, где поверхность ближе него (силуэт холма), предел — его zBack. */
  function reefZ(x, y, behind) {
    if (!bgReady || !SCENE.depthGrid) return 9;
    const bx = bgBX(x), by = bgBY(y);
    let g = depthAtB(bx, by);
    if (behind) {
      const oc = SCENE.occluders;
      for (let i = 0; i < oc.length; i++) {
        const o = oc[i];
        if (o.zBack > o.z && g < o.z + 0.03 && bx >= o.bx && bx <= o.bx + o.bw && by >= o.by && by <= o.by + o.bh) { g = o.zBack; break; }
      }
    }
    return g;
  }
  // наименьшая глубина рифа под прямоугольником тела: центр и 4 угла (±0.45 длины, ±0.3 высоты)
  function boxReefZ(x, y, len, h, behind) {
    const dx = 0.45 * len, dy = 0.3 * h;
    let m = reefZ(x, y, behind), v;
    v = reefZ(x - dx, y - dy, behind); if (v < m) m = v;
    v = reefZ(x + dx, y - dy, behind); if (v < m) m = v;
    v = reefZ(x - dx, y + dy, behind); if (v < m) m = v;
    v = reefZ(x + dx, y + dy, behind); if (v < m) m = v;
    return m;
  }

  /* ---------- векторные виды (фолбэк, пока PNG нет) ----------
     hScale = половина высоты тела в долях длины */
  const SPECIES = [

  function pickSpecies() {
    let total = 0;
    for (const s of SPECIES) total += s.weight;

  /* ---------- виды из fish/manifest.js: повадки (SPEC §3) и запекание спрайта ----------
     Старые поля (speedMin/Max) — запасные; повадки по умолчанию — «крейсер». */
  const HABITS = { cruise: 1, graze: 1, pick: 1, hover: 1, shoal: 1, home: 1, lurk: 1, hide: 1 };
  function normTraits(r) {
    r.habit = HABITS[r.habit] ? r.habit : "cruise";
    const tr = r.traits || {};
    r.traits = { shy: clamp(+tr.shy || 0, 0, 1), territorial: clamp(+tr.territorial || 0, 0, 1), darty: clamp(+tr.darty || 0, 0, 1) };
    const zn = Array.isArray(r.zone) ? r.zone : [0.15, 0.85];
    r.zone = [clamp(+zn[0] || 0, 0, 1), clamp(zn[1] != null ? +zn[1] : 0.85, 0, 1)];
    const zr = Array.isArray(r.zRange) ? r.zRange : [1.0, 1.8];
    r.zRange = [clamp(+zr[0] || 1, Z_GLASS, 2.4), clamp(+zr[1] || 1.8, 1.05, 2.55)];
    if (r.zRange[1] < r.zRange[0] + 0.05) r.zRange[1] = r.zRange[0] + 0.05;
    const cb = Array.isArray(r.cruiseBL) ? r.cruiseBL : [0.5, 0.95];
    r.cruiseBL = [clamp(+cb[0] || 0.5, 0.3, 1.4), clamp(+cb[1] || 0.95, 0.35, 1.5)];
    r.turnTime = clamp(+r.turnTime || 0.5, 0.35, 0.85);
    r.school = r.school && r.school.size > 1 ? { size: r.school.size | 0, spacingBL: +r.school.spacingBL || 1.2 } : null;
    r.home = typeof r.home === "string" ? r.home : null;
  }
  /* Запекание (один раз при загрузке; только композитинг, пиксели не читаются):
       mip0 — ширина ≤ 800 px (L_dev под потолком RS не больше ≈600), mip1 — ½, mip2 — ¼ (уменьшение «high»);
       fog  — силуэт ½ в цвете воды ('source-in') — второй проход дымки;
       lit  — ½: спрайт 'destination-in' вертикальный градиент (спина 1 → брюхо 0.35) + 'source-atop'
              свет светодиодов 15% — то, что добавляется 'lighter' там, где на рыбу падает луч.
     Исходное декодированное Image не держим (rec.img = mip0). */
  function bakeFish(rec, img) {
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const w0 = Math.min(FISH_MIP_CAP, iw), h0 = Math.max(1, Math.round((ih * w0) / iw));
    const mk = (w, h) => { const c = document.createElement("canvas"); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; };
    const down = (src, w, h) => {
      const c = mk(w, h), g = c.getContext("2d");
      g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
      g.drawImage(src, 0, 0, c.width, c.height);
      return c;
    };
    const m0 = down(img, w0, h0), m1 = down(m0, Math.round(w0 / 2), Math.round(h0 / 2)), m2 = down(m1, Math.round(w0 / 4), Math.round(h0 / 4));
    // V5 (R1m «рыбы наклеены»): лёгкая мягкость в каждом мипе — копия через ½ размера поверх с α 0.6
    // (≈0.5–1 device px при отрисовке; без ctx.filter): фото-рыбы были заметно резче мягкого видео вокруг
    softenMip(m0, mk); softenMip(m1, mk); softenMip(m2, mk);
    const fog = down(m1, m1.width, m1.height), fg = fog.getContext("2d");
    fg.globalCompositeOperation = "source-in"; fg.fillStyle = TV_FOG; fg.fillRect(0, 0, fog.width, fog.height);
    // основа света — спрайт × вертикальный градиент альфы (спина 1 → брюхо 0.35); градиент — один на все
    // виды, в единичных координатах (масштаб — преобразованием): перекраска по теме без новых градиентов
    const litB = down(m1, m1.width, m1.height), bg = litB.getContext("2d");
    if (!LIT_GRAD) { LIT_GRAD = bg.createLinearGradient(0, 0, 0, 1); LIT_GRAD.addColorStop(0.18, "rgba(0,0,0,1)"); LIT_GRAD.addColorStop(0.82, "rgba(0,0,0,0.35)"); }
    bg.globalCompositeOperation = "destination-in"; bg.fillStyle = LIT_GRAD;
    bg.setTransform(1, 0, 0, litB.height, 0, 0); bg.fillRect(0, 0, litB.width, 1); bg.setTransform(1, 0, 0, 1, 0, 0);
    bg.globalCompositeOperation = "source-over";
    const lit = mk(litB.width, litB.height);
    rec.base = [m0, m1, m2]; rec.mips = rec.base; rec.tm = null; rec.tq = 0;
    rec.w0 = w0; rec.h0 = h0; rec.fog = fog; rec.lit = lit; rec.litB = litB; rec.ar = ih / iw;
    rec.img = m0;
    tintLit(rec);
  }
  function softenMip(c, mk) {
    const w = c.width, h = c.height;
    if (w < 16 || h < 8) return;
    const t = mk(Math.round(w / 2), Math.round(h / 2)), tg = t.getContext("2d");
    tg.imageSmoothingEnabled = true; tg.imageSmoothingQuality = "high"; tg.drawImage(c, 0, 0, t.width, t.height);
    const g = c.getContext("2d");
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
    g.globalAlpha = 0.6; g.drawImage(t, 0, 0, w, h); g.globalAlpha = 1;
    t.width = t.height = 1;
  }
  /* V5: ночной свет на рыбах — multiply мипов в TV.fishMul (ночь ≈ 0.76/0.80/1.0: белое становится голубым, тёплые
     цвета гаснут, как у видео). Раньше ночью рыбы получали только дымку (fogMin) — белые части светились «днём».
     Копии мипов перекрашиваются ступенями по 1/8 веса ночи, по одному виду за кадр (без пиков в переходе; в тесте —
     все сразу); днём рисуется база, копии отпускаются. */
  function fishTintStep(maxN) {
    const q = Math.round(TH.k * 8) / 8;
    let n = 0;
    for (let i = 0; i < PACK.length && n < maxN; i++) {
      const r = PACK[i];

    // V5: в венце актинии — ниже «пола» камеры: актиния стоит у нижней кромки кадра, ниже плоскости дна на её
    // глубине, и клоуны висели НАД венцом, а не в нём
    const yMin = worldY(waterTop() + (0.55 * hz) / f.z + 3, f.z), yMax = nest ? Math.max(CAM.floorW - 0.38 * hz - 0.02 * L, worldY(f.hy + 0.9 * f.hry, f.z)) : CAM.floorW - 0.38 * hz - 0.02 * L;
    const tY = clamp(f.tY + f.avY, yMin, Math.max(yMin, yMax));
    if (f.z > zNow + 0.004 && !(f.state === ST.HOME && f.sub === 0)) { f.z -= Math.min(0.35 * dt, f.z - zNow); f.viol += dt; }
    if (f.z < zLo(f) - 0.004) f.z += Math.min(0.3 * dt, zLo(f) - f.z);
    const dX = f.tX + f.avX - f.X, dZw = (tz - f.z) * D;
    // разворот (ведомые стаи — по своему правилу в thinkSchool)
    if (f.school && !f.isLeader && f.state === ST.SHOAL) {
      // ведомый: разворачивается вслед ведущему через 0.1–0.4 с после НАЧАЛА его разворота («рябь» стаи)
      const ld = f.school.leader, ldDir = ld.turn.on ? -ld.dir : ld.dir;
      const want = (ldDir !== f.dir && t >= f.turnDelayUntil) || (f.dir * dX < -4 * L && t - f.lastTurn > 3);
      if (want && t - f.lastTurn > 0.8) { startTurn(f, t); return; }
    } else if (f.canTurn && f.dir * dX < -Math.max(f.turnK * L, 0.3 * Math.abs(dZw)) && t - f.lastTurn > Math.max(f.turnGap, f.turnGapS) && t >= f.turnDelayUntil) {
      startTurn(f, t); return;
    }
    // скорость
    const dist = Math.hypot(dX, tY - f.Y, dZw);
    let vd = f.spdT * L;
    if (f.arrive) vd *= clamp(dist / (1.3 * L), 0.12, 1);
    if (f.dart > 0) { vd = Math.max(vd, 2.5 * L); f.dart -= dt; }
    const tau = f.dart > 0 ? 0.12 : 0.8;
    f.v += (vd - f.v) * (1 - Math.exp(-dt / tau));
    // рыскание к цели по глубине
    const fwd = Math.max(Math.abs(dX), 0.35 * L);
    const ym = Math.min(YAW_MAX, Math.asin(Math.min(1, (DZ_MAX * D) / Math.max(f.v, 1))));
    const yawD = clamp(Math.atan2(dZw, fwd), -ym, ym);
    const yr = (f.dart > 0 ? 1.2 : 0.55) * dt;
    f.yaw = clamp(f.yaw + clamp(yawD - f.yaw, -yr, yr), -ym, ym);
    // вертикаль и тангаж
    const vyMax = Math.max(f.v, 0.3 * L) * 0.268;                 // tan 15°
    const vyD = clamp((tY - f.Y) * 0.8, -vyMax, vyMax);
    f.vy += (vyD - f.vy) * (1 - Math.exp(-dt / 0.6));
    if (f.Y < yMin) f.vy = Math.max(f.vy, (yMin - f.Y) * 1.5);
    if (f.Y > yMax) f.vy = Math.min(f.vy, (yMax - f.Y) * 1.5);
    const pD = clamp(clamp(-Math.atan2(f.vy, Math.max(f.v, 0.35 * L)), -PITCH_MAX, PITCH_MAX) + f.pitchBias, -PITCH_DOWN, PITCH_MAX);
    f.pitch += (pD - f.pitch) * (1 - Math.exp(-dt / 0.45));
    f.yawB += (f.yawBias - f.yawB) * (1 - Math.exp(-dt / 0.6));
    // движение (+ общее течение сносит медленных: «всё качается вместе»)
    const slow = 1 - smooth01(0.15, 0.6, f.v / L);
    f.X += (f.dir * f.v * Math.cos(f.yaw) + currentVX(t, f.x) * 0.35 * slow * f.z) * dt;
    f.z += ((f.v * Math.sin(f.yaw)) / D) * dt;
    f.Y += f.vy * dt;
    coralClampZ(f);
  }

  /* ---------- разворот: изгиб, ведомый головой (SPEC 4.5) ----------
     T = turnTime вида (0.35 мелкие … 0.8 групер). Через ±90° — в глубину, если у стекла мало места,
     к стеклу — если сзади риф; иначе случайно. Опорная точка идёт по малой дуге (z меняется на ~0.05–0.1). */
  function startTurn(f, t) {
    const tr = f.turn, L = f.L0, D = CAM.D;
    tr.T = clamp(f.turnT * rand(0.92, 1.08) * (f.dart > 0 || f.state === ST.FLEE || f.state === ST.CHASE ? 0.85 : 1), 0.35, 0.85);
    const yr0 = f.yaw + f.yawB;                          // курс тела вместе с наклоном «к камню» — без скачка
    tr.psi0 = f.dir > 0 ? yr0 : Math.PI - yr0;
    f.peck = -1; f.peckOff = 0;                          // клевок не переживает разворот (иначе тело прыгает)
    const room = (0.45 * L) / D + 0.03;
    const back = boxReefZ(f.x, f.y, f.len, f.h, f.allowBehind) - 0.05 - f.z;
    let into;
    if (f.z - zLo(f) < room) into = true;
    else if (back < room) into = false;
    else into = R() < 0.5;
    tr.s = (into ? 1 : -1) * f.dir;
    tr.v = clamp(f.v, 0.3 * L, 1.1 * L);
    tr.p = 0; tr.on = true;
    f.lastTurn = t;
    if (f.school && f.isLeader) {                       // ведомые повторяют с запаздыванием 0.1–0.4 с — «рябь» стаи
      const m = f.school.members;
      for (let i = 0; i < m.length; i++) if (m[i] !== f) m[i].turnDelayUntil = t + rand(0.1, 0.4);
    }
  }
  function updateTurn(f, dt) {
    const tr = f.turn;
    tr.p += dt / tr.T;
    const pp = smooth01(0, 1, (Math.min(tr.p, 1) - 0.14) / 0.65);   // курс опорной точки (u = 0.6)
    const psi = tr.psi0 + tr.s * Math.PI * pp;
    f.X += Math.cos(psi) * tr.v * dt;
    f.z += (Math.sin(psi) * tr.v * dt) / CAM.D;
    f.Y += f.vy * dt; f.vy *= Math.exp(-dt / 0.5);
    f.pitch *= Math.exp(-dt / 0.3);
    coralClampZ(f);                                      // дуга разворота не проводит рыбу сквозь колонию
    if (tr.p >= 1) {
      tr.on = false; tr.p = 0;
      const psi1 = tr.psi0 + tr.s * Math.PI, c = Math.cos(psi1), s = Math.sin(psi1);
      f.dir = c >= 0 ? 1 : -1;
      f.yaw = clamp((f.dir > 0 ? Math.atan2(s, c) : Math.atan2(s, -c)) - f.yawB, -YAW_MAX, YAW_MAX);
      f.v = tr.v;
    }
  }

  /* ---------- состояния ---------- */
  function setState(f, s, t, dur) {
    f.state = s; f.st = t; f.stDur = dur || 12; f.sub = 0; f.subT = t; f.subDur = 0; f.n2 = 0;
    f.allowBehind = false; f.pitchBias = 0; f.yawBias = 0; f.arrive = false; f.canTurn = true; f.turnK = 0.45; f.turnGapS = 1.4;
    if (s !== ST.CRUISE) { f.far = false; f.fade = 1; }
    f.spot = null; f.spot2 = null; f.tSet = false; f.spdT = f.cruise; f.other = null; f.flake = null; f.leaving = false;
    f.hCoral = null;
  }
  const hiddenFrac = (f) => f.hiddenT / Math.max(60, f.aliveT);
  // может ли рыба уплыть за край кадра (крейсеры, стая; не территориальные и не домоседы; бюджет скрытого времени)
  function canLeave(f, t) {
    if (f.habit === "home" || f.habit === "lurk" || f.tr.territorial >= 0.7) return false;
    if (f.school && !f.isLeader) return false;
    if (hiddenFrac(f) > 0.11 || t - f.lastOff < 35) return false;
    return f.habit === "cruise" || f.habit === "shoal" || f.habit === "hover" || R() < 0.25;
  }
  function spotsOf(type, f) {     // точки сцены данного типа для вида (или любые этого типа)
    const out = SPOT_TMP; out.length = 0;
    const sp = SCENE.spots || [];
    for (let i = 0; i < sp.length; i++) {
      const s = sp[i];
      if (s.type !== type) continue;
      const x = bgX(s.bx);
      if (x < 0.04 * W || x > 0.96 * W) continue;        // точка за краем этого монитора
      if (!s.species || !f.pack || s.species.indexOf(f.pack.id) >= 0) out.push(s);
    }
    if (!out.length) for (let i = 0; i < sp.length; i++) { const s = sp[i], x = bgX(s.bx); if (s.type === type && x > 0.04 * W && x < 0.96 * W) out.push(s); }
    return out;
  }
  const SPOT_TMP = [];
  const pickOne = (a) => (a.length ? a[(R() * a.length) | 0] : null);

  // следующее занятие по повадке
  function nextActivity(f, t) {
    const r = R(), h = f.habit;
    if (h === "home") { setState(f, ST.HOME, t); return; }
    if (h === "shoal" && f.school) { setState(f, ST.SHOAL, t, rand(14, 30)); return; }
    // V4b: просветы переднего рифа (enterCoral) — у видов, перечисленных в точках «coral» сцены
    if (h === "graze") { if (r < 0.1 && enterCoral(f, t)) return; if (r < 0.5) enterGraze(f, t, ST.GRAZE); else if (r < 0.85) enterCruise(f, t); else enterHover(f, t); return; }
    if (h === "pick") { if (r < 0.16 && enterCoral(f, t)) return; if (r < 0.55) enterGraze(f, t, ST.PICK); else if (r < 0.88) enterCruise(f, t); else enterHover(f, t); return; }
    if (h === "hide") { if (r < 0.2 && enterCoral(f, t)) return; if (r < 0.4 && enterHide(f, t)) return; if (r < 0.62) { enterGraze(f, t, ST.GRAZE); return; } enterCruise(f, t); return; }
    if (h === "lurk") { if (r < 0.6) enterLurk(f, t); else enterCruise(f, t, true); return; }
    if (h === "hover") { if (r < 0.2 && enterCoral(f, t)) return; if (r < 0.35) enterHover(f, t); else enterCruise(f, t); return; }
    if (r < 0.14) enterHover(f, t); else if (r < 0.22 && f.tr.territorial < 0.7) enterGraze(f, t, ST.GRAZE); else enterCruise(f, t);
  }

  // CRUISE: дальняя точка в зоне; 70% — в ту же сторону; крейсеры иногда уходят за край кадра
  function enterCruise(f, t, local) {
    setState(f, ST.CRUISE, t, rand(10, 22));
    cruiseTarget(f, t, local);
  }
  function cruiseTarget(f, t, local) {
    const pk = f.pack, zn = pk ? pk.zone : [0.15, 0.85];
    const zb = Math.min(f.zMax, f.zMin + (f.zMax - f.zMin) * (R() < 0.25 ? 1 : 0.6));
    const keep = R() < 0.82 ? f.dir : -f.dir;
    if (!local && canLeave(f, t) && R() < 0.35) {
      const x = keep > 0 ? W + 1.6 * f.len + 40 : -1.6 * f.len - 40;
      pickPoint(f, keep > 0 ? 0.88 * W : 0.02 * W, keep > 0 ? 0.98 * W : 0.12 * W, zn[0], zn[1], f.zMin, zb, false);
      setTarget(f, x, PK.y, PK.z); f.leaving = true; return;
    }
    f.leaving = false;
    const span = local ? 0.3 * W : 0.8 * W, near = local ? 0.12 * W : 0.28 * W;
    let xa, xb;
    if (keep > 0) { xa = Math.min(f.x + near, 0.9 * W); xb = Math.min(f.x + span, 0.93 * W); }
    else { xa = Math.max(f.x - span, 0.07 * W); xb = Math.max(f.x - near, 0.1 * W); }
    if (xb - xa < 0.08 * W) { if (keep > 0) { xa = 0.07 * W; xb = Math.max(0.1 * W, f.x - 0.2 * W); } else { xa = Math.min(0.9 * W, f.x + 0.2 * W); xb = 0.93 * W; } }
    pickPoint(f, xa, xb, zn[0], zn[1], f.zMin, zb, false);
    setTarget(f, PK.x, PK.y, PK.z);
  }
  function enterHover(f, t) {
    setState(f, ST.HOVER, t, rand(3, 8));
    f.spdT = rand(0.05, 0.14); f.arrive = true;
    const z = f.z, x = clamp(f.x + f.dir * 0.3 * f.len, 0.06 * W, 0.94 * W), y = f.y + rand(-0.3, 0.3) * f.h;
    setTarget(f, x, y, z);
  }
  // GRAZE / PICK: к точке на камне, нос вниз 15–25°, корпус к камню, клевки 0.1 BL
  // занятость точки: сколько рыб уже пасётся у неё (рыбы не стоят «стопкой» на одном камне)
  function spotLoad(sp, self) {
    let n = 0;
    for (let i = 0; i < fishes.length; i++) { const g = fishes[i]; if (g !== self && g.spot === sp && (g.state === ST.GRAZE || g.state === ST.PICK || g.state === ST.LURK)) n++; }
    return n;
  }
  // V5: точка (экран x, y, глубина z) занята — рядом цель пасущейся/стоящей рыбы (рамки тел перекрылись бы)
  function spotTaken(f, x, y, z) {
    const len = f.L0 / z, h = bodyH(f) / z;
    for (let i = 0; i < fishes.length; i++) {
      const g = fishes[i];
      if (g === f || isOff(g) || !(g.state === ST.GRAZE || g.state === ST.PICK || g.state === ST.LURK || g.state === ST.HOVER)) continue;
      if (Math.abs(g.tz - z) > 0.15) continue;
      const gx = projX(g.tX, g.tz), gy = projY(g.tY, g.tz), gl = g.L0 / g.tz, gh = bodyH(g) / g.tz;
      if (Math.abs(gx - x) < 0.6 * (len + gl) && Math.abs(gy - y) < 0.7 * (h + gh)) return true;
    }
    return false;
  }
  // любой камень в зоне вида на досягаемой глубине (риф перед телом ≤ zMax) — пастись можно не только у точек сцены
  function rockPoint(f) {
    if (!bgReady || !SCENE.depthGrid) return false;
    const zn = f.pack ? f.pack.zone : [0.3, 0.9];
    for (let i = 0; i < 14; i++) {
      const zg = rand(f.zMin + 0.1, f.zMax + 0.07), x = rand(0.08, 0.92) * W, y = zoneY(f, rand(zn[0], zn[1]), zg);
      const zr = reefZ(x, y, false) - 0.07;
      if (zr < f.zMin + 0.03 || zr > f.zMax) continue;
      const z = spotZ(f, x, y, zr);
      if (z < zr - 0.06) continue;                      // рядом камень ближе — тело не помещается у поверхности
      if (spotTaken(f, x, y, z)) continue;              // V5: у этого камня уже кто-то пасётся — другой камень
      PK.x = x; PK.y = y; PK.z = z; return true;
    }
    return false;
  }
  function enterGraze(f, t, kind) {
    setState(f, kind, t, rand(7, 15));
    const list = spotsOf(kind === ST.PICK ? "pick" : "graze", f);
    let sp = null, best = 1e9;
    // V5: точка — на одного (занятая не делится); из свободных — ближняя (с долей случая)
    for (let i = 0; i < list.length; i++) { const q = spotLoad(list[i], f) * 10 + (2 * Math.abs(bgX(list[i].bx) - f.x)) / W + R() * 1.2; if (q < best) { best = q; sp = list[i]; } }
    if (sp && (best >= 10 || R() < 0.35) && rockPoint(f)) {      // точка занята — или просто другой камень
      setTarget(f, PK.x, PK.y, PK.z); f.arrive = true; f.spdT = f.cruise; return;
    }
    if (sp && best >= 10) { enterCruise(f, t, true); return; }   // все точки заняты, камня рядом нет — поплавать
    if (sp) {
      f.spot = sp;
      const r = (sp.r || 0.03) * BGX.dw;
      const x = bgX(sp.bx) + rand(-0.5, 0.5) * r, y = bgY(sp.by) + rand(-0.4, 0.4) * r;
      setTarget(f, x, y, spotZ(f, x, y, sp.z));
    } else {
      // без сцены: любая точка у камня (поверхность рифа в диапазоне глубин вида) или у дна
      const zn = f.pack ? f.pack.zone : [0.3, 0.9];
      pickPoint(f, 0.1 * W, 0.9 * W, Math.max(zn[0], 0.5), zn[1], f.zMin, f.zMax, false);
      const lim = boxReefZ(PK.x, PK.y, f.L0 / PK.z, bodyH(f) / PK.z, false) - 0.07;
      setTarget(f, PK.x, PK.y, Math.max(zLo(f), Math.min(f.zMax, lim)));
    }
    f.arrive = true; f.spdT = f.cruise;
  }
  // LURK (групер): стоит у норы, изредка короткий круг рядом
  function enterLurk(f, t) {
    setState(f, ST.LURK, t, rand(14, 30));
    // V5: нора — свободная (у одной норы не стоят двое), ближняя
    const ps = spotsOf("perch", f);
    let sp = null, bq = 1e9;
    for (let i = 0; i < ps.length; i++) { const q = spotLoad(ps[i], f) * 10 + (2 * Math.abs(bgX(ps[i].bx) - f.x)) / W + R(); if (q < bq) { bq = q; sp = ps[i]; } }
    if (sp && bq >= 10) { enterCruise(f, t, true); return; }
    f.spot = sp;
    if (sp) setTarget(f, bgX(sp.bx), bgY(sp.by), spotZ(f, bgX(sp.bx), bgY(sp.by), sp.z));
    else { pickPoint(f, 0.2 * W, 0.8 * W, 0.7, 0.95, f.zMin, f.zMax, false); setTarget(f, PK.x, PK.y, PK.z); }
    f.arrive = true; f.spdT = f.cruise;
  }

  /* HIDE / PEEK (за окклюдером; сам окклюдер рисует E4 по своему z — рыба с большим z окажется за ним).
     Вход — через «портал»: точку peek на краю холма, снаружи которой открытая вода глубже неё
     (иначе туда не заплыть, не пройдя сквозь камень). Маршрут: снаружи у портала → за холм к укрытию →
     постоять → выглянуть (PEEK, голова за краем 3–6 с) → выйти через портал или спрятаться снова. */
  function occById(id) { const oc = SCENE.occluders || []; for (let i = 0; i < oc.length; i++) if (oc[i].id === id) return oc[i]; return null; }
  // направление «наружу» от окклюдера через точку peek (горизонтальное/вертикальное) → f.outX/outY;
  // точка снаружи на расстоянии k·L → PK. Возврат: открыта ли вода снаружи (всем телом; k2 — и дальше)
  function portalOut(sp, f, k, k2) {
    const o = occById(sp.behind);
    if (!o) return false;
    const cx = bgX(o.bx + o.bw / 2), cy = bgY(o.by + o.bh * 0.42), x = bgX(sp.bx), y = bgY(sp.by);
    let ux = x - cx, uy = y - cy;
    if (Math.abs(ux) * 0.8 > Math.abs(uy)) { ux = ux > 0 ? 1 : -1; uy = 0; } else { ux = 0; uy = uy > 0 ? 1 : -1; }
    f.outX = ux; f.outY = uy;
    const z = sp.z, len = f.L0 / z, hb = bodyH(f) / z;
    let ok = true;
    if (k2) { const x2 = x + ux * k2 * len, y2 = y + uy * k2 * len * 0.8; ok = boxReefZ(x2, y2, len, hb, false) - 0.06 > z; }
    PK.x = x + ux * (k || 1.1) * len; PK.y = y + uy * (k || 1.1) * len * 0.8; PK.z = z;
    return ok && reefZ(PK.x, PK.y, false) - 0.08 > z && boxReefZ(PK.x, PK.y, len, hb, false) - 0.05 > z;
  }
  // выход/вход за окклюдер: горизонтальный портал с открытой водой и у края, и дальше (есть где набрать глубину)
  function findPortal(f, behind, prefer) {
    if (prefer && portalOut(prefer, f, 1.3, 2.8) && f.outX !== 0) return prefer;
    const peeks = spotsOf("peek", f), n = peeks.length, k0 = (R() * Math.max(1, n)) | 0;
    for (let k = 0; k < n; k++) { const p = peeks[(k + k0) % n]; if (p.behind === behind && portalOut(p, f, 1.3, 2.8) && f.outX !== 0) return p; }
    // любые точки peek окклюдера (вид может быть не из списка точки)
    const all = SCENE.spots || [];
    for (let k = 0; k < all.length; k++) { const p = all[k]; if (p.type === "peek" && p.behind === behind && bgX(p.bx) > 0.04 * W && bgX(p.bx) < 0.96 * W && portalOut(p, f, 1.3, 2.8) && f.outX !== 0) return p; }
    return null;
  }
  /* HIDE: портал снаружи (набрать глубину — при нужде сначала отплыть наружу и вернуться) → за холм к
     укрытию → посидеть 5–11 с → один раз выглянуть (PEEK, 60%) → выйти через открытый портал. Без петель. */
  function enterHide(f, t) {
    if (!bgReady || !(SCENE.occluders || []).length || hiddenFrac(f) > 0.13) return false;
    const shel = spotsOf("shelter", f);
    let sh = null;
    for (let k = 0; k < 6 && !sh; k++) { const s = pickOne(shel); if (s && s.behind && occById(s.behind)) sh = s; }
    if (!sh) return false;
    // V4b (видео-сцена): укрытия за колоннами глубоко (z ≈ 1.95–2.45), а камень колонн ближе (1.3–1.8) — рыба с
    // переднего плана туда «по прямой» не нырнёт (рыскание ≤ 30°, риф по пути). Сначала — точка набора глубины в
    // открытой воде (над каньоном), откуда до портала чистая вода на этой глубине; из порталов колонны — тот, путь к
    // которому проще всего (меньше спуска по каньону); если ни к одному — не прятаться.
    let portal = null, best = 1e18, px = 0, py = 0, pz = 0, sx = 0, sy = 0;
    const all = SCENE.spots || [];
    for (let k = 0; k < all.length; k++) {
      const p = all[k];
      if (p.type !== "peek" || p.behind !== sh.behind || bgX(p.bx) < 0.04 * W || bgX(p.bx) > 0.96 * W) continue;
      if (!portalOut(p, f, 1.3, 2.8) || f.outX === 0) continue;
      portalOut(p, f, 1.3);
      const qx = PK.x, qy = PK.y, qz = PK.z;
      let c = Math.hypot(qx - f.x, qy - f.y);
      if (f.z < p.z - 0.08) { c = stagePoint(f, qx, qy, qz); if (!(c < 1e18)) continue; }
      c += R() * 40;
      if (c < best) { best = c; portal = p; px = qx; py = qy; pz = qz; sx = PK.x; sy = PK.y; }
    }
    if (!portal) return false;
    const deep = f.z < portal.z - 0.08;
    portalOut(portal, f, 1.3);                               // f.outX/outY — этого портала
    PK.x = sx; PK.y = sy; PK.z = pz;
    setState(f, ST.HIDE, t, rand(5, 11));
    f.hShel = sh; f.hPortal = portal; f.hPeeked = false; f.hGain = deep ? 1 : 0;
    if (deep) { setTarget(f, PK.x, PK.y, PK.z); f.sub = 5; f.subT = t; }
    else { setTarget(f, px, py, pz); f.sub = 0; }
    f.arrive = true; f.spdT = f.cruise;
    return true;
  }
  /* точка набора глубины z для пути к (x1, y1): в открытой воде (всем телом перед рифом на этой глубине), прямой
     отрезок до цели чистый (6 проб), в зоне вида; из подходящих — ближняя к цели (с учётом пути от рыбы). → PK */
  function clearAt(f, x, y, z) { const len = f.L0 / z, hb = bodyH(f) / z; return boxReefZ(x, y, len, hb, false) - 0.07 > z && y > waterTop() + 0.6 * hb && y < sandYAt(z) - 0.5 * hb; }
  function stagePoint(f, x1, y1, z) {
    let best = 1e18, bx = 0, by = 0;
    for (let j = 0; j < 18; j++) for (let i = 0; i < 20; i++) {
      const x = (0.06 + 0.88 * (i + 0.5) / 20) * W, y = zoneY(f, (j + 0.5) / 18, z);
      // стоимость: горизонтальный путь до портала + спуск/подъём по вертикали (медленно: тангаж ≤ 15°) ×2.5 + путь от рыбы
      const q = Math.abs(x - x1) + 2.5 * Math.abs(y - y1) + 0.35 * Math.hypot(x - f.x, y - f.y), r = 2.6 * f.L0 / z;
      // место для нырка на этой глубине: при рыскании ≤ 30° нужно ≈ (Δz·D)/tg 30° хода — чисто на 2.6 корпуса в обе
      // стороны (иначе рыба «пилит» у камня колонны, упираясь в предел глубины)
      if (q >= best || !clearAt(f, x, y, z + 0.03) || !clearAt(f, x - r, y, z) || !clearAt(f, x + r, y, z) ||
          !clearAt(f, x - 0.5 * r, y, z) || !clearAt(f, x + 0.5 * r, y, z)) continue;
      let ok = true;
      for (let k = 1; k <= 6 && ok; k++) { const u = k / 7; ok = boxReefZ(x + (x1 - x) * u, y + (y1 - y) * u, f.L0 / z, bodyH(f) / z, false) - 0.06 > z; }
      if (!ok) continue;
      best = q; bx = x; by = y;
    }
    if (best >= 1e18) return 1e18;
    PK.x = bx; PK.y = by; PK.z = z;
    return best;
  }
  function hideExit(f, t) {                    // за холмом → к открытому порталу (sub 3)
    const p = findPortal(f, f.hShel ? f.hShel.behind : (f.hPortal && f.hPortal.behind), f.hPortal);
    if (!p) { f.allowBehind = false; nextActivity(f, t); return; }
    f.hPortal = p;
    setState(f, ST.HIDE, t, 30); f.hShel = f.hShel || p; f.hPortal = p; f.hPeeked = true;
    f.allowBehind = true; f.sub = 3; f.subT = t; f.spdT = Math.min(f.cruise, 0.7);
    setTarget(f, bgX(p.bx) - f.outX * 0.3 * (f.L0 / p.z), bgY(p.by), p.z);
  }
  function enterPeek(f, t) {
    // точка peek того же окклюдера, у которой снаружи хотя бы на полкорпуса открытая вода
    const peeks = spotsOf("peek", f), n = peeks.length, k0 = (R() * Math.max(1, n)) | 0;
    let pk = null;
    for (let k = 0; k < n && !pk; k++) {
      const p = peeks[(k + k0) % n];
      if (f.hShel && p.behind === f.hShel.behind && portalOut(p, f, 0.5)) pk = p;
    }
    if (!pk) return false;
    const sh = f.hShel, pr = f.hPortal;
    setState(f, ST.PEEK, t, rand(3, 6));
    f.hShel = sh; f.hPortal = pr; f.hPeeked = true; f.spot2 = pk; f.allowBehind = true;
    portalOut(pk, f, 0.5);
    // сначала на корпус глубже края: подход изнутри наружу — значит, и смотреть будет наружу
    const z = pk.z, x = bgX(pk.bx), y = bgY(pk.by), d = f.L0 / z;
    setTarget(f, x - f.outX * 1.1 * d, y - f.outY * 0.6 * d, z);
    f.arrive = true; f.spdT = Math.min(f.cruise, 0.6); f.sub = 0;
    return true;
  }

  /* ---------- V4b: передний риф — «замок» глубины и прятки среди колоний ----------
     Колония — плоский силуэт на своей z (scene.corals). Рыба, которая ПЕРЕКРЫВАЕТ колонию (сетка альфы в позе
     покоя + запас качания), не пересекает её z: перед колонией — остаётся перед, за ней — за; иначе в момент
     пересечения она «прыгала» бы сквозь крону (порядок рисования меняется мгновенно). Сменить сторону можно
     только сбоку, вне силуэта — поэтому в просвет между колониями рыба заходит сначала на свою глубину рядом
     с колонией, а потом вбок за неё. → f.czLo / f.czHi (на шаг; поза покоя — от отрисовки не зависит). */
  const CZ_GAP = 0.015;
  function coralLock(f) {
    f.czLo = 0; f.czHi = 9;
    const cs = SCN.corals;
    if (!cs.length || !bgReady || f.far) return;
    const zl = zLo(f);
    for (let i = 0; i < cs.length; i++) {
      const c = cs[i];
      if (!c.ready && !itemReady(c)) continue;
      if (!coralHit(c, f.minX, f.minY, f.maxX, f.maxY)) continue;
      if (f.z <= c.z && c.z - CZ_GAP >= zl + 0.004) { if (c.z - CZ_GAP < f.czHi) f.czHi = c.z - CZ_GAP; }
      else if (c.z + CZ_GAP > f.czLo) f.czLo = c.z + CZ_GAP;
    }
    if (f.czLo > f.czHi) f.czHi = 9;
  }
  function coralClampZ(f) {
    if (f.z > f.czHi) f.z = f.czHi; else if (f.z < f.czLo) f.z = f.czLo;
  }
  function coralById(id) { const cs = SCN.corals; for (let i = 0; i < cs.length; i++) if (cs[i].id === id) return cs[i]; return null; }
  /* прятки В переднем рифе (scene.spots type "coral", between — колонии вокруг просвета): подплыть сбоку на
     глубину просвета (вне силуэта ближних колоний) → вбок в просвет → постоять 6–14 с, чуть смещаясь
     (сквозь крону/кружево видно рыбу — она за ближней колонией и перед дальней) → наружу тем же боком. */
  function coralEntry(f, s) {
    let x0 = 1e9, x1 = -1e9, z = s.z;
    const bt = Array.isArray(s.between) ? s.between : [];
    for (let k = 0; k < bt.length; k++) {
      const c = coralById(bt[k]);
      if (!c || !c.ready || c.z >= z) continue;            // впереди просвета — эту надо обойти сбоку
      const r = coralRest(c);
      if (r.x0 < x0) x0 = r.x0; if (r.x1 > x1) x1 = r.x1;
    }
    const sx = bgX(s.bx), sy = bgY(s.by), len = f.L0 / z;
    if (x1 < x0) { PK.x = sx; PK.y = sy; PK.z = z; return true; }
    const left = x0 - 0.75 * len, right = x1 + 0.75 * len;
    const okL = left > 0.04 * W, okR = right < 0.96 * W;
    if (!okL && !okR) return false;
    PK.x = okL && (!okR || Math.abs(f.x - left) < Math.abs(f.x - right)) ? left : right;
    PK.y = sy; PK.z = z;
    return reefZ(PK.x, PK.y, false) - 0.07 > z;
  }
  function enterCoral(f, t) {
    if (!SCN.corals.length || !f.pack) return false;
    const sp = SCENE.spots || [];
    let best = null, bq = 1e9;
    for (let i = 0; i < sp.length; i++) {
      const s = sp[i];
      if (s.type !== "coral" || !s.species || s.species.indexOf(f.pack.id) < 0) continue;
      if (s.z < f.zMin - 0.02 || s.z > f.zMax + 0.05 || bgX(s.bx) < 0.04 * W || bgX(s.bx) > 0.96 * W) continue;
      let n = 0;
      for (let j = 0; j < fishes.length; j++) if (fishes[j] !== f && fishes[j].hCoral === s) n++;
      const q = n * 10 + R() * 3;
      if (q < bq) { bq = q; best = s; }
    }
    if (!best || bq >= 10 || !coralEntry(f, best)) return false;
    setState(f, ST.HIDE, t, rand(6, 14));
    f.hCoral = best; f.sub = 10; f.subT = t;
    f.cEx = PK.x; f.cEy = PK.y;                            // точка входа/выхода (экран)
    setTarget(f, PK.x, PK.y, PK.z); f.arrive = true; f.spdT = f.cruise;
    return true;
  }
  function thinkCoral(f, dt, t) {
    const s = f.hCoral, z = s.z, L = f.L0;
    if (f.sub === 10) {                                   // к точке входа сбоку, на глубине просвета
      const near = Math.hypot(projX(f.tX, f.tz) - f.x, projY(f.tY, f.tz) - f.y) < 0.8 * f.len;
      if (near && Math.abs(f.z - z) < 0.035) {
        f.sub = 11; f.subT = t;
        setTarget(f, bgX(s.bx), bgY(s.by), z); f.spdT = Math.min(f.cruise, 0.55);
      } else if (t - f.st > 30) { nextActivity(f, t); return; }
    } else if (f.sub === 11) {                            // вбок в просвет
      if (distT(f) < 0.6 * L || t - f.subT > 14) { f.sub = 12; f.subT = t; f.n2 = 0; f.hUntil = t + f.stDur; }   // в просвете — stDur с, сколько бы ни плыла
    } else if (f.sub === 12) {                            // стоит в просвете, чуть смещается
      f.spdT = 0.1; f.arrive = true; f.turnK = 1.0; f.turnGapS = 3.5;
      if (t - f.subT > 2.2 && R() < dt * 0.3) {
        const r = (s.r || 0.03) * BGX.dw;
        setTarget(f, bgX(s.bx) + rand(-0.5, 0.5) * r, bgY(s.by) + rand(-0.35, 0.35) * r, z + rand(-0.012, 0.012)); f.subT = t;
      }
      if (t > f.hUntil) { f.sub = 13; f.subT = t; setTarget(f, f.cEx, f.cEy, z); f.spdT = Math.min(f.cruise, 0.6); f.arrive = false; }
    } else {                                              // наружу тем же боком
      if (distT(f) < 0.7 * L || t - f.subT > 14) { nextActivity(f, t); return; }
    }
  }

  // HOME (клоуны): эллипс венца актинии (scene props[home].nest, иначе spot «home»), z ± 0.025
  function homeOf(f) {
    const id = f.pack && f.pack.home;
    // V5: у каждого жильца дома своя половина венца (слот ±0.35·nest.rx): пара не стоит стопкой
    let idx = 0, cnt = 0;
    for (let i = 0; i < fishes.length; i++) { const g = fishes[i]; if (g.habit !== "home" || g.pack !== f.pack) continue; if (g === f) idx = cnt; cnt++; }
    f.hSide = cnt > 1 ? (idx % 2 ? 1 : -1) : 0;
    const pr = SCENE.props || [];
    for (let i = 0; i < pr.length && bgReady; i++) {
      const p = pr[i];
      if (p.id !== id || !p.nest) continue;
      const iw = p.imgW || 770, ih = p.imgH || 717;       // пропорции картинки (A1: 770×717); E4 может уточнить
      const w = p.bw * BGX.dw, h = (w * ih) / iw, x0 = bgX(p.bx) - w / 2, yb = bgY(p.byBottom);
      f.hx = x0 + p.nest.x * w; f.hy = yb - h + p.nest.y * h; f.hz = p.z || 1.08;
      f.hrx = p.nest.rx * w * 1.15; f.hry = p.nest.ry * h * 1.25;
      return true;
    }
    const sp = SCENE.spots || [];
    for (let i = 0; i < sp.length; i++) if (sp[i].type === "home" && (!sp[i].species || !f.pack || sp[i].species.indexOf(f.pack.id) >= 0)) {
      const s = sp[i]; f.hx = bgX(s.bx); f.hy = bgY(s.by); f.hz = s.z || 1.08; f.hrx = (s.r || 0.04) * BGX.dw; f.hry = 0.55 * f.hrx; return true;
    }
    // процедурный риф: актиния в середине у дна
    f.hx = 0.5 * W; f.hy = (bgReady ? H * 0.82 : floorY - H * 0.07); f.hz = 1.08; f.hrx = 0.06 * W; f.hry = 0.035 * W;
    return false;
  }

  /* ---------- дальний проход (z ≈ 2.25–2.3, масштаб ≈ 0.44) ----------
     По depthGrid A2 открытая вода глубже 2.3 у этого задника — только два «окна»: просвет в центре-вверху
     и щель воды над вершиной холма. Попасть туда с переднего плана при рыскании ≤ 30° нельзя (окно уже,
     чем нужно, чтобы набрать глубину), поэтому дальняя рыба выходит из-за камня в окно (край холма —
     окклюдер E4 — прячет её начало), медленно проходит его вдоль и тает в дымке у другого края; потом —
     за кадр и обычный вход с края. Окна — прогоны ≥ 2 ячеек сетки с z ≥ 2.3 (пересчёт при смене сцены). */
  const DEEP_RUNS = [];
  function buildDeepRuns() {
    DEEP_RUNS.length = 0;
    const g = SCENE.depthGrid;
    if (!g || !bgReady) return;
    for (let r = 0; r < g.rows; r++) {
      let c0 = -1;
      for (let c = 0; c <= g.cols; c++) {
        const deep = c < g.cols && g.z[r * g.cols + c] >= 2.3;
        if (deep && c0 < 0) c0 = c;
        if (!deep && c0 >= 0) {
          if (c - c0 >= 2) {
            let zm = 9;
            for (let k = c0; k < c; k++) zm = Math.min(zm, g.z[r * g.cols + k]);
            DEEP_RUNS.push({ r, zMin: zm, bx0: (c0 + 0.5) / g.cols, bx1: (c - 0.5) / g.cols, by: (r + 0.5) / g.rows });
          }
          c0 = -1;
        }
      }
    }
  }
  function startFarPass(f, t) {
    let run = null, best = 0;
    for (const q of DEEP_RUNS) {
      const z = Math.min(2.3, q.zMin - 0.12), w = bgX(q.bx1) - bgX(q.bx0);
      if (bgX(q.bx0) < 0.05 * W || bgX(q.bx1) > 0.95 * W || w < 1.25 * f.L0 / z) continue;
      const sc = w * (0.6 + 0.8 * R());
      if (sc > best) { best = sc; run = q; }
    }
    if (!run) return false;
    const z = Math.min(2.3, run.zMin - 0.12), len = f.L0 / z, x0 = bgX(run.bx0), x1 = bgX(run.bx1), y = bgY(run.by);
    const fromL = R() < 0.5, xs = fromL ? x0 + 0.1 * len : x1 - 0.1 * len, xe = fromL ? x1 - 0.05 * len : x0 + 0.05 * len;
    f.z = z; f.X = worldX(xs, z); f.Y = worldY(y, z); f.dir = fromL ? 1 : -1; f.yaw = 0; f.vy = 0; f.pitch = 0; f.turn.on = false;
    setState(f, ST.CRUISE, t, 40);
    f.far = true; f.fade = 0; f.farOut = false; f.v = 0.45 * f.L0; f.spdT = 0.45; f.canTurn = false;
    setTarget(f, xe, y, z);
    layoutFish(f);
    return true;
  }

  /* ---------- уход за кадр и возвращение (вместо телепорта, SPEC 4.6) ---------- */
  function goOffstage(f, t) {
    f.state = ST.OFF; f.st = t; f.visible = false; f.turn.on = false; f.dart = 0; f.peckOff = 0;
    const hb = hiddenFrac(f);
    f.offUntil = t + rand(4, 20) * (hb > 0.08 ? 0.35 : hb > 0.04 ? 0.7 : 1);
    f.lastOff = t; f.near = false; f.nearStage = 0; f.allowBehind = false; f.leaving = false; f.far = false; f.fade = 1;
  }
  // вход с края: новая высота и глубина; ведомые стаи — в свои слоты за ведущим
  function reenter(f, t, side, opts) {
    const zn = f.pack ? f.pack.zone : [0.15, 0.85];
    side = side || (R() < 0.5 ? -1 : 1);
    const za = opts && opts.za != null ? opts.za : f.zMin, zb = opts && opts.zb != null ? opts.zb : Math.min(f.zMax, f.zMin + 0.7 * (f.zMax - f.zMin));
    pickPoint(f, side < 0 ? 0.02 * W : 0.86 * W, side < 0 ? 0.14 * W : 0.98 * W, zn[0], zn[1], za, zb, false);
    const z = PK.z, len = f.L0 / z;
    const x = side < 0 ? -0.75 * len - 8 : W + 0.75 * len + 8;
    f.z = z; f.X = worldX(x, z); f.Y = worldY(PK.y, z);
    f.dir = -side; f.yaw = 0; f.v = f.cruise * f.L0; f.vy = 0; f.pitch = 0; f.turn.on = false; f.lastTurn = t;
    setState(f, f.school ? ST.SHOAL : ST.CRUISE, t, rand(12, 24));
    const xa = side < 0 ? 0.35 * W : 0.15 * W, xb = side < 0 ? 0.85 * W : 0.65 * W;
    pickPoint(f, xa, xb, zn[0], zn[1], f.zMin, Math.min(f.zMax, f.zMin + 0.8 * (f.zMax - f.zMin)), false);
    setTarget(f, PK.x, PK.y, PK.z);
    layoutFish(f);
  }
  function placeSlot(m, ld) {                     // ведомый — в слот за ведущим (мир), тот же курс
    const L = schoolL(ld.school), ps = ld.dir > 0 ? ld.yaw : Math.PI - ld.yaw;
    m.X = ld.X + m.slA * L * Math.cos(ps); m.z = Math.max(zLo(m), ld.z + (m.slA * L * Math.sin(ps)) / CAM.D + m.slZ);
    m.Y = ld.Y + m.slU * L * 0.55; m.dir = ld.dir; m.yaw = ld.yaw; m.v = ld.v; m.vy = 0; m.turn.on = false;
    setState(m, ST.SHOAL, ld.st, 30);
  }
  const schoolL = (sc) => sc.L;

  /* ---------- стая: ведущий + ведомые (SPEC 4.7) ----------
     Слот — позади-сбоку ведущего, рыхлое 3D-облако + медленный шум; скорость ведомого = скорость
     ведущего ± догон слота; разворот — с запаздыванием 0.1–0.4 с после ведущего. */
  function buildSchools() {
    SCHOOLS.length = 0;
    const groups = {};
    for (const f of fishes) { f.school = null; f.isLeader = false; if (f.pack && f.pack.school && f.habit === "shoal") (groups[f.pack.id] = groups[f.pack.id] || []).push(f); }
    for (const id in groups) {
      const m = groups[id];
      if (m.length < 2) continue;
      let Ls = 0; for (const f of m) Ls += f.L0; Ls /= m.length;
      const sc = { leader: m[0], members: m, L: Ls, spacing: m[0].pack.school.spacingBL, sweep: 0 };
      for (let i = 0; i < m.length; i++) {
        const f = m[i];
        f.school = sc; f.isLeader = i === 0;
        const ring = Math.ceil(i / 2);
        f.slA = i === 0 ? 0 : -(0.45 + 0.6 * ring + 0.35 * R()) * sc.spacing;
        f.slU = i === 0 ? 0 : (i % 2 ? -1 : 1) * (0.25 + 0.5 * R()) * sc.spacing;
