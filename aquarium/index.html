<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>🐠 Морской аквариум</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a4f7e;
    background: radial-gradient(120% 90% at 50% 0%, #5cb6e0 0%, #2a86bd 30%, #18639b 65%, #0c4a78 100%);
  }
  #tank { display: block; width: 100vw; height: 100vh; cursor: default; }
  body.hide-cursor #tank { cursor: none; }
  #hint {
    position: fixed; left: 18px; bottom: 16px; margin: 0; padding: 9px 14px;
    border-radius: 12px;
    font: 13px/1.5 -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    color: rgba(255,255,255,0.92);
    background: rgba(6,40,66,0.42);
    border: 1px solid rgba(255,255,255,0.16);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 22px rgba(0,0,0,0.28);
    user-select: none; pointer-events: none; transition: opacity 0.6s ease; z-index: 10;
  }
  #hint b { color: #ffd86b; font-weight: 600; }
  #hint.faded { opacity: 0; }
</style>
</head>
<body>
  <canvas id="tank"></canvas>
  <p id="hint">
    <b>F</b> — на весь экран&nbsp;&nbsp;·&nbsp;&nbsp;<b>Пробел</b> — пауза&nbsp;&nbsp;·&nbsp;&nbsp;<b>Клик</b> — покормить&nbsp;&nbsp;·&nbsp;&nbsp;<b>+ / −</b> — рыбок
  </p>

<!-- Список рыб (имена/описания/картинки). Если PNG нет — рисуются векторные рыбки. -->
<script src="fish/manifest.js"></script>
<!-- Сцена: геометрия рифа, свет, точки поведения (window.AQUARIUM_SCENE). Применяется
     только к тому заднику, для которого написана (backdrop.src). -->
<script src="scene/scene.js"></script>
<script>
"use strict";
/* ============================================================
   Морской аквариум — анимированная заставка для macOS
   Палитра подобрана под оригинал Living Marine Aquarium 2:
   тёплый насыщенный риф на холодной тропической голубой воде.
   Self-contained HTML5 Canvas, без зависимостей.
   ============================================================ */
(function () {
  const canvas = document.getElementById("tank");
  const ctx = canvas.getContext("2d", { alpha: false });
  const hint = document.getElementById("hint");

  /* ---------- флаги URL ----------
     ?wallpaper=1  режим обоев: без подсказки, курсора и управления (так грузит macOS-приложение)
     ?test=1       детерминированный режим: от rAF симуляция НЕ идёт, кадр — только по window.__aq.step()
     ?seed=N       один сидированный ГПСЧ вместо Math.random — воспроизводимые прогоны
     ?debug=1      оверлей: RS, уровень качества, счётчики вызовов canvas, мс JS на кадр
                   (?debug=2 — плюс геометрия сцены: линия пола, точки, источники пузырьков, safeX)
     ?nofilter=1   HAS_FILTER = false (как в WebKit/WKWebView, где ctx.filter выключен)
     ?nobg=1       задник не грузится — процедурный векторный риф (проверка фолбэка)
     ?gov=0        регулятор качества выключен (замеры харнессом с синтетическим временем)   */
  const PARAMS = new URLSearchParams(location.search);
  const flag = (k) => PARAMS.has(k) && PARAMS.get(k) !== "0";
  const WALLPAPER = flag("wallpaper") || window.__WALLPAPER === true;
  const TEST = flag("test"), NOBG = flag("nobg"), GOV_ON = PARAMS.get("gov") !== "0";
  const DEBUG = flag("debug") ? Math.max(1, parseInt(PARAMS.get("debug"), 10) || 1) : 0;
  const COUNTING = TEST || DEBUG > 0;          // обёртки-счётчики canvas — только в этих режимах
  // ctx.filter в WebKit выключен (SPEC F1) — в отгружаемом коде он не используется вовсе;
  // флаг оставлен для проверок (кадры с ?nofilter=1 и без должны совпадать)
  const HAS_FILTER = !flag("nofilter") && ("filter" in ctx);
  let paused = false;

  /* ---------- wallpaper / power mode (driven by the macOS app) ----------
     The app can throttle us for battery via:
       webView.evaluateJavaScript("aquariumSetPower('low')")   // 30 fps
       webView.evaluateJavaScript("aquariumSetPower('paused')")// stop drawing
       webView.evaluateJavaScript("aquariumSetPower('high')")  // 60 fps   */
  let POWER = "high";
  window.aquariumSetPower = (m) => {
    POWER = (m === "low" || m === "paused") ? m : "high";
    lastShown = 0; govReset();                   // смена режима — замер интервалов заново
  };

  /* ---------- ЕДИНЫЙ ГПСЧ (mulberry32) ----------
     Заменяет Math.random во всём движке. ?seed=N — воспроизводимо; без него — сид от часов. */
  const SEED = PARAMS.has("seed")
    ? (parseInt(PARAMS.get("seed"), 10) >>> 0)
    : ((Date.now() ^ Math.floor(performance.now() * 1000)) >>> 0);
  let rngState = SEED | 0;
  function R() {
    rngState = (rngState + 0x6D2B79F5) | 0;
    let q = rngState;
    q = Math.imul(q ^ (q >>> 15), q | 1);
    q ^= q + Math.imul(q ^ (q >>> 7), q | 61);
    return ((q ^ (q >>> 14)) >>> 0) / 4294967296;
  }

  /* ---------- счётчики вызовов canvas (только ?test=1 / ?debug=1; иначе — ноль накладных) ----------
     Обёртки на прототипе: считают и главный холст, и все offscreen-холсты. Сброс — в начале кадра. */
  const CNT = { drawImage: 0, setTransform: 0, gradients: 0, patterns: 0, save: 0, restore: 0, getImageData: 0, filter: 0 };
  const CNT_KEYS = Object.keys(CNT);
  if (COUNTING) {
    const P = CanvasRenderingContext2D.prototype;
    const wrap = (name, key) => {
      const orig = P[name];
      if (typeof orig !== "function") return;
      P[name] = function () { CNT[key]++; return orig.apply(this, arguments); };
    };
    wrap("drawImage", "drawImage"); wrap("setTransform", "setTransform");
    wrap("createLinearGradient", "gradients"); wrap("createRadialGradient", "gradients"); wrap("createConicGradient", "gradients");
    wrap("createPattern", "patterns"); wrap("save", "save"); wrap("restore", "restore");
    wrap("getImageData", "getImageData");
    const fd = Object.getOwnPropertyDescriptor(P, "filter");   // любое включение ctx.filter — нарушение правил
    if (fd && fd.set) Object.defineProperty(P, "filter", { configurable: true, enumerable: fd.enumerable, get: fd.get,
      set(v) { if (v !== "none") CNT.filter++; fd.set.call(this, v); } });
  }

  /* ---------- плотность пикселей ----------
     RS = min(DPR, √(8.3e6 / (W·H))) — буфер холста не больше ≈8.3 Мп на любом мониторе
     (SPEC §2.4: 6K «как 3840» иначе дал бы 33 Мп на КАЖДЫЙ экран), × QUALITY.rsMul от регулятора.
     Всё рисуется в CSS-пикселях: ctx.setTransform(RS, …). */
  const MAX_BACKING_PX = 8.3e6;
  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0, floorY = 0, RS = 1;
  const sizeScale = () => clamp(W / 1300, 0.8, 2.8);   // размер рыб — доля ширины экрана (как в LMA2)

  /* ---------- регулятор качества (меряет сам себя — целевого железа под рукой нет) ----------
     p90 интервала показанных кадров > 1.25× цели 5 с подряд → ступень вниз:
     частицы −50% → срезы рыб −30% → буфер каустики 0.5→0.35 → RS −15%.
     30 с хороших кадров → ступень вверх (после «отскока» ожидание удваивается, до 10 мин).
     Остальные этапы ЧИТАЮТ QUALITY.particles / fishSlices / causticScale / rsMul. */
  const QUALITY_LEVELS = [
    { particles: 1.0, fishSlices: 1.0, causticScale: 0.5,  rsMul: 1.0 },
    { particles: 0.5, fishSlices: 1.0, causticScale: 0.5,  rsMul: 1.0 },
    { particles: 0.5, fishSlices: 0.7, causticScale: 0.5,  rsMul: 1.0 },
    { particles: 0.5, fishSlices: 0.7, causticScale: 0.35, rsMul: 1.0 },
    { particles: 0.5, fishSlices: 0.7, causticScale: 0.35, rsMul: 0.85 },
  ];
  const QUALITY = Object.assign({ level: 0 }, QUALITY_LEVELS[0]);
  function setQuality(level) {
    level = clamp(level | 0, 0, QUALITY_LEVELS.length - 1);
    const prevRs = QUALITY.rsMul;
    Object.assign(QUALITY, QUALITY_LEVELS[level]);
    QUALITY.level = level;
    if (QUALITY.rsMul !== prevRs && W > 0) { applyBacking(); if (TEST) renderNow(); }
  }
  const GOV = { iv: new Float32Array(160), tmp: new Float32Array(160), n: 0, acc: 0,
                bad: 0, good: 0, p90: 0, fps: 0, recover: 30, clock: 0, lastUp: -1e9 };   // clock — мс показанных кадров
  function govReset() { GOV.n = 0; GOV.acc = 0; }
  function govSample(ms) {
    if (!(ms > 0) || ms > 500) return;           // паузы, скрытие, первый кадр — не в счёт
    GOV.fps = GOV.fps ? GOV.fps * 0.95 + (1000 / ms) * 0.05 : 1000 / ms;
    if (GOV.n < GOV.iv.length) GOV.iv[GOV.n++] = ms;
    GOV.acc += ms; GOV.clock += ms;
    if (GOV.acc < 1000) return;
    // p90 за последнюю секунду: копия в заранее выделенный буфер, сортировка на месте
    const n = GOV.n;
    for (let i = 0; i < GOV.tmp.length; i++) GOV.tmp[i] = i < n ? GOV.iv[i] : Infinity;
    GOV.tmp.sort();
    GOV.p90 = GOV.tmp[Math.min(n - 1, Math.floor(n * 0.9))];
    GOV.n = 0; GOV.acc = 0;
    const target = POWER === "low" ? 1000 / 30 : 1000 / 60;
    if (GOV.p90 > 1.25 * target) { GOV.bad++; GOV.good = 0; }
    else { GOV.bad = 0; if (GOV.p90 <= 1.1 * target) GOV.good++; else GOV.good = 0; }
    if (GOV.bad >= 5 && QUALITY.level < QUALITY_LEVELS.length - 1) {
      if (GOV.clock - GOV.lastUp < 15000) GOV.recover = Math.min(GOV.recover * 2, 600);   // без «качелей»
      setQuality(QUALITY.level + 1); GOV.bad = 0; GOV.good = 0;
    } else if (GOV.good >= GOV.recover && QUALITY.level > 0) {
      setQuality(QUALITY.level - 1); GOV.lastUp = GOV.clock; GOV.good = 0;
    }
  }

  /* ---------- math / color helpers ---------- */
  const rand = (a, b) => a + R() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const TAU = Math.PI * 2;

  function hexToRgb(h) {
    h = h.replace("#", "");
    if (h.length === 3) h = h.split("").map((c) => c + c).join("");
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  // amt in -1..1 : positive -> toward white, negative -> toward black
  function shade(hex, amt) {
    const c = hexToRgb(hex), t = amt < 0 ? 0 : 255, k = Math.abs(amt);
    return `rgb(${Math.round(c[0] + (t - c[0]) * k)},${Math.round(c[1] + (t - c[1]) * k)},${Math.round(c[2] + (t - c[2]) * k)})`;
  }
  // deterministic per-element RNG so static scenery doesn't flicker
  function srand(seed) {
    let s = (seed | 0) % 2147483647;
    if (s <= 0) s += 2147483646;
    return () => (s = (s * 16807) % 2147483647) / 2147483647;
  }

  /* ============================================================
     ЗАДНИК + СЦЕНА
       assets/reef_bg.jpg — фото рифового аквариума (цвет выправлен офлайн, этап A0);
       scene/scene.js     — геометрия сцены (window.AQUARIUM_SCENE); применяется ТОЛЬКО
                            к тому заднику, для которого написана (backdrop.src).
     Если фото нет (или ?nobg=1) — рисуется процедурный риф.
     Цветокоррекция и мягкость «запечены» в файлы: ctx.filter в WebKit выключен (SPEC F1),
     поэтому на лету — только тождество.
     ============================================================ */
  const BG_CANDIDATES = [
    "assets/reef_bg.jpg", "assets/background.jpg", "assets/background.png",
    "assets/reef.jpg", "assets/reef.png", "assets/marine.jpg",
  ];
  let bgImg = null, bgReady = false, bgSettled = false, bgSrc = null;

  // встроенные умолчания (чужой задник или процедурный фолбэк): та же схема, без геометрии рифа
  const DEFAULT_SCENE = {
    version: 1,
    backdrop: { src: null, w: 2560, h: 1355, zoom: 1.08, anchor: "bottom", safeX: [0.14, 0.86] },
    camera: { horizonBy: 0.42, zNear: 1.0, depthPx: 0.31, fogSigma: 0.42 },
    surface: { bandH: 0.075, mirrorRows: 0.14 },
    depthGrid: null, floor: null,
    light: { color: "#d6ecff",
             sources: [{ bx: 0.34, byAbove: -0.35, streaks: 5, spread: 9 }, { bx: 0.70, byAbove: -0.35, streaks: 4, spread: 8 }],
             caustics: { mask: null, strength: 0.32 } },
    occluders: [], patches: [], props: [], spots: [], bubbles: [],
  };
  let SCENE = DEFAULT_SCENE, SCENE_FROM_FILE = false;
  // сцена из файла — только для «своего» задника; недостающие разделы — из умолчаний
  function sceneFor(src) {
    const s = window.AQUARIUM_SCENE, d = DEFAULT_SCENE;
    if (!src || !s || s.version !== 1 || !s.backdrop || s.backdrop.src !== src) return null;
    const sec = (k) => Object.assign({}, d[k], s[k] || {});
    const arr = (k) => (Array.isArray(s[k]) ? s[k] : []);
    const g = s.depthGrid;
    return Object.assign({}, d, s, {
      backdrop: sec("backdrop"), camera: sec("camera"), surface: sec("surface"), light: sec("light"),
      depthGrid: g && Array.isArray(g.z) && g.z.length === g.cols * g.rows ? g : null,
      floor: Array.isArray(s.floor) && s.floor.length >= 2 ? s.floor : null,
      occluders: arr("occluders"), patches: arr("patches"), props: arr("props"), spots: arr("spots"), bubbles: arr("bubbles"),
    });
  }
  function useScene(src) {
    const s = sceneFor(src);
    SCENE = s || DEFAULT_SCENE; SCENE_FROM_FILE = !!s;
  }
  function loadBackdrop(i) {
    if (NOBG || i >= BG_CANDIDATES.length) { bgSettled = true; assetsChanged(); return; }
    const im = new Image();
    im.onload = () => {
      if (!(im.naturalWidth > 0)) { loadBackdrop(i + 1); return; }
      bgImg = im; bgSrc = BG_CANDIDATES[i]; bgReady = true; bgSettled = true;
      useScene(bgSrc); layoutBackdrop(); buildBandCache(); assetsChanged();
    };
    im.onerror = () => loadBackdrop(i + 1);
    im.src = BG_CANDIDATES[i];
  }

  // воздушная перспектива: дальние рыбы меньше, синее и мягче — варианты спрайта готовятся один раз.
  // Размытие БЕЗ ctx.filter: уменьшаем ещё в `soften` раз и растягиваем обратно (билинейный «блюр»).
  function makeLod(img) {
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const v = (scale, tint, soften) => {
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(iw * scale)); c.height = Math.max(1, Math.round(ih * scale));
      const g = c.getContext("2d");
      g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
      if (soften > 1) {
        const s = document.createElement("canvas");
        s.width = Math.max(1, Math.round(c.width / soften)); s.height = Math.max(1, Math.round(c.height / soften));
        const sg = s.getContext("2d");
        sg.imageSmoothingEnabled = true; sg.imageSmoothingQuality = "high";
        sg.drawImage(img, 0, 0, s.width, s.height);
        g.drawImage(s, 0, 0, c.width, c.height);
      } else {
        g.drawImage(img, 0, 0, c.width, c.height);
      }
      g.globalCompositeOperation = "source-atop"; g.fillStyle = `rgba(40,100,180,${tint})`; g.fillRect(0, 0, c.width, c.height);
      return c;
    };
    return [v(0.5, 0.38, 2), v(0.75, 0.18, 1.5), img];
  }

  /* ---------- проекция задника: bgMap(bx, by) → экран и обратно ----------
     cover-fit × backdrop.zoom в полосу [bandH, H] (сверху — полоса поверхности воды),
     якорь — низ кадра (песок всегда в кадре). ВСЁ, что привязано к рифу, ставится через
     эти функции в долях ФОТО, а не долями экрана (SPEC F8). Преобразование раздельное:
     bgX/bgY/bgBX/bgBY — без аллокаций; bgMap/bgUnmap пишут в out (по умолчанию общий MAP_OUT). */
  const BGX = { iw: 2560, ih: 1355, sc: 1, dx: 0, dy: 0, dw: 0, dh: 0, bandH: 0,
                sx: 0, sy: 0, sw: 1, sh: 1, x0: 0, y0: 0, x1: 0, y1: 0 };
  function layoutBackdrop() {
    const b = SCENE.backdrop;
    const iw = bgImg ? bgImg.naturalWidth : (b.w || 2560), ih = bgImg ? bgImg.naturalHeight : (b.h || 1355);
    // линия воды — по целому пикселю буфера: полоса и фото сходятся без шва
    const bandH = Math.round(H * SCENE.surface.bandH * RS) / RS;
    const ph = Math.max(1, H - bandH);
    const sc = Math.max(W / iw, ph / ih) * (b.zoom || 1);
    const dw = iw * sc, dh = ih * sc;
    const dx = (W - dw) / 2;
    const dy = b.anchor === "center" ? bandH + (ph - dh) / 2 : H - dh;
    BGX.iw = iw; BGX.ih = ih; BGX.sc = sc; BGX.dx = dx; BGX.dy = dy; BGX.dw = dw; BGX.dh = dh; BGX.bandH = bandH;
    // видимая часть: экран [0,W]×[bandH,H] → прямоугольник-источник (невидимое не рисуем)
    const x0 = Math.max(0, dx), x1 = Math.min(W, dx + dw), y0 = Math.max(bandH, dy), y1 = Math.min(H, dy + dh);
    BGX.x0 = x0; BGX.x1 = x1; BGX.y0 = y0; BGX.y1 = y1;
    BGX.sx = clamp((x0 - dx) / sc, 0, iw); BGX.sy = clamp((y0 - dy) / sc, 0, ih);
    BGX.sw = Math.max(1e-3, Math.min(iw - BGX.sx, (x1 - x0) / sc));
    BGX.sh = Math.max(1e-3, Math.min(ih - BGX.sy, (y1 - y0) / sc));
  }
  const bgX = (bx) => BGX.dx + bx * BGX.dw;
  const bgY = (by) => BGX.dy + by * BGX.dh;
  const bgBX = (x) => (x - BGX.dx) / BGX.dw;
  const bgBY = (y) => (y - BGX.dy) / BGX.dh;
  const MAP_OUT = [0, 0];
  function bgMap(bx, by, out) { out = out || MAP_OUT; out[0] = bgX(bx); out[1] = bgY(by); return out; }
  function bgUnmap(x, y, out) { out = out || MAP_OUT; out[0] = bgBX(x); out[1] = bgBY(y); return out; }
  function drawBackdrop() {
    ctx.drawImage(bgImg, BGX.sx, BGX.sy, BGX.sw, BGX.sh, BGX.x0, BGX.y0, BGX.x1 - BGX.x0, BGX.y1 - BGX.y0);
  }

  /* ---------- полоса поверхности воды (статичная заглушка до этапа E1) ----------
     Снизу поверхность — зеркало (полное внутреннее отражение): верхние mirrorRows фото от линии
     воды, перевёрнутые, смягчённые проходом 1/8 вниз-вверх, ×0.55 и на 30% к #0d2a4a.
     E1 оживит её (полосы со сдвигом, блики каустики, мениск). */
  let bandCanvas = null;
  function buildBandCache() {
    const bh = BGX.bandH;
    if (!bgImg || bh < 1 || W < 1) { bandCanvas = null; return; }
    const ih = BGX.ih;
    const sy = clamp((bh - BGX.dy) / BGX.sc, 0, ih - 1);          // строка фото на линии воды
    const sh = Math.max(1, Math.min(ih - sy, SCENE.surface.mirrorRows * ih));
    const tw = Math.max(8, Math.round(W / 8)), th = Math.max(2, Math.round(bh / 8));
    const tiny = document.createElement("canvas"); tiny.width = tw; tiny.height = th;
    const g = tiny.getContext("2d");
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
    g.setTransform(1, 0, 0, -1, 0, th);                             // переворот по вертикали
    g.drawImage(bgImg, BGX.sx, sy, BGX.sw, sh, 0, 0, tw, th);
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = "multiply"; g.fillStyle = "rgb(140,140,140)"; g.fillRect(0, 0, tw, th);   // ×0.55
    g.globalCompositeOperation = "source-over"; g.fillStyle = "rgba(13,42,74,0.3)"; g.fillRect(0, 0, tw, th);
    const c = bandCanvas || document.createElement("canvas");
    c.width = Math.max(1, Math.ceil(W * RS / 2)); c.height = Math.max(1, Math.ceil(bh * RS / 2));
    const cg = c.getContext("2d");
    cg.imageSmoothingEnabled = true; cg.imageSmoothingQuality = "high";
    cg.drawImage(tiny, 0, 0, c.width, c.height);
    bandCanvas = c;
  }

  // планктон — медленно дрейфующие светлые частицы: оживляют толщу воды над рендером
  // (движение — в simulate(), здесь только рисование; доля частиц — QUALITY.particles)
  let plankton = [];
  function seedPlankton() {
    plankton = [];
    for (let i = 0; i < 70; i++) plankton.push({ x: rand(0, W), y: rand(0, H), r: rand(0.8, 2.2), vx: rand(-6, 6), vy: rand(-4, 2), ph: rand(0, TAU) });
  }
  function updatePlankton(t, dt) {
    for (let i = 0; i < plankton.length; i++) {
      const p = plankton[i];
      p.x += p.vx * dt; p.y += p.vy * dt + Math.sin(t * 0.7 + p.ph) * 6 * dt;
      if (p.x < -5) p.x = W + 5; else if (p.x > W + 5) p.x = -5;
      if (p.y < -5) p.y = H + 5; else if (p.y > H + 5) p.y = -5;
    }
  }
  function drawPlankton(t) {
    ctx.save(); ctx.fillStyle = "rgba(210,235,255,0.5)";
    const n = Math.round(plankton.length * QUALITY.particles);
    for (let i = 0; i < n; i++) {
      const p = plankton[i];
      ctx.globalAlpha = 0.2 + 0.25 * (0.5 + 0.5 * Math.sin(t * 1.3 + p.ph));
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  /* ============================================================
     FISH SPECIES  (colors measured against the original cast)
     hScale = half-height as fraction of body length
     ============================================================ */
  const SPECIES = [
    { name: "clown", hScale: 0.46, back: "#e25a12", main: "#ff8a24", belly: "#ffd9a8",
      fin: "rgba(255,150,70,0.95)", tail: "#ff8420", pattern: "bands",
      bands: [0.58, 0.10, -0.36], bandColor: "#fdfdfd", bandEdge: "rgba(25,15,8,0.5)", weight: 3 },

    { name: "regal", hScale: 0.50, back: "#0d2f8a", main: "#1f63d6", belly: "#86b4f5",
      fin: "rgba(40,90,210,0.92)", tail: "#ffd21a", pattern: "regal", markColor: "#0a1430", weight: 2 },

    { name: "yellowtang", hScale: 0.62, back: "#e8a200", main: "#ffd21a", belly: "#fff0a8",
      fin: "rgba(255,180,0,0.95)", tail: "#ffbe00", pattern: null, blunt: true, weight: 2 },

    { name: "puffer", hScale: 0.58, back: "#cdbf9e", main: "#ece2cc", belly: "#fff6ec",
      fin: "rgba(225,212,188,0.92)", tail: "#dccfb2", pattern: "spots",
      spotColor: "rgba(70,52,34,0.85)", blunt: true, weight: 1 },

    { name: "damsel", hScale: 0.48, back: "#1a2740", main: "#26344f", belly: "#33425e",
      fin: "rgba(40,55,80,0.9)", tail: "#ffce1f", pattern: "bicolor", backColor: "#ffce1f", weight: 2 },

    { name: "coralfish", hScale: 0.50, back: "#c0263c", main: "#ff6f7d", belly: "#ffd4d8",
      fin: "rgba(255,160,170,0.92)", tail: "#f0556a", pattern: null, weight: 2 },

    { name: "chromis", hScale: 0.42, back: "#1e4f9e", main: "#3f86d8", belly: "#bfe0ff",
      fin: "rgba(120,180,240,0.85)", tail: "#2f6fc0", pattern: null, small: true, weight: 4 },
  ];
  const SP_BY_NAME = {};
  for (const s of SPECIES) SP_BY_NAME[s.name] = s;

  function pickSpecies() {
    let total = 0;
    for (const s of SPECIES) total += s.weight;
    let r = R() * total;
    for (const s of SPECIES) { r -= s.weight; if (r <= 0) return s; }
    return SPECIES[0];
  }

  /* ---------- realistic sprite pack (loaded from fish/manifest.js) ----------
     Each entry may carry a transparent-PNG `image` (fish facing RIGHT). While
     an image is missing/loading, the matching vector `fallback` species draws
     instead — so the tank looks right immediately and upgrades as art lands. */
  const PACK = [];
  (function buildPack() {
    const m = window.FISH_MANIFEST;
    if (!m || !Array.isArray(m.fish)) return;
    for (const e of m.fish) {
      const rec = Object.assign({ count: 1, sizeMin: 70, sizeMax: 120, speedMin: 28, speedMax: 56 }, e);
      rec.img = null; rec.ready = false;
      // виды с count: 0 не заселяются — их картинку и не запрашиваем (ноль упавших запросов)
      if (e.image && rec.count > 0) {
        const im = new Image();
        im.onload = () => { if (im.naturalWidth > 0) { rec.img = im; rec.lod = makeLod(im); rec.ready = true; } };
        im.onerror = () => { rec.ready = false; rec.failed = true; };
        im.src = e.image;
      }
      PACK.push(rec);
    }
  })();
  // виды с count: 0 (нет картинки) и виды, чьё фото не нашлось, не заселяются
  const activePacks = () => PACK.filter((p) => p.count > 0 && !p.failed);
  function pickPack() {
    const list = activePacks();
    if (!list.length) return null;
    let total = 0; for (const p of list) total += p.count;
    let r = R() * total;
    for (const p of list) { r -= p.count; if (r <= 0) return p; }
    return list[0];
  }

  /* ---------- fish factory ---------- */
  function makeFish(opts) {
    opts = opts || {};
    const pack = opts.pack || (PACK.length && !opts.species ? pickPack() : null);
    const sp = opts.species || (pack && SP_BY_NAME[pack.fallback]) || pickSpecies();
    let depth = opts.depth != null ? opts.depth : R();
    let len;
    if (pack) {
      len = rand(pack.sizeMin, pack.sizeMax) * (0.7 + depth * 0.5) * sizeScale();
    } else {
      len = rand(50, 96) * (0.55 + depth * 0.6) * sizeScale();
      if (sp.small) { len *= 0.6; depth = Math.min(depth, 0.45); }
    }

    const f = {
      sp, pack, len, depth,
      x: opts.x != null ? opts.x : rand(0, W),
      y: opts.y != null ? opts.y : rand(H * 0.12, floorY - len * 0.4),
      facing: R() < 0.5 ? 1 : -1,
      base: (pack ? rand(pack.speedMin, pack.speedMax) * (0.7 + depth * 0.4) : rand(26, 58) * (0.6 + depth * 0.7)),
      vx: 0, vy: 0,
      drift: rand(-10, 10), driftTimer: rand(1.5, 4),
      phase: rand(0, TAU), swimFreq: rand(5.5, 8.5),
      bob: rand(0.6, 1.6), bobAmp: rand(1.5, 4),
      boost: 0,
      alpha: 0.5 + depth * 0.5,
    };
    f.vx = f.facing * f.base;
    if (sp.pattern === "spots") {
      f.spots = [];
      const n = 15;
      for (let i = 0; i < n; i++) {
        f.spots.push({
          x: rand(-0.42, 0.40) * f.len,
          y: rand(-0.85, 0.85) * f.len * sp.hScale,
          r: rand(0.022, 0.05) * f.len,
        });
      }
    }
    return f;
  }

  function updateFish(f, dt, t) {
    // feeding: steer toward nearest pellet
    let target = null, bestD = 320 * 320;
    for (let i = 0; i < pellets.length; i++) {
      const p = pellets[i];
      const dx = p.x - f.x, dy = p.y - f.y, d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; target = p; }
    }
    let desVx, desVy;
    if (target) {
      const dx = target.x - f.x, dy = target.y - f.y, m = Math.hypot(dx, dy) || 1, sp = f.base * 1.9;
      desVx = (dx / m) * sp; desVy = (dy / m) * sp;
      if (m < f.len * 0.45) { target.eaten = true; f.boost = 0.5; }
    } else {
      f.driftTimer -= dt;
      if (f.driftTimer <= 0) { f.drift = rand(-12, 12); f.driftTimer = rand(1.5, 4.5); }
      desVx = f.facing * f.base * (1 + f.boost);
      desVy = f.drift;
    }
    // в фото-режиме сверху полоса поверхности воды — рыба держится под ней
    const top = bgReady ? BGX.bandH : 0;
    const topLim = Math.max(H * 0.10, top + f.len * 0.45), botLim = floorY - f.len * 0.32;
    if (f.y < topLim) desVy += (topLim - f.y) * 1.6;
    if (f.y > botLim) desVy -= (f.y - botLim) * 1.6;

    const k = 1 - Math.exp(-dt * 2.6);
    f.vx += (desVx - f.vx) * k;
    f.vy += (desVy - f.vy) * k;
    f.boost *= Math.exp(-dt * 1.5);
    f.x += f.vx * dt; f.y += f.vy * dt;

    if (f.vx > 6) f.facing = 1; else if (f.vx < -6) f.facing = -1;
    const margin = f.len;
    if (f.x < -margin) { f.x = W + margin; f.y = rand(H * 0.14, floorY - f.len * 0.4); }
    else if (f.x > W + margin) { f.x = -margin; f.y = rand(H * 0.14, floorY - f.len * 0.4); }
    f.y = clamp(f.y, Math.max(H * 0.06, top + f.len * 0.25), floorY - f.len * 0.28);
  }

  // 2.5D PNG-рыба (нос вправо): тело идёт волной по вертикальным полосам,
  // хвост виляет сильнее всего; + наклон по вертикали, bob, глубина.
  // (Висящая в воде «контактная» тень-градиент убрана: читалась как наклейка, SPEC F7.)
  function drawSpriteFish(f, t) {
    const img = f.pack.lod ? f.pack.lod[f.depth < 0.35 ? 0 : f.depth < 0.7 ? 1 : 2] : f.pack.img;
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    const L = f.len, ar = (ih / iw) || 0.5, w = L, h = L * ar;
    const speedFrac = clamp(Math.hypot(f.vx, f.vy) / (f.base * 1.4), 0.25, 1.6);
    const bob = Math.sin(t * f.bob + f.phase) * f.bobAmp;
    const tilt = clamp(f.vy / 280, -0.26, 0.26);

    ctx.save();
    ctx.translate(f.x, f.y + bob);
    ctx.scale(f.facing, 1);          // нос вправо по умолчанию; флип по направлению
    ctx.rotate(tilt);
    ctx.globalAlpha = f.alpha;

    // бегущая волна вдоль тела через вертикальные полосы
    // u=0 — хвост (слева), u=1 — нос (справа); амплитуда максимум у хвоста
    const n = Math.max(8, Math.round(22 * QUALITY.fishSlices));
    const amp = h * (0.03 + 0.05 * speedFrac);   // объёмные 3D-рыбы гнутся мягче
    const K = 5.0; // длина волны вдоль тела
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1);
      const sx = (i / n) * iw, sw = iw / n;
      const dx = -w / 2 + (i / n) * w, dw = w / n + 1.0;
      const yo = Math.sin(t * f.swimFreq - u * K + f.phase) * amp * (1 - u) * (1 - u);
      ctx.drawImage(img, sx, 0, sw, ih, dx, -h / 2 + yo, dw, h);
    }
    ctx.restore();
  }

  function drawFish(f, t) {
    if (f.pack && f.pack.ready) { drawSpriteFish(f, t); return; }
    if (f.pack && f.pack.image) return;            // фото ещё грузится или не нашлось — мультяшную замену не рисуем
    const sp = f.sp, L = f.len, Hh = L * sp.hScale;
    const speedFrac = clamp(Math.hypot(f.vx, f.vy) / (f.base * 1.4), 0.25, 1.8);
    const wag = Math.sin(t * f.swimFreq + f.phase) * 0.5 * speedFrac;
    const yaw = Math.sin(t * f.swimFreq + f.phase - 0.6) * 0.05 * speedFrac;
    const bob = Math.sin(t * f.bob + f.phase) * f.bobAmp;
    const noseX = sp.blunt ? 0.44 : 0.50;

    ctx.save();
    ctx.translate(f.x, f.y + bob);
    ctx.scale(f.facing, 1);
    ctx.rotate(yaw);
    ctx.globalAlpha = f.alpha;

    // soft depth shadow
    const sh = ctx.createRadialGradient(0, Hh * 0.2, L * 0.1, 0, Hh * 0.2, L * 0.7);
    sh.addColorStop(0, "rgba(0,25,45,0.16)"); sh.addColorStop(1, "rgba(0,25,45,0)");
    ctx.fillStyle = sh;
    ctx.beginPath(); ctx.ellipse(0, Hh * 0.25, L * 0.62, Hh * 0.85, 0, 0, TAU); ctx.fill();

    // TAIL
    ctx.save();
    ctx.translate(-L * 0.46, 0); ctx.rotate(wag);
    ctx.fillStyle = sp.tail;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-L * 0.20, -Hh * 0.70, -L * 0.40, -Hh * 0.80);
    ctx.quadraticCurveTo(-L * 0.30, 0, -L * 0.40, Hh * 0.80);
    ctx.quadraticCurveTo(-L * 0.20, Hh * 0.70, 0, 0);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // DORSAL FIN
    ctx.fillStyle = sp.fin;
    ctx.beginPath();
    ctx.moveTo(L * 0.18, -Hh * 0.46);
    ctx.quadraticCurveTo(-L * 0.02, -Hh * 1.10, -L * 0.26, -Hh * 0.42);
    ctx.quadraticCurveTo(-L * 0.05, -Hh * 0.32, L * 0.18, -Hh * 0.46);
    ctx.closePath(); ctx.fill();

    // BODY
    ctx.beginPath();
    ctx.moveTo(L * noseX, 0);
    ctx.quadraticCurveTo(L * 0.22, -Hh * 1.04, -L * 0.16, -Hh * 0.92);
    ctx.quadraticCurveTo(-L * 0.42, -Hh * 0.62, -L * 0.46, 0);
    ctx.quadraticCurveTo(-L * 0.42, Hh * 0.62, -L * 0.16, Hh * 0.92);
    ctx.quadraticCurveTo(L * 0.22, Hh * 1.04, L * noseX, 0);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, -Hh, 0, Hh);
    grad.addColorStop(0, sp.back);
    grad.addColorStop(0.42, sp.main);
    grad.addColorStop(1, sp.belly);
    ctx.fillStyle = grad; ctx.fill();
    // crisp outline so fish pop against the water
    ctx.strokeStyle = "rgba(10,25,40,0.28)";
    ctx.lineWidth = L * 0.018; ctx.stroke();

    // PATTERNS (clipped to body)
    if (sp.pattern) {
      ctx.save(); ctx.clip();
      if (sp.pattern === "bands") {
        for (let i = 0; i < sp.bands.length; i++) {
          const bx = sp.bands[i] * L, bw = L * 0.11;
          ctx.fillStyle = sp.bandColor;
          ctx.beginPath();
          ctx.moveTo(bx + bw, -Hh * 1.2); ctx.lineTo(bx - bw * 0.6, -Hh * 1.2);
          ctx.lineTo(bx - bw, Hh * 1.2); ctx.lineTo(bx + bw * 0.4, Hh * 1.2);
          ctx.closePath(); ctx.fill();
          if (sp.bandEdge) { ctx.strokeStyle = sp.bandEdge; ctx.lineWidth = L * 0.012; ctx.stroke(); }
        }
      } else if (sp.pattern === "spots") {
        ctx.fillStyle = sp.spotColor;
        for (const s of f.spots) { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill(); }
      } else if (sp.pattern === "bicolor") {
        ctx.fillStyle = sp.backColor;
        ctx.beginPath();
        ctx.moveTo(-L * 0.5, -Hh * 1.2); ctx.lineTo(-L * 0.02, -Hh * 1.2);
        ctx.lineTo(-L * 0.14, Hh * 1.2); ctx.lineTo(-L * 0.5, Hh * 1.2);
        ctx.closePath(); ctx.fill();
      } else if (sp.pattern === "regal") {
        ctx.fillStyle = sp.markColor;
        ctx.beginPath(); ctx.ellipse(-L * 0.04, -Hh * 0.08, L * 0.34, Hh * 0.7, -0.15, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }

    // top sheen
    ctx.globalAlpha = f.alpha * 0.22;
    const sheen = ctx.createLinearGradient(0, -Hh, 0, 0);
    sheen.addColorStop(0, "rgba(255,255,255,0.8)"); sheen.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = sheen;
    ctx.beginPath(); ctx.ellipse(L * 0.05, -Hh * 0.45, L * 0.32, Hh * 0.34, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = f.alpha;

    // PECTORAL FIN
    const flap = 0.55 + Math.sin(t * f.swimFreq * 1.1 + f.phase) * 0.45;
    ctx.fillStyle = sp.fin;
    ctx.save();
    ctx.translate(L * 0.08, Hh * 0.34); ctx.scale(1, flap);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-L * 0.18, Hh * 0.32, -L * 0.30, Hh * 0.10);
    ctx.quadraticCurveTo(-L * 0.16, -Hh * 0.05, 0, 0);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // EYE
    const ex = L * (noseX - 0.18), ey = -Hh * 0.12, er = L * 0.066;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, ey, er, 0, TAU); ctx.fill();
    ctx.fillStyle = "#10202b"; ctx.beginPath(); ctx.arc(ex + er * 0.18, ey, er * 0.62, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.beginPath(); ctx.arc(ex - er * 0.2, ey - er * 0.25, er * 0.22, 0, TAU); ctx.fill();

    ctx.restore();
  }

  /* ============================================================
     BUBBLES + FOOD
     ============================================================ */
  function makeBubble(x, y) {
    return { x: x != null ? x : rand(0, W), y: y != null ? y : floorY - rand(0, 30),
      r: rand(1.6, 5.5), vy: rand(28, 70), phase: rand(0, TAU), wob: rand(0.5, 1.4) };
  }
  function updateBubble(b, dt, t) { b.y -= b.vy * dt; b.x += Math.sin(t * b.wob + b.phase) * 14 * dt; return b.y > -10; }
  function drawBubble(b) {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.strokeStyle = "rgba(225,248,255,0.6)"; ctx.lineWidth = 1;
    ctx.fillStyle = "rgba(200,235,255,0.07)"; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.34, 0, TAU);
    ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.fill();
  }
  function spawnFood(x, y) {
    const n = randInt(5, 8);
    for (let i = 0; i < n; i++)
      pellets.push({ x: x + rand(-18, 18), y: y + rand(-10, 10), vy: rand(18, 40), vx: rand(-8, 8), r: rand(2, 3.4), age: 0, eaten: false });
    for (let i = 0; i < 6; i++) bubbles.push(makeBubble(x + rand(-20, 20), y));
  }
  function updatePellet(p, dt) {
    p.age += dt; p.vy += 14 * dt; p.vx *= Math.exp(-dt * 1.2);
    p.y += p.vy * dt; p.x += p.vx * dt;
    if (p.y > floorY - 2) { p.y = floorY - 2; p.vy = 0; }
    return !p.eaten && p.age < 14;
  }
  function drawPellet(p) {
    ctx.globalAlpha = clamp(14 - p.age, 0, 1);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU);
    ctx.fillStyle = "#8a5a2b"; ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* ============================================================
     SCENERY — reef composition rebuilt on resize
     ============================================================ */
  let reef = [], kelp = [], backReef = [], rubble = [];
  const U = () => (W / 1280) * 1.5; // size unit (reference 1280-wide, ×1.5 for a tall, dense reef)

  function buildScenery() {
    // composition left -> right, echoing the original layout, drawn back->front
    const layout = [
      // continuous rocky base ridge (back)
      { type: "rock", x: 0.08, w: 0.30, h: 0.15, color: "#5e472d" },
      { type: "rock", x: 0.34, w: 0.30, h: 0.18, color: "#6b5036" },
      { type: "rock", x: 0.60, w: 0.32, h: 0.17, color: "#5a4329" },
      { type: "rock", x: 0.88, w: 0.30, h: 0.15, color: "#604a30" },
      // left group — warm yellows/orange
      { type: "soft", x: 0.05, scale: 1.0, color: "#ffd21a" },
      { type: "soft", x: 0.11, scale: 0.78, color: "#ffb300" },
      { type: "sponge", x: 0.15, scale: 1.0, color: "#e8631a" },
      { type: "tubes", x: 0.21, scale: 0.9, color: "#cf9a5c" },
      // center-left
      { type: "tubes", x: 0.30, scale: 1.0, color: "#d68f86" },
      { type: "soft", x: 0.36, scale: 0.72, color: "#ffcf3a" },
      { type: "staghorn", x: 0.43, scale: 1.1, color: "#dcdcce" },
      { type: "barrel", x: 0.57, scale: 1.05, color: "#cf9a5c" },
      // center-right tall tubes
      { type: "tubes", x: 0.66, scale: 1.3, color: "#d79a64", tall: true },
      { type: "soft", x: 0.73, scale: 0.78, color: "#ff8a24" },
      // right group — pink / purple / blue accents
      { type: "fan", x: 0.79, scale: 1.1, color: "#8a5fbf" },
      { type: "sponge", x: 0.84, scale: 1.0, color: "#ef5fa0" },
      { type: "staghorn", x: 0.88, scale: 0.78, color: "#d2d2c2" },
      { type: "soft", x: 0.93, scale: 0.85, color: "#ffd21a" },
      { type: "coralblue", x: 0.97, scale: 0.9, color: "#5a6fd0" },
      // foreground accents (drawn last)
      { type: "anemone", x: 0.50, scale: 1.0, color: "#e58aa0" },
      { type: "star", x: 0.90, scale: 1.0, color: "#d8392a" },
      { type: "crab", x: 0.12, scale: 1.0, color: "#b04a2c" },
    ];
    reef = layout.map((e, i) => Object.assign({ seed: 1000 + i * 7 }, e));

    // green seaweed
    kelp = [];
    const clusters = clamp(Math.round(W / 320), 3, 6);
    for (let c = 0; c < clusters; c++) {
      const baseX = (W / clusters) * (c + rand(0.2, 0.8));
      const blades = randInt(3, 5);
      const hue = rand(115, 150);
      for (let b = 0; b < blades; b++)
        kelp.push({ x: baseX + rand(-30, 30), h: rand(H * 0.14, H * 0.30), w: rand(6, 13),
          phase: rand(0, TAU), speed: rand(0.7, 1.3), amp: rand(10, 24), hue });
    }

    // hazy distant reef silhouettes near the reef line (depth)
    backReef = [];
    const n = clamp(Math.round(W / 180), 5, 12);
    for (let i = 0; i < n; i++)
      backReef.push({ x: (W / n) * (i + rand(0.1, 0.9)), w: rand(W * 0.10, W * 0.22),
        h: rand(H * 0.04, H * 0.12), a: rand(0.12, 0.30) });

    // colourful coral rubble scattered along the reef base
    rubble = [];
    const cols = ["#e8631a", "#ffd21a", "#d68f86", "#ef5fa0", "#8a5fbf", "#5fae5a", "#cf9a5c", "#ff8a24"];
    const rn = clamp(Math.round(W / 20), 30, 95);
    for (let i = 0; i < rn; i++)
      rubble.push({ x: rand(0, W), y: floorY - H * 0.03 + rand(0, (H - floorY) * 0.85),
        r: rand(7, 18) * U(), color: cols[(R() * cols.length) | 0], flat: 0.45 + R() * 0.4 });
    rubble.sort((a, b) => a.y - b.y); // back-to-front
    streamX = W * 0.72; // источник вертикального потока пузырьков (как в оригинале)
  }

  /* ---------- reef element drawers ---------- */
  function drawRock(ex, base, w, h, color) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(ex - w / 2, base + 8);
    const steps = 9;
    for (let i = 0; i <= steps; i++) {
      const f = i / steps, x = ex - w / 2 + f * w;
      const y = base + 8 - Math.sin(f * Math.PI) * h * (0.7 + 0.3 * Math.sin(f * 9 + ex));
      ctx.lineTo(x, y);
    }
    ctx.lineTo(ex + w / 2, base + 8); ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    const g = ctx.createLinearGradient(0, base - h, 0, base);
    g.addColorStop(0, "rgba(255,255,255,0.10)"); g.addColorStop(1, "rgba(0,0,0,0.28)");
    ctx.fillStyle = g; ctx.fill();
    ctx.restore();
  }

  function drawSoftCoral(ex, base, s, color, rng) {
    const u = U() * s;
    ctx.save(); ctx.translate(ex, base + 4);
    const n = 11, spread = 60 * u, height = 96 * u;
    for (let i = 0; i < n; i++) {
      const fx = (rng() * 2 - 1) * spread, fy = -height * (0.35 + 0.65 * rng()), r = (9 + rng() * 11) * u;
      ctx.strokeStyle = shade(color, -0.2); ctx.lineWidth = 3 * u; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(fx * 0.3, 0); ctx.quadraticCurveTo(fx * 0.6, fy * 0.6, fx, fy); ctx.stroke();
      const g = ctx.createRadialGradient(fx - r * 0.3, fy - r * 0.3, r * 0.2, fx, fy, r);
      g.addColorStop(0, shade(color, 0.28)); g.addColorStop(1, color);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(fx, fy, r, 0, TAU); ctx.fill();
      ctx.fillStyle = shade(color, -0.18);
      for (let d = 0; d < 4; d++) { const a = rng() * TAU, rr = rng() * r * 0.6; ctx.beginPath(); ctx.arc(fx + Math.cos(a) * rr, fy + Math.sin(a) * rr, r * 0.12, 0, TAU); ctx.fill(); }
    }
    ctx.restore();
  }

  function tubeBody(tx, w, h, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(tx - w / 2, 0);
    ctx.lineTo(tx - w / 2, -h + w * 0.25);
    ctx.quadraticCurveTo(tx - w / 2, -h, tx, -h);
    ctx.quadraticCurveTo(tx + w / 2, -h, tx + w / 2, -h + w * 0.25);
    ctx.lineTo(tx + w / 2, 0);
    ctx.closePath(); ctx.fill();
  }
  function drawTubes(ex, base, s, color, tall, rng) {
    const u = U() * s;
    ctx.save(); ctx.translate(ex, base + 4);
    const n = 4 + (rng() * 3 | 0);
    for (let i = 0; i < n; i++) {
      const tx = (i - (n - 1) / 2) * 18 * u + (rng() * 2 - 1) * 6 * u;
      const h = (tall ? 158 : 92) * u * (0.7 + 0.6 * rng());
      const w = (15 + rng() * 9) * u;
      const g = ctx.createLinearGradient(tx - w / 2, 0, tx + w / 2, 0);
      g.addColorStop(0, shade(color, -0.30)); g.addColorStop(0.42, shade(color, 0.18)); g.addColorStop(1, shade(color, -0.30));
      tubeBody(tx, w, h, g);
      ctx.fillStyle = shade(color, -0.5); ctx.beginPath(); ctx.ellipse(tx, -h, w * 0.34, w * 0.18, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = shade(color, 0.28); ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.ellipse(tx - w * 0.12, -h, w * 0.12, w * 0.07, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawBarrel(ex, base, s, color, rng) {
    const u = U() * s;
    ctx.save(); ctx.translate(ex, base + 4);
    const w = 76 * u, h = 84 * u;
    const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    g.addColorStop(0, shade(color, -0.30)); g.addColorStop(0.45, shade(color, 0.16)); g.addColorStop(1, shade(color, -0.30));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-w / 2, 0);
    ctx.bezierCurveTo(-w * 0.6, -h * 0.7, -w * 0.4, -h, 0, -h);
    ctx.bezierCurveTo(w * 0.4, -h, w * 0.6, -h * 0.7, w / 2, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade(color, -0.52); ctx.beginPath(); ctx.ellipse(0, -h, w * 0.32, w * 0.14, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = shade(color, -0.72); ctx.beginPath(); ctx.ellipse(0, -h + 2, w * 0.22, w * 0.09, 0, 0, TAU); ctx.fill();
    // vertical ridges
    ctx.strokeStyle = shade(color, -0.18); ctx.lineWidth = 1.5 * u; ctx.globalAlpha = 0.5;
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * w * 0.16, -2); ctx.lineTo(i * w * 0.13, -h * 0.86); ctx.stroke(); }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawStaghorn(ex, base, s, color, rng) {
    const u = U() * s;
    ctx.save(); ctx.translate(ex, base + 4); ctx.lineCap = "round";
    function branch(x, y, ang, len, wd, depth) {
      if (depth <= 0 || len < 6 * u) return;
      const nx = x + Math.cos(ang) * len, ny = y + Math.sin(ang) * len;
      ctx.lineWidth = wd; ctx.strokeStyle = shade(color, -0.04 * depth);
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.quadraticCurveTo((x + nx) / 2 + (rng() * 2 - 1) * 4 * u, (y + ny) / 2, nx, ny); ctx.stroke();
      branch(nx, ny, ang - (0.30 + rng() * 0.3), len * 0.72, wd * 0.72, depth - 1);
      branch(nx, ny, ang + (0.30 + rng() * 0.3), len * 0.72, wd * 0.72, depth - 1);
    }
    for (let i = 0; i < 3; i++) branch((i - 1) * 24 * u, 0, -Math.PI / 2 + (rng() * 0.4 - 0.2), 42 * u, 9 * u, 4);
    ctx.restore();
  }

  function drawSeaFan(ex, base, s, color, rng, t) {
    const u = U() * s;
    ctx.save(); ctx.translate(ex, base + 4); ctx.rotate(Math.sin(t * 0.6 + ex * 0.01) * 0.04);
    const h = 128 * u, spread = Math.PI * 0.52, ribs = 9;
    // faint membrane
    ctx.globalAlpha = 0.22; ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(0, 0);
    for (let i = 0; i < ribs; i++) { const a = -Math.PI / 2 + (i / (ribs - 1) - 0.5) * spread; ctx.lineTo(Math.cos(a) * h, Math.sin(a) * h); }
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    // ribs
    ctx.strokeStyle = color; ctx.lineCap = "round";
    for (let i = 0; i < ribs; i++) {
      const a = -Math.PI / 2 + (i / (ribs - 1) - 0.5) * spread;
      ctx.lineWidth = 3.0 * u;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(Math.cos(a) * h * 0.5, Math.sin(a) * h * 0.5 - 6 * u, Math.cos(a) * h, Math.sin(a) * h);
      ctx.stroke();
    }
    // cross veins (lacy)
    ctx.lineWidth = 1.3 * u; ctx.globalAlpha = 0.7;
    for (let ring = 0.4; ring < 1.0; ring += 0.22) {
      ctx.beginPath();
      for (let i = 0; i < ribs; i++) {
        const a = -Math.PI / 2 + (i / (ribs - 1) - 0.5) * spread;
        const x = Math.cos(a) * h * ring, y = Math.sin(a) * h * ring;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawAnemone(ex, base, s, color, rng, t) {
    const u = U() * s;
    ctx.save(); ctx.translate(ex, base + 4);
    const bw = 48 * u, bh = 26 * u;
    const g = ctx.createRadialGradient(0, -bh * 0.5, 2, 0, -bh * 0.4, bw);
    g.addColorStop(0, shade(color, 0.3)); g.addColorStop(1, shade(color, -0.15));
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, -bh * 0.4, bw, bh, 0, 0, TAU); ctx.fill();
    const n = 28;
    for (let i = 0; i < n; i++) {
      const fx = (i / (n - 1) - 0.5) * bw * 1.7, len = (28 + rng() * 20) * u, ph = rng() * TAU;
      const tipx = fx + Math.sin(t * 1.4 + ph) * 8 * u, tipy = -bh * 0.4 - len;
      ctx.strokeStyle = shade(color, 0.08 + 0.22 * rng()); ctx.lineWidth = 3.4 * u; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(fx, -bh * 0.4);
      ctx.quadraticCurveTo((fx + tipx) / 2 + Math.sin(t * 1.2 + ph) * 6 * u, -bh * 0.4 - len * 0.5, tipx, tipy);
      ctx.stroke();
      ctx.fillStyle = shade(color, 0.4); ctx.beginPath(); ctx.arc(tipx, tipy, 2.3 * u, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawStarfish(ex, ey, s, color, rng) {
    const u = U() * s;
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(rng() * TAU);
    const R = 36 * u, r = 15 * u, arms = 5;
    ctx.beginPath();
    for (let i = 0; i < arms * 2; i++) {
      const a = (i / (arms * 2)) * TAU - Math.PI / 2, rad = i % 2 === 0 ? R : r;
      const x = Math.cos(a) * rad, y = Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, R);
    g.addColorStop(0, shade(color, 0.28)); g.addColorStop(1, color);
    ctx.fillStyle = g; ctx.fill();
    ctx.fillStyle = shade(color, 0.35);
    for (let i = 0; i < arms; i++) { const a = (i / arms) * TAU - Math.PI / 2; ctx.beginPath(); ctx.arc(Math.cos(a) * R * 0.6, Math.sin(a) * R * 0.6, 2.6 * u, 0, TAU); ctx.fill(); }
    ctx.restore();
  }

  function drawCoralBlue(ex, base, s, color, rng) {
    const u = U() * s;
    ctx.save(); ctx.translate(ex, base + 4);
    for (let i = 0; i < 7; i++) {
      const x = (rng() * 2 - 1) * 34 * u, y = -rng() * 30 * u, r = (8 + rng() * 9) * u;
      const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r);
      g.addColorStop(0, shade(color, 0.3)); g.addColorStop(1, shade(color, -0.15));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawCrab(ex, ey, s, t) {
    const u = U() * s, bw = 26 * u, bh = 15 * u;
    ctx.save(); ctx.translate(ex, ey);
    ctx.strokeStyle = "#8a3b22"; ctx.lineWidth = 2.4 * u; ctx.lineCap = "round";
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 3; i++) {
        const tw = Math.sin(t * 2 + i + (side > 0 ? 0 : 1.5)) * 0.12;
        const lx = side * bw * 0.7;
        ctx.beginPath(); ctx.moveTo(lx, 0);
        ctx.quadraticCurveTo(lx + side * 14 * u, 3 * u + tw * 10 * u, lx + side * 22 * u, 8 * u);
        ctx.stroke();
      }
      // claw
      ctx.beginPath(); ctx.moveTo(side * bw * 0.7, -bh * 0.2);
      ctx.quadraticCurveTo(side * bw * 1.3, -bh * 0.9, side * bw * 1.5, -bh * 0.3); ctx.stroke();
      ctx.fillStyle = "#b04a2c"; ctx.beginPath(); ctx.ellipse(side * bw * 1.5, -bh * 0.3, 5 * u, 4 * u, 0, 0, TAU); ctx.fill();
    }
    const g = ctx.createRadialGradient(0, -bh * 0.3, 2, 0, 0, bw);
    g.addColorStop(0, "#c75a36"); g.addColorStop(1, "#8a3b22");
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, bw, bh, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath(); ctx.arc(-bw * 0.3, -bh * 0.75, 2 * u, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(bw * 0.3, -bh * 0.75, 2 * u, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawReef(t) {
    for (const e of reef) {
      const rng = srand(e.seed);
      const ex = e.x * W, base = floorY;
      if (e.type === "rock") drawRock(ex, base, e.w * W, e.h * H, e.color);
      else if (e.type === "soft") drawSoftCoral(ex, base, e.scale, e.color, rng);
      else if (e.type === "sponge") drawSoftCoral(ex, base, e.scale * 0.9, e.color, rng);
      else if (e.type === "tubes") drawTubes(ex, base, e.scale, e.color, e.tall, rng);
      else if (e.type === "barrel") drawBarrel(ex, base, e.scale, e.color, rng);
      else if (e.type === "staghorn") drawStaghorn(ex, base, e.scale, e.color, rng);
      else if (e.type === "fan") drawSeaFan(ex, base, e.scale, e.color, rng, t);
      else if (e.type === "anemone") drawAnemone(ex, base, e.scale, e.color, rng, t);
      else if (e.type === "coralblue") drawCoralBlue(ex, base, e.scale, e.color, rng);
      else if (e.type === "star") drawStarfish(ex, floorY + (H - floorY) * 0.72, e.scale, e.color, rng);
      else if (e.type === "crab") drawCrab(ex, floorY + (H - floorY) * 0.82, e.scale, t);
    }
  }

  function drawKelp(t) {
    for (const k of kelp) {
      const segs = 10;
      ctx.beginPath();
      for (let i = 0; i <= segs; i++) {
        const f = i / segs, y = floorY - f * k.h, sway = Math.sin(t * k.speed + k.phase + f * 3) * k.amp * f * f, hw = (k.w * (1 - f) * 0.5) + 0.8;
        ctx.lineTo(k.x + sway - hw, y);
      }
      for (let i = segs; i >= 0; i--) {
        const f = i / segs, y = floorY - f * k.h, sway = Math.sin(t * k.speed + k.phase + f * 3) * k.amp * f * f, hw = (k.w * (1 - f) * 0.5) + 0.8;
        ctx.lineTo(k.x + sway + hw, y);
      }
      ctx.closePath();
      const g = ctx.createLinearGradient(0, floorY - k.h, 0, floorY);
      g.addColorStop(0, `hsla(${k.hue},58%,55%,0.92)`); g.addColorStop(1, `hsla(${k.hue},62%,24%,0.92)`);
      ctx.fillStyle = g; ctx.fill();
    }
  }

  function drawBackReef() {
    ctx.save();
    for (const b of backReef) {
      ctx.globalAlpha = b.a; ctx.fillStyle = "#2f6e90";
      ctx.beginPath();
      ctx.moveTo(b.x - b.w / 2, floorY + 6);
      const steps = 7;
      for (let i = 0; i <= steps; i++) { const f = i / steps; ctx.lineTo(b.x - b.w / 2 + f * b.w, floorY + 6 - Math.sin(f * Math.PI) * b.h); }
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // continuous reef mass the corals grow from, so the bottom reads as one
  // dense reef rather than scattered objects on bare sand
  function drawReefBase() {
    const baseBottom = floorY + (H - floorY) * 0.5; // leave a sand strip in front
    const segs = 28;
    ctx.beginPath();
    for (let i = 0; i <= segs; i++) {
      const f = i / segs, x = f * W;
      const y = floorY - H * 0.05 - Math.abs(Math.sin(f * 6 + 1.3)) * H * 0.07 - Math.sin(f * 21) * H * 0.012;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.lineTo(W, baseBottom);
    for (let i = segs; i >= 0; i--) { const f = i / segs, x = f * W; ctx.lineTo(x, baseBottom + Math.sin(f * 9 + 0.5) * H * 0.012); }
    ctx.closePath();
    const g = ctx.createLinearGradient(0, floorY - H * 0.12, 0, baseBottom);
    g.addColorStop(0, "#775b3d"); g.addColorStop(0.6, "#54402a"); g.addColorStop(1, "#3c2d1e");
    ctx.fillStyle = g; ctx.fill();
  }

  function drawRubble() {
    for (const b of rubble) {
      const g = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.4, b.r * 0.2, b.x, b.y, b.r);
      g.addColorStop(0, shade(b.color, 0.28)); g.addColorStop(1, shade(b.color, -0.12));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r, b.r * b.flat, 0, 0, TAU); ctx.fill();
    }
  }

  /* ============================================================
     WATER, LIGHT, SAND, VIGNETTE
     ============================================================ */
  function drawWater() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#18639b");
    g.addColorStop(0.30, "#2a86bd");
    g.addColorStop(0.62, "#3f9ac4");
    g.addColorStop(0.85, "#2f8bb6");
    g.addColorStop(1, "#1d6e9c");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // sunlight pool from the surface (upper-center)
    const r = ctx.createRadialGradient(W * 0.5, -H * 0.12, 0, W * 0.5, -H * 0.12, H * 0.95);
    r.addColorStop(0, "rgba(150,225,250,0.42)"); r.addColorStop(1, "rgba(150,225,250,0)");
    ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
    // haze band at the reef line (depth scattering)
    const hz = ctx.createLinearGradient(0, floorY - H * 0.18, 0, floorY);
    hz.addColorStop(0, "rgba(120,200,225,0)"); hz.addColorStop(1, "rgba(120,200,225,0.18)");
    ctx.fillStyle = hz; ctx.fillRect(0, floorY - H * 0.18, W, H * 0.18);
  }

  // bright caustic band just under the water surface (as in the original)
  function drawSurface(t) {
    const bandH = H * 0.13;
    const g = ctx.createLinearGradient(0, 0, 0, bandH);
    g.addColorStop(0, "rgba(205,244,255,0.24)"); g.addColorStop(1, "rgba(205,244,255,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, bandH);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = "rgba(225,250,255,0.10)"; ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      const yb = bandH * 0.28 + i * 7;
      for (let x = 0; x <= W; x += 24) {
        const y = yb + Math.sin(x * 0.02 + t * 0.8 + i) * 4 + Math.sin(x * 0.05 - t * 1.1) * 2;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // лучи: ОДИН градиент на всё (строится в resize), каждый луч — сдвиг translate + globalAlpha;
  // никаких новых градиентов и строк на кадр. alphaMul — общий множитель (фото-режим: 0.5)
  let rayGrad = null;
  function buildRays() {
    rayGrad = ctx.createLinearGradient(0, 0, W * 0.18, H);
    rayGrad.addColorStop(0, "rgba(195,238,255,1)"); rayGrad.addColorStop(0.7, "rgba(195,238,255,0)");
  }
  function drawRays(t, alphaMul) {
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = rayGrad;
    const n = 5, w = W * 0.10, skew = W * 0.18;
    for (let i = 0; i < n; i++) {
      const baseX = (W / n) * (i + 0.5) + Math.sin(t * 0.06 + i) * 60;
      ctx.globalAlpha = alphaMul * (0.04 + 0.035 * (0.5 + 0.5 * Math.sin(t * 0.2 + i * 1.3)));
      ctx.translate(baseX, 0);
      ctx.beginPath();
      ctx.moveTo(-w, 0); ctx.lineTo(w, 0);
      ctx.lineTo(skew + w * 1.8, H); ctx.lineTo(skew - w * 1.8, H);
      ctx.closePath(); ctx.fill();
      ctx.translate(-baseX, 0);
    }
    ctx.restore();
  }

  function drawSand() {
    ctx.beginPath();
    ctx.moveTo(0, H); ctx.lineTo(0, floorY + 4);
    const segs = 16;
    for (let i = 0; i <= segs; i++) { const x = (W / segs) * i, y = floorY + 4 + Math.sin(i * 0.9 + 1.3) * 6; ctx.lineTo(x, y); }
    ctx.lineTo(W, H); ctx.closePath();
    const g = ctx.createLinearGradient(0, floorY, 0, H);
    g.addColorStop(0, "#c7c389"); g.addColorStop(0.5, "#bdb277"); g.addColorStop(1, "#a08f5e");
    ctx.fillStyle = g; ctx.fill();
    // greenish lit patch in the center
    const r = ctx.createRadialGradient(W * 0.5, floorY + H * 0.06, 0, W * 0.5, floorY + H * 0.06, W * 0.4);
    r.addColorStop(0, "rgba(205,210,140,0.5)"); r.addColorStop(1, "rgba(205,210,140,0)");
    ctx.fillStyle = r; ctx.fillRect(0, floorY, W, H - floorY);
    // shimmer specks
    ctx.fillStyle = "rgba(255,250,225,0.25)";
    for (let i = 0; i < 46; i++) { const x = (i * 197.3) % W, y = floorY + 14 + ((i * 53.7) % (H - floorY - 16)); ctx.fillRect(x, y, 1.4, 1.4); }
  }

  // виньетка — кэш в 1/4 разрешения (строится в resize), на кадр — один drawImage
  let vignetteCanvas = null;
  function buildVignette() {
    const c = vignetteCanvas || document.createElement("canvas");
    const vw = Math.max(16, Math.round(W / 4)), vh = Math.max(16, Math.round(H / 4));
    c.width = vw; c.height = vh;
    const g = c.getContext("2d");
    g.setTransform(vw / W, 0, 0, vh / H, 0, 0);
    const gr = g.createRadialGradient(W * 0.5, H * 0.44, H * 0.30, W * 0.5, H * 0.5, H * 0.92);
    gr.addColorStop(0, "rgba(3,28,52,0)"); gr.addColorStop(1, "rgba(3,28,52,0.38)");
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    vignetteCanvas = c;
  }
  function drawVignette() { ctx.drawImage(vignetteCanvas, 0, 0, W, H); }

  /* ============================================================
     ENTITY POOLS + RESIZE + LOOP
     ============================================================ */
  let fishes = [], bubbles = [], pellets = [], bubbleTimer = 0, streamX = 0, streamTimer = 0;

  const targetFishCount = () => clamp(Math.round((W * H) / 100000), 8, 22);

  function seedTank(n) {
    fishes = [];
    if (PACK.length) {
      // honour each species' "count", scaled to the screen-area target total
      const active = activePacks();
      let baseTotal = 0; for (const p of active) baseTotal += p.count;
      const scale = baseTotal ? n / baseTotal : 1;
      for (const p of active) {
        const c = Math.max(1, Math.round(p.count * scale));
        for (let i = 0; i < c; i++) fishes.push(makeFish({ pack: p }));
      }
    } else {
      const forced = ["puffer", "regal", "yellowtang", "clown"];
      for (const name of forced) if (fishes.length < n) fishes.push(makeFish({ species: SP_BY_NAME[name] }));
      while (fishes.length < n) fishes.push(makeFish());
    }
  }
  function setFishCount(n) {
    n = clamp(n, 3, 60);
    while (fishes.length < n) fishes.push(makeFish());
    while (fishes.length > n) fishes.pop();
  }

  // буфер холста и всё, что от него зависит (кэши) — без пересева сцены (зовёт и регулятор качества)
  function applyBacking() {
    RS = Math.min(DPR, Math.sqrt(MAX_BACKING_PX / Math.max(1, W * H))) * QUALITY.rsMul;
    canvas.width = Math.max(1, Math.floor(W * RS)); canvas.height = Math.max(1, Math.floor(H * RS));
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(RS, 0, 0, RS, 0, 0);
    layoutBackdrop(); buildBandCache(); buildVignette(); buildRays();
  }
  function resize() {
    W = window.innerWidth; H = window.innerHeight; floorY = H * 0.78;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    seedPlankton();
    applyBacking();
    buildScenery();
    for (const f of fishes) { f.x = clamp(f.x, 0, W); f.y = clamp(f.y, H * 0.08, floorY - f.len * 0.3); }
    if (TEST) renderNow();
  }

  /* ---------- список отрисовки по глубине ----------
     Один заранее выделенный массив слотов, сортировка вставками на месте (элементов — десятки,
     устойчиво, без замыканий и временных массивов, как у Array.sort). Дальние (больший z) — первыми.
     kind: RK_FISH; следующие этапы добавят пропсы, окклюдеры, качающиеся участки, колонну пузырьков. */
  const RK_FISH = 1;
  const RL_CAP = 512;
  const RL = new Array(RL_CAP);
  for (let i = 0; i < RL_CAP; i++) RL[i] = { z: 0, kind: 0, obj: null };
  let rlN = 0;
  function rlPush(z, kind, obj) {
    if (rlN >= RL_CAP) return;
    const it = RL[rlN++]; it.z = z; it.kind = kind; it.obj = obj;
  }
  function rlSort() {
    for (let i = 1; i < rlN; i++) {
      const it = RL[i], z = it.z;
      let j = i - 1;
      while (j >= 0 && RL[j].z < z) { RL[j + 1] = RL[j]; j--; }
      RL[j + 1] = it;
    }
  }
  // S0: старая «глубина» 0..1 (1 = у стекла) → мировой z (1.0 = стекло … 2.6 = задняя стенка).
  // E3 заменит настоящей перспективой (SPEC §3 «Projection»).
  const fishZ = (f) => 2.6 - 1.6 * f.depth;

  /* ---------- симуляция и кадр ----------
     simT — часы симуляции (с): двигают и физику, и фазы анимаций (хвосты, лучи, планктон),
     поэтому прогон по шагам детерминирован (?test=1&seed=N). */
  let simT = 0;
  function simulate(dt) {
    simT += dt;
    if (paused) return;
    const t = simT;
    for (let i = 0; i < fishes.length; i++) updateFish(fishes[i], dt, t);
    updatePlankton(t, dt);
    bubbleTimer -= dt;
    if (bubbleTimer <= 0) { bubbles.push(makeBubble()); bubbleTimer = rand(0.12, 0.4); }
    // непрерывный вертикальный поток пузырьков из одной точки рифа
    streamTimer -= dt;
    if (streamTimer <= 0) {
      const b = makeBubble(streamX + rand(-9, 9), floorY - H * 0.02);
      b.r = rand(2, 6); b.vy = rand(60, 100); b.wob = rand(0.8, 1.8);
      bubbles.push(b);
      streamTimer = rand(0.02, 0.06);
    }
    // уплотнение на месте вместо filter() — без новых массивов на кадр
    let k = 0;
    for (let i = 0; i < bubbles.length; i++) { const b = bubbles[i]; if (updateBubble(b, dt, t)) bubbles[k++] = b; }
    bubbles.length = k;
    k = 0;
    for (let i = 0; i < pellets.length; i++) { const p = pellets[i]; if (updatePellet(p, dt)) pellets[k++] = p; }
    pellets.length = k;
  }

  function render(t) {
    if (bgReady) {
      drawBackdrop();
      if (bandCanvas) ctx.drawImage(bandCanvas, 0, 0, W, BGX.bandH);
      // фото рифа уже освещено — поверх лишь живые лучи света
      drawRays(t, 0.5);
      drawPlankton(t);
    } else {
      drawWater();
      drawSurface(t);
      drawRays(t, 1);
      drawBackReef();
      drawSand();
      drawReefBase();
      drawRubble();
      drawKelp(t);
      drawReef(t);
    }

    rlN = 0;
    for (let i = 0; i < fishes.length; i++) rlPush(fishZ(fishes[i]), RK_FISH, fishes[i]);
    rlSort();
    for (let i = 0; i < rlN; i++) {
      const it = RL[i];
      if (it.kind === RK_FISH) drawFish(it.obj, t);
    }
    for (let i = 0; i < pellets.length; i++) drawPellet(pellets[i]);
    for (let i = 0; i < bubbles.length; i++) drawBubble(bubbles[i]);
    drawVignette();
  }

  /* ---------- статистика кадра (только при COUNTING) ---------- */
  const STAT_KEYS = CNT_KEYS.concat("jsMs");
  const STAT = { frames: 0, total: 0, last: {}, sum: {}, max: {} };
  for (const k of STAT_KEYS) { STAT.last[k] = 0; STAT.sum[k] = 0; STAT.max[k] = 0; }
  function resetStats() { STAT.frames = 0; for (const k of STAT_KEYS) { STAT.sum[k] = 0; STAT.max[k] = 0; } }
  function recordStats(ms) {
    STAT.frames++; STAT.total++;
    for (let i = 0; i < CNT_KEYS.length; i++) {
      const k = CNT_KEYS[i], v = CNT[k];
      STAT.last[k] = v; STAT.sum[k] += v; if (v > STAT.max[k]) STAT.max[k] = v;
    }
    STAT.last.jsMs = ms; STAT.sum.jsMs += ms; if (ms > STAT.max.jsMs) STAT.max.jsMs = ms;
  }

  // тело кадра: шаг симуляции + (по желанию) отрисовка; JS-время — performance.now() вокруг всего тела
  function frameBody(dt, doRender) {
    if (!doRender) { simulate(dt); return; }
    let t0 = 0;
    if (COUNTING) { for (let i = 0; i < CNT_KEYS.length; i++) CNT[CNT_KEYS[i]] = 0; t0 = performance.now(); }
    simulate(dt);
    render(simT);
    if (COUNTING) recordStats(performance.now() - t0);
    if (DEBUG) drawDebug();
  }
  // перерисовать текущее состояние без шага (тест-режим: resize, загрузка задника)
  function renderNow() { if (W > 0 && vignetteCanvas) { render(simT); if (DEBUG) drawDebug(); } }
  function assetsChanged() { if (TEST) renderNow(); }

  /* ---------- отладочный оверлей (?debug=1; ?debug=2 — плюс геометрия сцены) ----------
     Следующие этапы добавляют строки: DEBUG_HOOKS.push(() => "строка"). */
  const DEBUG_HOOKS = [];
  function drawDebug() {
    const L = STAT.last, q = QUALITY;
    ctx.save();
    ctx.setTransform(RS, 0, 0, RS, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    if (DEBUG >= 2) drawDebugGeometry();
    const lines = [
      `RS ${RS.toFixed(3)}  css ${W}×${H}  буфер ${canvas.width}×${canvas.height} (${(canvas.width * canvas.height / 1e6).toFixed(2)} Мп)  dpr ${DPR}`,
      `Q${q.level}  частицы ${q.particles}  срезы ${q.fishSlices}  каустика ${q.causticScale}  rs×${q.rsMul}  ` +
        `p90 ${GOV.p90.toFixed(1)} мс  ${GOV.fps.toFixed(0)} к/с  power ${POWER}${TEST ? "  TEST" : ""}`,
      `drawImage ${L.drawImage}  setTransform ${L.setTransform}  градиенты ${L.gradients}  паттерны ${L.patterns}  ` +
        `save/restore ${L.save}/${L.restore}  getImageData ${L.getImageData}  filter ${L.filter}  JS ${L.jsMs.toFixed(2)} мс`,
      `сцена: ${SCENE_FROM_FILE ? "scene.js" : "умолчания"}  задник: ${bgSrc || (NOBG ? "выкл (nobg)" : "нет")}  ` +
        `рыб ${fishes.length}  пузырьков ${bubbles.length}  seed ${SEED}  t ${simT.toFixed(2)} с`,
    ];
    for (let i = 0; i < DEBUG_HOOKS.length; i++) { try { const s = DEBUG_HOOKS[i](); if (s) lines.push(s); } catch (e) { /* оверлей не роняет кадр */ } }
    ctx.font = "12px ui-monospace, Menlo, Consolas, monospace";
    ctx.textBaseline = "top";
    let w = 0;
    for (const s of lines) w = Math.max(w, ctx.measureText(s).width);
    ctx.fillStyle = "rgba(0,10,20,0.66)"; ctx.fillRect(8, 8, w + 16, lines.length * 16 + 12);
    ctx.fillStyle = "#cfe8ff";
    for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], 16, 14 + i * 16);
    ctx.restore();
  }
  function drawDebugGeometry() {
    const S = SCENE;
    ctx.lineWidth = 1.5;
    // линия воды и горизонт (точка схода)
    ctx.strokeStyle = "rgba(120,220,255,0.9)";
    ctx.beginPath(); ctx.moveTo(0, BGX.bandH); ctx.lineTo(W, BGX.bandH); ctx.stroke();
    const hy = bgY(S.camera.horizonBy);
    ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(0, hy); ctx.lineTo(W, hy); ctx.stroke();
    // safeX — то, что видно на любом мониторе
    ctx.strokeStyle = "rgba(255,230,80,0.9)";
    for (const bx of S.backdrop.safeX || []) { const x = bgX(bx); ctx.beginPath(); ctx.moveTo(x, BGX.bandH); ctx.lineTo(x, H); ctx.stroke(); }
    ctx.setLineDash([]);
    // пол (линия контакта песка)
    if (S.floor) {
      ctx.strokeStyle = "rgba(255,120,60,0.95)"; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < S.floor.length; i++) { const p = S.floor[i]; if (i) ctx.lineTo(bgX(p[0]), bgY(p[1])); else ctx.moveTo(bgX(p[0]), bgY(p[1])); }
      ctx.stroke();
    }
    ctx.font = "11px ui-monospace, Menlo, Consolas, monospace"; ctx.textBaseline = "middle";
    // точки поведения
    for (const s of S.spots) {
      const x = bgX(s.bx), y = bgY(s.by), r = (s.r || 0.03) * BGX.dw;
      ctx.strokeStyle = "rgba(140,255,140,0.95)"; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
      ctx.fillStyle = "#b6ffb6"; ctx.fillText(`${s.type}:${s.id} z${s.z}`, x + 4, y);
    }
    // источники пузырьков и света
    for (const b of S.bubbles) {
      const x = bgX(b.bx), y = bgY(b.by);
      ctx.strokeStyle = "rgba(255,255,255,0.95)"; ctx.beginPath(); ctx.arc(x, y, 6, 0, TAU); ctx.stroke();
      ctx.fillStyle = "#ffffff"; ctx.fillText(`${b.id} z${b.z}`, x + 9, y);
    }
    for (const l of (S.light && S.light.sources) || []) {
      const x = bgX(l.bx);
      ctx.fillStyle = "#fff6b0"; ctx.beginPath(); ctx.arc(x, BGX.bandH + 8, 5, 0, TAU); ctx.fill();
    }
  }

  let last = performance.now(), acc = 0, lastShown = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    let raw = (now - last) / 1000; last = now;
    if (raw > 0.1) raw = 0.1; else if (raw < 0) raw = 0;
    // app told us the display is off/occluded, or the view is hidden -> stop work
    if (POWER === "paused" || document.hidden) { lastShown = 0; return; }
    // battery saver: coalesce to ~30 fps but keep motion time-correct
    // (допуск 15%: дрожание vsync не должно ронять 30 к/с в 20)
    acc += raw;
    const step = POWER === "low" ? (1 / 30) * 0.85 : 0;
    if (acc < step) return;
    const dt = Math.min(acc, 0.05);
    acc = 0;
    if (lastShown && GOV_ON) govSample(now - lastShown);
    lastShown = now;
    frameBody(dt, true);
  }

  /* ---------- тестовый API: window.__aq ----------
     step(dt, n, {render}) — n шагов по dt с; render: true (каждый шаг, по умолчанию) | false | "last".
     setTime(t), render(), stats(), resetStats(), fish(), scene(), bgMap(bx,by), bgUnmap(x,y),
     setQuality(level), ready(). Счётчики в stats() — только при ?test=1 или ?debug=1. */
  window.__aq = {
    version: 1, seed: SEED, test: TEST,
    ready: () => bgSettled && PACK.every((p) => !(p.image && p.count > 0) || p.ready || p.failed),
    step(dt, n, opts) {
      dt = dt > 0 ? +dt : 1 / 30; n = n > 0 ? n | 0 : 1;
      const mode = opts && opts.render !== undefined ? opts.render : true;
      for (let i = 0; i < n; i++) frameBody(dt, mode === true || (mode === "last" && i === n - 1));
      return simT;
    },
    setTime(t) { simT = +t || 0; return simT; },
    render() { renderNow(); },
    resetStats() { resetStats(); },
    stats() {
      const avg = {};
      for (const k of STAT_KEYS) avg[k] = STAT.frames ? STAT.sum[k] / STAT.frames : 0;
      return {
        counting: COUNTING, frames: STAT.frames, total: STAT.total,
        last: Object.assign({}, STAT.last), avg, max: Object.assign({}, STAT.max),
        backing: { w: canvas.width, h: canvas.height, mp: canvas.width * canvas.height / 1e6 },
        css: { w: W, h: H }, dpr: DPR, RS, quality: Object.assign({}, QUALITY),
        governor: { p90: GOV.p90, fps: GOV.fps, bad: GOV.bad, good: GOV.good, recover: GOV.recover },
        hasFilter: HAS_FILTER, photo: bgReady, sceneFromFile: SCENE_FROM_FILE, power: POWER,
        fish: fishes.length, bubbles: bubbles.length, pellets: pellets.length, simT, seed: SEED,
      };
    },
    fish() {
      return fishes.map((f, i) => ({ i, id: f.pack ? f.pack.id : f.sp.name, x: f.x, y: f.y, z: fishZ(f), depth: f.depth,
        len: f.len, facing: f.facing, vx: f.vx, vy: f.vy, alpha: f.alpha, sprite: !!(f.pack && f.pack.ready) }));
    },
    scene() {
      return { fromFile: SCENE_FROM_FILE, backdrop: bgSrc, photo: bgReady, nobg: NOBG, bandH: BGX.bandH,
        map: Object.assign({}, BGX), horizon: [bgX(0.5), bgY(SCENE.camera.horizonBy)],
        visibleBX: [bgBX(0), bgBX(W)], visibleBY: [bgBY(BGX.bandH), bgBY(H)], scene: SCENE };
    },
    bgMap: (bx, by) => [bgX(bx), bgY(by)],
    bgUnmap: (x, y) => [bgBX(x), bgBY(y)],
    setQuality(level) { setQuality(level); return QUALITY.level; },
  };

  /* ============================================================
     INPUT  (disabled in wallpaper mode — no menu/controls)
     ============================================================ */
  function toggleFullscreen() {
    if (!document.fullscreenElement) (document.documentElement.requestFullscreen || function () {}).call(document.documentElement);
    else (document.exitFullscreen || function () {}).call(document);
  }

  let idleTimer = null;
  function showHint() {
    if (WALLPAPER) return;
    hint.classList.remove("faded"); document.body.classList.remove("hide-cursor");
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { hint.classList.add("faded"); document.body.classList.add("hide-cursor"); }, 3500);
  }

  window.addEventListener("resize", resize);
  document.addEventListener("visibilitychange", () => { last = performance.now(); lastShown = 0; govReset(); });

  if (WALLPAPER) {
    hint.style.display = "none";
    document.body.classList.add("hide-cursor");
  } else {
    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k === "f") toggleFullscreen();
      else if (e.code === "Space") { paused = !paused; e.preventDefault(); }
      else if (k === "+" || k === "=") setFishCount(fishes.length + 1);
      else if (k === "-" || k === "_") setFishCount(fishes.length - 1);
      showHint();
    });
    canvas.addEventListener("pointerdown", (e) => spawnFood(e.clientX, e.clientY));
    window.addEventListener("pointermove", showHint);
  }

  /* ---------- start ---------- */
  resize();
  seedTank(targetFishCount());
  loadBackdrop(0);
  showHint();
  // ?test=1: от rAF ничего не идёт — кадры только по window.__aq.step()
  if (!TEST) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
