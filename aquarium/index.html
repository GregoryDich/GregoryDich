        const home = a.state === ST.HOME && b.state === ST.HOME;
        // пара в одном доме (клоуны): ещё и вбок — держатся рядом, но не стопкой
        if (home) {                                    // V5: в сторону своих слотов (не по текущему порядку — иначе разошедшиеся «не туда» так и стоят)
          const sg = a.hSide && b.hSide && a.hSide !== b.hSide ? (b.hSide > 0 ? 1 : -1) : (dX >= 0 ? 1 : -1);
          const px = Math.max(k, ov) * 0.8 * r * sg; a.pX -= px; b.pX += px;
        }
        else if (scr) {
          // рамки перекрыты на близкой глубине: дальняя — назад, в дымку (меньше и бледнее), ближняя — к стеклу
          const kk = Math.max(k, Math.min(1, ov)), fa = a.z >= b.z ? a : b, fb = fa === a ? b : a;
          fa.pZ += 0.18 * kk; fb.pZ -= 0.06 * kk;
          const vy = 0.7 * kk * (bodyH(a) + bodyH(b)) * (a.y <= b.y ? 1 : -1);   // верхняя — выше, нижняя — ниже
          a.pY -= 0.5 * vy; b.pY += 0.5 * vy;
        }
      }
    }
    for (let i = 0; i < n; i++) {
      const f = fishes[i];
      f.avX = avLag(f.avX, f.pX, dt); f.avY = avLag(f.avY, f.pY, dt); f.avZ = avLag(f.avZ, f.pZ, dt);
    }
  }

  /* ---------- V5: мягкое столкновение — по положению, не через курс ----------
     Курс меняет глубину только рысканием × скоростью: зависшая, пасущаяся или стоящая у норы рыба (v ≈ 0.1 L/с)
     расходилась бы секундами, и тела висели друг в друге. Здесь пара видимых рыб (не одна стая), чьи экранные
     рамки (с упреждением) перекрыты > 25% при |Δz| меньше зазора g = 0.35·L/D (0.12…0.2), раздвигается напрямую: по глубине к
     зазору g (дальняя берёт 3/4, если есть место до рифа/колонии, иначе ближняя к стеклу) и по экрану вдоль
     меньшего перекрытия (обычно по высоте) — ≈45% перекрытия в секунду. Рыба на развороте не двигается (её
     двигает соседка); пара в одном доме (клоуны) — только вбок и в пределах венца. */
  const COL_MOVED = [];
  function zRoomHi(f) {
    if (f.state === ST.HOME && f.sub === 0) return f.hz + 0.022;
    let z = Math.min(f.czHi, f.near ? 1.4 : f.zMax + 0.12);
    if (!f.allowBehind) z = Math.min(z, boxReefZ(f.x, f.y, f.len, f.h, false) - 0.06);
    return z;
  }
  function zRoomLo(f) {
    if (f.state === ST.HOME && f.sub === 0) return f.hz + 0.006;
    return Math.max(f.czLo, zLo(f));
  }
  function collideFish(dt) {
    const n = fishes.length, D = CAM.D;
    let nm = 0;
    for (let i = 0; i < n; i++) {
      const a = fishes[i];
      if (isOff(a) || a.far || !a.onScreen) continue;
      for (let j = i + 1; j < n; j++) {
        const b = fishes[j];
        if (isOff(b) || b.far || !b.onScreen) continue;
        if (a.school && a.school === b.school) continue;
        const ma = !a.turn.on, mb = !b.turn.on;
        if (!ma && !mb) continue;
        // рамки с упреждением (±0.3 длины, ±0.15 высоты): глубина начинает расходиться до касания
        const ea = 0.3 * a.len, eb = 0.3 * b.len, fa0 = 0.15 * a.h, fb0 = 0.15 * b.h;
        const jx = Math.min(a.maxX + ea, b.maxX + eb) - Math.max(a.minX - ea, b.minX - eb), jy = Math.min(a.maxY + fa0, b.maxY + fb0) - Math.max(a.minY - fa0, b.minY - fb0);
        if (jx <= 0 || jy <= 0) continue;
        const sa = (a.maxX - a.minX) * (a.maxY - a.minY), sb = (b.maxX - b.minX) * (b.maxY - b.minY), sm = Math.max(1, Math.min(sa, sb));
        if ((jx * jy) / sm < 0.25) continue;
        const ix = Math.min(a.maxX, b.maxX) - Math.max(a.minX, b.minX), iy = Math.min(a.maxY, b.maxY) - Math.max(a.minY, b.minY);
        const ov = ix > 0 && iy > 0 ? (ix * iy) / sm : 0;
        const home = a.state === ST.HOME && b.state === ST.HOME;
        if (home && ov < 0.12) continue;
        const g = home ? 0 : clamp((0.35 * Math.max(a.L0, b.L0)) / D, 0.12, 0.2);
        const adz = Math.abs(b.z - a.z);
        if (adz >= g && !home) continue;                 // одна явно перед другой — перекрытие на экране естественно
        let def = home ? 1 : 1 - adz / g;                // недостача зазора 0…1
        // глубина (≤ 0.22 z/с на рыбу — как заметный уход вглубь, не скачок)
        if (!home) {
          const fa = b.z >= a.z ? b : a, fb = fa === a ? b : a;   // fa — дальняя
          const need = (g - adz) * Math.min(1, 2.2 * dt), vmax = 0.22 * dt;
          const ra = fa.turn.on ? 0 : Math.min(vmax, Math.max(0, zRoomHi(fa) - fa.z)), rb = fb.turn.on ? 0 : Math.min(vmax, Math.max(0, fb.z - zRoomLo(fb)));
          let da = Math.min(ra, 0.75 * need), db = Math.min(rb, need - da);
          if (db < need - da) da = Math.min(ra, need - db);
          fa.z += da; fb.z -= db;
          if (da > 0 && fa.tz < fa.z) fa.tz = Math.min(fa.z, zRoomHi(fa));   // цель не тянет назад, к соседке
          if (db > 0 && fb.tz > fb.z) fb.tz = fb.z;
          if (da + db < 0.5 * need) def = 1.6;          // по глубине некуда (риф, колония, стекло) — по экрану сильнее
        }
        // экран — только при настоящем перекрытии: вдоль меньшего перекрытия; у пары в доме — только вбок
        if (ov >= 0.2) {
          const s = Math.min(0.08, (home ? 2.0 : 0.75) * Math.min(1, dt) * def), wa = ma ? (mb ? 0.5 : 1) : 0, wb = 1 - wa;
          if (home && iy > 0.5 * Math.min(a.h, b.h)) {     // пара в доме: ещё и по высоте — одна над другой, не стопкой
            const sg = a.y <= b.y ? -1 : 1, m = 0.5 * s * iy;
            a.Y += sg * m * wa * a.z; b.Y -= sg * m * wb * b.z;
          }
          // цель сдвигается вместе с телом: курс не тянет пару обратно друг в друга
          if (home || ix < 0.6 * iy) {
            const sg = home && a.hSide && b.hSide && a.hSide !== b.hSide ? (a.hSide < 0 ? -1 : 1) : (a.x <= b.x ? -1 : 1), m = s * ix;
            const qa = sg * m * wa * a.z, qb = sg * m * wb * b.z;
            a.X += qa; b.X -= qb; if (!home) { a.tX += qa; b.tX -= qb; }
          } else {
            const sg = a.y <= b.y ? -1 : 1, m = s * iy;
            const qa = sg * m * wa * a.z, qb = sg * m * wb * b.z;
            a.Y += qa; b.Y -= qb; a.tY += qa; b.tY -= qb;
          }
        }
        if (!a.colM) { a.colM = true; COL_MOVED[nm++] = a; }
        if (!b.colM) { b.colM = true; COL_MOVED[nm++] = b; }
      }
    }
    // раскладка тел — на следующем шаге (сдвиг за шаг — доли пикселя; лишний layoutFish стоил бы ≈0.5 мс на кадр)
    for (let i = 0; i < nm; i++) { const f = COL_MOVED[i]; f.colM = false; coralClampZ(f); COL_MOVED[i] = null; }
  }

  /* ---------- шаг всех рыб ---------- */
  function updateFishAll(dt, t) {
    directorStep(t, dt);
    separateFish(dt);
    const anyFood = flkN > 0;
    if (anyFood) for (let i = 0; i < fishes.length; i++) { const f = fishes[i]; if (f.state === ST.FEED && f.flake && f.flake.on) f.flake.claim++; }
    for (let i = 0; i < fishes.length; i++) {
      const f = fishes[i];
      f.aliveT += dt;
      if (isOff(f)) {
        f.hiddenT += dt;
        if (f.school && !f.isLeader) {
          const ld = f.school.leader;
          if (!isOff(ld)) {                              // ведущий вернулся: встать в слот за ним (за краем)
            placeSlot(f, ld); f.X -= ld.dir * 0.4 * f.L0; layoutFish(f);
          }
          continue;
        }
        if (t >= f.offUntil || (anyFood && t >= f.offUntil - 14)) {
          if (f.school && f.isLeader) {
            const m = f.school.members;
            let all = true;
            for (let j = 0; j < m.length; j++) if (m[j] !== f && !isOff(m[j]) && t - f.st < 30) all = false;
            if (!all) continue;
            reenter(f, t);
            for (let j = 0; j < m.length; j++) if (m[j] !== f && isOff(m[j])) { placeSlot(m[j], f); m[j].X -= f.dir * 0.4 * m[j].L0; layoutFish(m[j]); }
          } else if ((f.farPlan || (f.habit === "cruise" && f.tr.territorial < 0.7 && R() < 0.15)) && startFarPass(f, t)) {
            f.farPlan = false;
          } else reenter(f, t, 0, f.nearPlan ? { za: 1.0, zb: 1.1 } : null);
          f.farPlan = false;
          if (f.nearPlan) { f.nearPlan = false; f.near = true; f.nearStage = 1; planNearPass(f, t); }
        }
        continue;
      }
      // корм: все, кому можно, плывут к хлопьям
      if (anyFood && t >= f.nextFeedLook) {
        f.nextFeedLook = t + 0.5;
        if (wantsFood(f, t)) {
          const k = nearestFlake(f, t);
          if (k) { if (f.state === ST.HIDE || f.state === ST.PEEK) f.allowBehind = false; setState(f, ST.FEED, t, 60); f.flake = k; f.near = false; }
        }
      }
      coralLock(f);                                  // V4b: глубина у колоний переднего рифа (по прошлой раскладке тела)
      think(f, dt, t);
      if (isOff(f)) continue;
      // клевок: 0 → 0.1 BL за 0.12 с → назад за 0.25 с
      if (f.peck >= 0) {
        f.peck += dt;
        f.peckOff = f.peck < 0.12 ? 0.1 * f.L0 * smooth01(0, 0.12, f.peck) : 0.1 * f.L0 * (1 - smooth01(0.12, 0.37, f.peck));
        if (f.peck > 0.37) { f.peck = -1; f.peckOff = 0; }
      }
      if (f.turn.on) updateTurn(f, dt); else steer(f, dt, t);
      // край кадра: кто не уходит — разворачивается заранее (территориальные, домоседы)
      if (!f.turn.on && !f.leaving && f.state !== ST.FEED && !(f.school && !f.isLeader)) {
        const m = 0.15 * f.len;
        if ((f.dir < 0 && f.minX < m && f.tX < f.X) || (f.dir > 0 && f.maxX > W - m && f.tX > f.X)) {
          if (f.state === ST.CRUISE || f.state === ST.SHOAL) cruiseTarget(f, t, true);
          else setTarget(f, clamp(f.x - f.dir * 0.3 * W, 0.08 * W, 0.92 * W), f.y, f.z);
        }
      }
      // хвост: f = 1.2 + 1.8·BL/s, амплитуда 0.16 (зависание) … 0.6 рад (ход), на развороте — вполсилы
      const vv = f.turn.on ? f.turn.v : Math.hypot(f.v, f.vy);
      const sBL = vv / f.L0;
      f.speedBL = sBL;
      f.tp += TAU * (1.2 + 1.8 * Math.min(sBL, 2.5)) * f.beatK * dt;   // вуаль — неторопливее (veil.beat)
      if (f.tp > 6283.185307179586) f.tp -= 6283.185307179586;
      const Aw = (f.turn.on ? 0.55 : 1) * (0.16 + 0.44 * smooth01(0.05, 1.0, sBL));
      f.tA += (Aw - f.tA) * (1 - Math.exp(-dt / 0.35));
      f.bobP += TAU * f.bobF * dt;
      layoutFish(f);
      if (!f.visible) f.hiddenT += dt;
      // случайно уплыл за край, не имея права — вернуть цель внутрь
      const inward = (f.x < 0.5 * W) === (f.dir > 0);
      if (!f.onScreen && !f.leaving && !inward && !(f.school && !f.isLeader && f.state === ST.SHOAL) && f.state !== ST.FEED)
        setTarget(f, clamp(f.x, 0.1 * W, 0.9 * W), clamp(f.y, waterTop() + f.h, H - f.h), f.z);
    }
    collideFish(dt);                                 // V5: тела не висят друг в друге (по положению)
  }

  /* ---------- начальная расстановка ---------- */
  function initClash(f, x, y, z) {
    for (let i = 0; i < fishes.length; i++) {
      const g = fishes[i];
      if (g === f || isOff(g) || !(g.aliveT === 0 && g.len > 1) || Math.abs(g.z - z) > 0.15) continue;
      if (Math.abs(g.x - x) < 0.55 * (g.len + f.L0 / z) && Math.abs(g.y - y) < 0.6 * (g.h + bodyH(f) / z)) return true;
    }
    return false;
  }
  function placeInitial(f, t) {
    const zn = f.pack ? f.pack.zone : [0.15, 0.85];
    f.dir = R() < 0.5 ? -1 : 1; f.yaw = 0; f.pitch = 0; f.vy = 0; f.turn.on = false;
    if (f.habit === "home") {
      homeOf(f);
      f.z = f.hz; f.X = worldX(f.hx + (f.hSide < 0 ? -Math.max(0.28 * f.hrx, 0.4 * f.L0) : f.hSide > 0 ? Math.max(0.5 * f.hrx, 0.62 * f.L0) : 0) + rand(-0.2, 0.2) * (f.hSide ? 1 : 2.5) * f.hrx, f.z); f.Y = worldY(f.hy - 0.3 * f.hry, f.z);
      f.v = 0.3 * f.L0; setState(f, ST.HOME, t);
    } else {
      // V5: стартовая точка — не в теле уже расставленной рыбы (до 8 попыток)
      for (let k = 0; k < 8; k++) {
        pickPoint(f, 0.1 * W, 0.9 * W, zn[0], zn[1], f.zMin, Math.min(f.zMax, f.zMin + 0.7 * (f.zMax - f.zMin)), false);
        if (!initClash(f, PK.x, PK.y, PK.z)) break;
      }
      f.z = PK.z; f.X = worldX(PK.x, PK.z); f.Y = worldY(PK.y, PK.z); f.v = f.cruise * f.L0;
      if (f.school) setState(f, ST.SHOAL, t, rand(12, 24)); else nextActivity(f, t);
    }
    f.aliveT = 0; f.hiddenT = 0;
    layoutFish(f);
  }

  /* ============================================================
     РЕЖИССЁР СЮЖЕТА (SPEC 4.7): «бит» каждые 20–45 с, не больше одного крупного одновременно,
     у каждого — своя пауза повтора. Автокормушка — в режиме обоев раз в 6–10 мин (клика там нет, F14).
     E4: STORY_HOOKS.crab = (t) => true|false — «краб перебежал» (бит с паузой 60 с).
     ============================================================ */
  const STORY_HOOKS = { crab: null };
  const DIRECTOR = { next: 14, major: null, majorEnd: 0, last: {}, log: [], lastBeat: 0, beats: 0 };
  const BEATS = [
    { id: "nearGlass", cd: 90, major: true, w: 1.0 },
    { id: "farPass", cd: 45, major: true, w: 1.0 },
    { id: "shoalSweep", cd: 40, major: true, w: 1.0 },
    { id: "peek", cd: 35, major: true, w: 0.9 },
    { id: "graze", cd: 20, major: false, w: 0.8 },
    { id: "chase", cd: 180, major: true, w: 0.8 },
    { id: "crab", cd: 60, major: false, w: 0.7 },
    { id: "burp", cd: 30, major: false, w: 0.7 },
    { id: "nook", cd: 50, major: false, w: 0.8 },        // V4b: рыба заходит в просвет переднего рифа (сквозь крону)
  ];
  function logBeat(id, t, who) {
    DIRECTOR.log.push({ t: +t.toFixed(2), id, fish: who || null });
    if (DIRECTOR.log.length > 240) DIRECTOR.log.shift();
    DIRECTOR.lastBeat = t; DIRECTOR.beats++;
  }
  const busy = (f) => isOff(f) || f.turn.on || f.state === ST.FEED || f.state === ST.CHASE || f.state === ST.FLEE || f.state === ST.HIDE || f.state === ST.PEEK || f.near;
  function runBeat(b, t) {
    switch (b.id) {
      case "nearGlass": {           // крупная рыба проплывает у самого стекла (z ≈ 0.88–0.93, масштаб до ×1.15)
        let best = null;
        for (const f of fishes) {
          if (f.school || f.habit === "home" || f.habit === "lurk" || f.tr.territorial >= 0.7 || (f.state !== ST.CRUISE && f.state !== ST.HOVER && !isOff(f)) || f.turn.on) continue;
          if (!best || f.L0 > best.L0 * (0.9 + 0.2 * R())) best = f;
        }
        if (!best) return 0;
        if (isOff(best)) { best.nearPlan = true; best.offUntil = Math.min(best.offUntil, t + 1); }
        else { best.near = true; best.nearStage = 1; setState(best, ST.CRUISE, t, 30); best.near = true; best.nearStage = 1; planNearPass(best, t); }
        logBeat(b.id, t, best.pack ? best.pack.id : null);
        return 28;
      }
      case "farPass": {             // крейсер, который сейчас за кадром, проходит далеко в окне глубокой воды
        if (!DEEP_RUNS.length) return 0;
        let c = null;
        for (const f of fishes) if (isOff(f) && !f.school && f.habit === "cruise" && f.tr.territorial < 0.7 && !f.nearPlan && (!c || f.offUntil < c.offUntil)) c = f;
        if (!c) return 0;
        c.farPlan = true; c.offUntil = Math.min(c.offUntil, t + 0.5);
        logBeat(b.id, t, c.pack ? c.pack.id : null);
        return 14;
      }
      case "shoalSweep": {          // стая проходит вглубь (в просвет за холмом) или к стеклу
        const sc = SCHOOLS[0];
        if (!sc || isOff(sc.leader) || sc.leader.turn.on) return 0;
        const ld = sc.leader, zn = ld.pack.zone;
        setState(ld, ST.SHOAL, t, 26);
        // по очереди: вглубь (к дальнему просвету, куда сходятся лучи) — и к самому стеклу через полкадра
        sc.deepNext = sc.deepNext === undefined ? ld.z < 1.35 : !sc.deepNext;
        if (sc.deepNext && ld.z < 1.6) pickPoint(ld, bgX(0.37), bgX(0.62), 0.05, 0.45, 1.95, Math.min(2.35, ld.zMax), false);
        else pickPoint(ld, ld.x < 0.5 * W ? 0.55 * W : 0.12 * W, ld.x < 0.5 * W ? 0.88 * W : 0.45 * W, Math.max(zn[0], 0.25), Math.min(1, zn[1] + 0.2), 1.0, 1.08, false);
        setTarget(ld, PK.x, PK.y, PK.z); sc.sweep = 1;
        logBeat(b.id, t, ld.pack.id);
        return 24;
      }
      case "peek": {
        let f = null;
        for (const g of fishes) if (g.state === ST.HIDE && g.sub === 2) { f = g; break; }
        if (f) { if (!enterPeek(f, t)) return 0; logBeat(b.id, t, f.pack ? f.pack.id : null); return 12; }
        for (const g of fishes) if (g.habit === "hide" && !busy(g) && g.visible && enterHide(g, t)) { g.stDur = rand(3, 6); logBeat("hide", t, g.pack ? g.pack.id : null); return 20; }
        return 0;
      }
      case "graze": {               // показ кормёжки на камне — у самой освещённой точки
        let f = null;
        for (const g of fishes) if ((g.habit === "graze" || g.habit === "pick") && !busy(g) && g.state !== ST.GRAZE && g.state !== ST.PICK && g.visible) { f = g; break; }
        if (!f) return 0;
        const list = spotsOf(f.habit === "pick" ? "pick" : "graze", f);
        let best = null, bl = -1;
        updateLight(t);
        for (const s of list) { const l = lightAt(bgX(s.bx), bgY(s.by)); if (l > bl) { bl = l; best = s; } }
        enterGraze(f, t, f.habit === "pick" ? ST.PICK : ST.GRAZE);
        if (best) { f.spot = best; setTarget(f, bgX(best.bx), bgY(best.by), spotZ(f, bgX(best.bx), bgY(best.by), best.z)); }
        logBeat(b.id, t, f.pack ? f.pack.id : null);
        return 0;
      }
      case "chase": {               // территориальный хирург гоняет соседа 2–4 с
        for (const c of fishes) {
          if (c.tr.territorial < 0.7 || busy(c) || !c.visible || c.habit === "home") continue;
          let v = null, vd = 0.38 * W;
          for (const o of fishes) {
            if (o === c || busy(o) || !o.visible || o.school || o.habit === "home" || o.L0 > c.L0 * 1.15) continue;
            const d = Math.hypot(o.x - c.x, o.y - c.y);
            if (d < vd) { vd = d; v = o; }
          }
          if (!v) continue;
          const dur = rand(2, 4);
          setState(c, ST.CHASE, t, dur); c.other = v;
          setState(v, ST.FLEE, t, dur + 1); v.other = c; v.dart = 0.3;
          logBeat(b.id, t, (c.pack ? c.pack.id : "") + ">" + (v.pack ? v.pack.id : ""));
          return dur + 3;
        }
        return 0;
      }
      case "crab":
        if (!STORY_HOOKS.crab || !STORY_HOOKS.crab(t)) return 0;
        logBeat(b.id, t); return 0;

    for (let i = 0; i < dynN; i++) { const d = DYN[i]; if (d.g < 0 || d.g >= ns) rlPush(d.z, d.kind, d.obj, d.part); }
    SCN.groups = groups; SCN.members = members;
  }
  function drawDyn(kind, obj, part, t) {
    if (kind === RK_PROP) {                                 // предмет сцены на своём z (передний слой актинии)
      const d0 = CNT.drawImage;
      drawItem(ctx, obj, RS, OX, OY); baseT();
      if (llOn && llHits(obj.x0, obj.y0, obj.x1, obj.y1)) {  // свет рыб под ним — стереть
        llCtx.globalCompositeOperation = "destination-out"; drawOps(llCtx, obj, false, llQ, 0, 0);
        llCtx.globalCompositeOperation = "source-over"; llCtx.setTransform(1, 0, 0, 1, 0, 0);
      }
      CNT.e4Scene += CNT.drawImage - d0;
    } else if (kind === RK_FISH) drawFish(obj, t);
    else if (kind === RK_BUBBLES) drawBubbleSource(obj, t, part);
    else if (kind === RK_FLAKE) { const d0 = CNT.drawImage; drawFlake(obj); CNT.e3Food += CNT.drawImage - d0; baseT(); }
  }
  // группа s: члены — в буфер (по глубине), вычесть альфы предмета и всех ближе, буфер — на холст
  function drawGroup(s, t) {
    const q = SCN.ord[s], o = s * 4;
    const x0 = Math.max(0, GRP_U[o]), y0 = Math.max(0, GRP_U[o + 1]), x1 = Math.min(W, GRP_U[o + 2]), y1 = Math.min(H, GRP_U[o + 3]);
    if (!q || x1 <= x0 || y1 <= y0) return;
    const d0 = CNT.drawImage;
    const ox = Math.floor(x0 * RS) / RS, oy = Math.floor(y0 * RS) / RS, pw = Math.ceil(x1 * RS) - Math.floor(x0 * RS), ph = Math.ceil(y1 * RS) - Math.floor(y0 * RS);
    let slot = q.gb; if (!slot) slot = q.gb = [null, null];   // буферы — у предмета (не у индекса после сортировки)
    const tg0 = COUNTING ? performance.now() : 0;
    const e = gbuf(slot, SCN.frame & 1, pw, ph), g = e.g;
    if (COUNTING) CNT.e4MsBuf += performance.now() - tg0;
    // члены группы — дальние первыми
    GRP_M.length = 0;
    for (let i = 0; i < dynN; i++) if (DYN[i].g === s) GRP_M.push(DYN[i]);
    sortByZ(GRP_M, GRP_M.length);
    const dm = CNT.drawImage, tm0 = COUNTING ? performance.now() : 0;
    ctx = g; OX = ox; OY = oy; baseT();
    for (let i = 0; i < GRP_M.length; i++) { const d = GRP_M[i]; drawDyn(d.kind, d.obj, d.part, t); }
    const dm1 = CNT.drawImage, tm1 = COUNTING ? performance.now() : 0;
    g.globalAlpha = 1; g.globalCompositeOperation = "destination-out";
    const gz = GRP_Z[s];                                     // вычитаются сам предмет и всё, что ближе группы
    for (let k = 0; k < SCN.nOrd; k++) {
      const r = SCN.ord[k];
      if ((r !== q && r.z > gz) || !hitBox(r, x0, y0, x1, y1)) continue;
      drawOps(g, r, true, RS, ox, oy);
    }
    g.globalCompositeOperation = "source-over"; g.setTransform(1, 0, 0, 1, 0, 0);
    ctx = mainCtx; OX = 0; OY = 0;
    ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    const tm2 = COUNTING ? performance.now() : 0;
    ctx.drawImage(e.c, 0, 0, pw, ph, ox, oy, pw / RS, ph / RS);
    if (COUNTING) { const tm3 = performance.now(); CNT.e4MsMembers += tm1 - tm0; CNT.e4MsSub += tm2 - tm1; CNT.e4MsComp += tm3 - tm2; }
    // свет лучей на спрятанных рыбах: стереть под альфой предметов (слой света рисуется после списка)
    const tl0 = COUNTING ? performance.now() : 0;
    if (llOn) {
      const lg = llCtx;
      lg.globalCompositeOperation = "destination-out"; lg.globalAlpha = 1;
      for (let k = 0; k < SCN.nOrd; k++) {
        const r = SCN.ord[k];
        if ((r !== q && r.z > gz) || !hitBox(r, x0, y0, x1, y1) || !llHits(r.x0, r.y0, r.x1, r.y1)) continue;
        drawOps(lg, r, true, llQ, 0, 0);
      }
      lg.globalCompositeOperation = "source-over"; lg.setTransform(1, 0, 0, 1, 0, 0);
    }
    if (COUNTING) CNT.e4MsLL += performance.now() - tl0;
    CNT.e4Group += CNT.drawImage - d0 - (dm1 - dm);
  }

  /* ---------- отладка (?debug=2): рамки предметов сцены, группы, краб ---------- */
  function drawDebugScene() {
    if (!SCN.on) return;
    ctx.font = "11px ui-monospace, Menlo, Consolas, monospace"; ctx.textBaseline = "top"; ctx.lineWidth = 1.5;
    for (let i = 0; i < SCN.nOrd; i++) {
      const it = SCN.ord[i];
      ctx.strokeStyle = it.kind === "occ" ? "rgba(255,90,90,0.95)" : it.kind === "patch" ? "rgba(90,200,255,0.95)" : it.kind === "coral" ? "rgba(120,255,200,0.95)" : "rgba(255,170,255,0.95)";
      ctx.setLineDash(it.kind === "occ" ? [8, 4] : []);
      ctx.strokeRect(it.x0, it.y0, it.x1 - it.x0, it.y1 - it.y0);
      ctx.fillStyle = ctx.strokeStyle; ctx.fillText(`${it.kind}:${it.id} z${it.z.toFixed(2)}${it.core ? " core" : ""}`, it.x0 + 3, it.y0 + 3);
    }
    ctx.setLineDash([]);
    ctx.strokeStyle = "rgba(255,255,0,0.95)"; ctx.lineWidth = 2;
    for (let s = 0; s < SCN.nOrd; s++) {
      const o = s * 4;
      if (GRP_U[o + 2] < -1e8) continue;
      ctx.strokeRect(GRP_U[o], GRP_U[o + 1], GRP_U[o + 2] - GRP_U[o], GRP_U[o + 3] - GRP_U[o + 1]);
      ctx.fillStyle = "#ffff60"; ctx.fillText(`группа→${SCN.ord[s].id}`, GRP_U[o] + 2, GRP_U[o + 3] + 2);
    }
  }

  /* ============================================================
     SCENERY — reef composition rebuilt on resize
     ============================================================ */
  let reef = [], kelp = [], backReef = [], rubble = [];
  const U = () => (W / 1280) * 1.5; // size unit (reference 1280-wide, ×1.5 for a tall, dense reef)

  function buildScenery() {
    // composition left -> right, echoing the original layout, drawn back->front
    const layout = [
      // continuous rocky base ridge (back)
      { type: "rock", x: 0.08, w: 0.30, h: 0.15, color: "#5e472d" },
      { type: "rock", x: 0.34, w: 0.30, h: 0.18, color: "#6b5036" },
      { type: "rock", x: 0.60, w: 0.32, h: 0.17, color: "#5a4329" },
      { type: "rock", x: 0.88, w: 0.30, h: 0.15, color: "#604a30" },
      // left group — warm yellows/orange
      { type: "soft", x: 0.05, scale: 1.0, color: "#ffd21a" },
      { type: "soft", x: 0.11, scale: 0.78, color: "#ffb300" },
      { type: "sponge", x: 0.15, scale: 1.0, color: "#e8631a" },
      { type: "tubes", x: 0.21, scale: 0.9, color: "#cf9a5c" },
      // center-left
      { type: "tubes", x: 0.30, scale: 1.0, color: "#d68f86" },
      { type: "soft", x: 0.36, scale: 0.72, color: "#ffcf3a" },
      { type: "staghorn", x: 0.43, scale: 1.1, color: "#dcdcce" },
      { type: "barrel", x: 0.57, scale: 1.05, color: "#cf9a5c" },
      // center-right tall tubes
      { type: "tubes", x: 0.66, scale: 1.3, color: "#d79a64", tall: true },
      { type: "soft", x: 0.73, scale: 0.78, color: "#ff8a24" },
      // right group — pink / purple / blue accents
      { type: "fan", x: 0.79, scale: 1.1, color: "#8a5fbf" },
      { type: "sponge", x: 0.84, scale: 1.0, color: "#ef5fa0" },
      { type: "staghorn", x: 0.88, scale: 0.78, color: "#d2d2c2" },
      { type: "soft", x: 0.93, scale: 0.85, color: "#ffd21a" },
      { type: "coralblue", x: 0.97, scale: 0.9, color: "#5a6fd0" },
      // foreground accents (drawn last)
      { type: "anemone", x: 0.50, scale: 1.0, color: "#e58aa0" },
      { type: "star", x: 0.90, scale: 1.0, color: "#d8392a" },
      { type: "crab", x: 0.12, scale: 1.0, color: "#b04a2c" },
    ];
    reef = layout.map((e, i) => Object.assign({ seed: 1000 + i * 7 }, e));

    // green seaweed
    kelp = [];
    const clusters = clamp(Math.round(W / 320), 3, 6);
    for (let c = 0; c < clusters; c++) {
      const baseX = (W / clusters) * (c + rand(0.2, 0.8));
      const blades = randInt(3, 5);
      const hue = rand(115, 150);
      for (let b = 0; b < blades; b++)
        kelp.push({ x: baseX + rand(-30, 30), h: rand(H * 0.14, H * 0.30), w: rand(6, 13),
          phase: rand(0, TAU), speed: rand(0.7, 1.3), amp: rand(10, 24), hue });
    }

    // hazy distant reef silhouettes near the reef line (depth)
    backReef = [];
    const n = clamp(Math.round(W / 180), 5, 12);
    for (let i = 0; i < n; i++)
      backReef.push({ x: (W / n) * (i + rand(0.1, 0.9)), w: rand(W * 0.10, W * 0.22),
        h: rand(H * 0.04, H * 0.12), a: rand(0.12, 0.30) });

    // colourful coral rubble scattered along the reef base
    rubble = [];
    const cols = ["#e8631a", "#ffd21a", "#d68f86", "#ef5fa0", "#8a5fbf", "#5fae5a", "#cf9a5c", "#ff8a24"];
    const rn = clamp(Math.round(W / 20), 30, 95);
    for (let i = 0; i < rn; i++)
      rubble.push({ x: rand(0, W), y: floorY - H * 0.03 + rand(0, (H - floorY) * 0.85),
        r: rand(7, 18) * U(), color: cols[(R() * cols.length) | 0], flat: 0.45 + R() * 0.4 });
    rubble.sort((a, b) => a.y - b.y); // back-to-front
  }

  /* ---------- reef element drawers ---------- */
  function drawRock(ex, base, w, h, color) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(ex - w / 2, base + 8);
    const steps = 9;
    for (let i = 0; i <= steps; i++) {
      const f = i / steps, x = ex - w / 2 + f * w;
      const y = base + 8 - Math.sin(f * Math.PI) * h * (0.7 + 0.3 * Math.sin(f * 9 + ex));
      ctx.lineTo(x, y);
    }
    ctx.lineTo(ex + w / 2, base + 8); ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    const g = ctx.createLinearGradient(0, base - h, 0, base);
    g.addColorStop(0, "rgba(255,255,255,0.10)"); g.addColorStop(1, "rgba(0,0,0,0.28)");
    ctx.fillStyle = g; ctx.fill();
    ctx.restore();
  }

  function drawSoftCoral(ex, base, s, color, rng) {
    const u = U() * s;
    ctx.save(); ctx.translate(ex, base + 4);
    const n = 11, spread = 60 * u, height = 96 * u;
    for (let i = 0; i < n; i++) {
      const fx = (rng() * 2 - 1) * spread, fy = -height * (0.35 + 0.65 * rng()), r = (9 + rng() * 11) * u;
      ctx.strokeStyle = shade(color, -0.2); ctx.lineWidth = 3 * u; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(fx * 0.3, 0); ctx.quadraticCurveTo(fx * 0.6, fy * 0.6, fx, fy); ctx.stroke();
      const g = ctx.createRadialGradient(fx - r * 0.3, fy - r * 0.3, r * 0.2, fx, fy, r);
      g.addColorStop(0, shade(color, 0.28)); g.addColorStop(1, color);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(fx, fy, r, 0, TAU); ctx.fill();
      ctx.fillStyle = shade(color, -0.18);
      for (let d = 0; d < 4; d++) { const a = rng() * TAU, rr = rng() * r * 0.6; ctx.beginPath(); ctx.arc(fx + Math.cos(a) * rr, fy + Math.sin(a) * rr, r * 0.12, 0, TAU); ctx.fill(); }
    }
    ctx.restore();
  }

  function tubeBody(tx, w, h, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(tx - w / 2, 0);
    ctx.lineTo(tx - w / 2, -h + w * 0.25);
    ctx.quadraticCurveTo(tx - w / 2, -h, tx, -h);
    ctx.quadraticCurveTo(tx + w / 2, -h, tx + w / 2, -h + w * 0.25);
    ctx.lineTo(tx + w / 2, 0);
    ctx.closePath(); ctx.fill();
  }
  function drawTubes(ex, base, s, color, tall, rng) {
    const u = U() * s;
    ctx.save(); ctx.translate(ex, base + 4);
    const n = 4 + (rng() * 3 | 0);
    for (let i = 0; i < n; i++) {
      const tx = (i - (n - 1) / 2) * 18 * u + (rng() * 2 - 1) * 6 * u;
      const h = (tall ? 158 : 92) * u * (0.7 + 0.6 * rng());
      const w = (15 + rng() * 9) * u;
      const g = ctx.createLinearGradient(tx - w / 2, 0, tx + w / 2, 0);
      g.addColorStop(0, shade(color, -0.30)); g.addColorStop(0.42, shade(color, 0.18)); g.addColorStop(1, shade(color, -0.30));
      tubeBody(tx, w, h, g);
      ctx.fillStyle = shade(color, -0.5); ctx.beginPath(); ctx.ellipse(tx, -h, w * 0.34, w * 0.18, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = shade(color, 0.28); ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.ellipse(tx - w * 0.12, -h, w * 0.12, w * 0.07, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawBarrel(ex, base, s, color, rng) {
    const u = U() * s;
    ctx.save(); ctx.translate(ex, base + 4);
    const w = 76 * u, h = 84 * u;
    const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    g.addColorStop(0, shade(color, -0.30)); g.addColorStop(0.45, shade(color, 0.16)); g.addColorStop(1, shade(color, -0.30));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-w / 2, 0);
    ctx.bezierCurveTo(-w * 0.6, -h * 0.7, -w * 0.4, -h, 0, -h);
    ctx.bezierCurveTo(w * 0.4, -h, w * 0.6, -h * 0.7, w / 2, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade(color, -0.52); ctx.beginPath(); ctx.ellipse(0, -h, w * 0.32, w * 0.14, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = shade(color, -0.72); ctx.beginPath(); ctx.ellipse(0, -h + 2, w * 0.22, w * 0.09, 0, 0, TAU); ctx.fill();
    // vertical ridges
    ctx.strokeStyle = shade(color, -0.18); ctx.lineWidth = 1.5 * u; ctx.globalAlpha = 0.5;
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * w * 0.16, -2); ctx.lineTo(i * w * 0.13, -h * 0.86); ctx.stroke(); }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawStaghorn(ex, base, s, color, rng) {
    const u = U() * s;
    ctx.save(); ctx.translate(ex, base + 4); ctx.lineCap = "round";
    function branch(x, y, ang, len, wd, depth) {
      if (depth <= 0 || len < 6 * u) return;
      const nx = x + Math.cos(ang) * len, ny = y + Math.sin(ang) * len;
      ctx.lineWidth = wd; ctx.strokeStyle = shade(color, -0.04 * depth);
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.quadraticCurveTo((x + nx) / 2 + (rng() * 2 - 1) * 4 * u, (y + ny) / 2, nx, ny); ctx.stroke();
      branch(nx, ny, ang - (0.30 + rng() * 0.3), len * 0.72, wd * 0.72, depth - 1);
      branch(nx, ny, ang + (0.30 + rng() * 0.3), len * 0.72, wd * 0.72, depth - 1);
    }
    for (let i = 0; i < 3; i++) branch((i - 1) * 24 * u, 0, -Math.PI / 2 + (rng() * 0.4 - 0.2), 42 * u, 9 * u, 4);
    ctx.restore();
  }

  function drawSeaFan(ex, base, s, color, rng, t) {
    const u = U() * s;
    ctx.save(); ctx.translate(ex, base + 4); ctx.rotate(Math.sin(t * 0.6 + ex * 0.01) * 0.04);
    const h = 128 * u, spread = Math.PI * 0.52, ribs = 9;
    // faint membrane
    ctx.globalAlpha = 0.22; ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(0, 0);
    for (let i = 0; i < ribs; i++) { const a = -Math.PI / 2 + (i / (ribs - 1) - 0.5) * spread; ctx.lineTo(Math.cos(a) * h, Math.sin(a) * h); }
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    // ribs
    ctx.strokeStyle = color; ctx.lineCap = "round";
    for (let i = 0; i < ribs; i++) {
      const a = -Math.PI / 2 + (i / (ribs - 1) - 0.5) * spread;
      ctx.lineWidth = 3.0 * u;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(Math.cos(a) * h * 0.5, Math.sin(a) * h * 0.5 - 6 * u, Math.cos(a) * h, Math.sin(a) * h);
      ctx.stroke();
    }
    // cross veins (lacy)
    ctx.lineWidth = 1.3 * u; ctx.globalAlpha = 0.7;
    for (let ring = 0.4; ring < 1.0; ring += 0.22) {
      ctx.beginPath();
      for (let i = 0; i < ribs; i++) {
        const a = -Math.PI / 2 + (i / (ribs - 1) - 0.5) * spread;
        const x = Math.cos(a) * h * ring, y = Math.sin(a) * h * ring;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawAnemone(ex, base, s, color, rng, t) {
    const u = U() * s;
    ctx.save(); ctx.translate(ex, base + 4);
    const bw = 48 * u, bh = 26 * u;
    const g = ctx.createRadialGradient(0, -bh * 0.5, 2, 0, -bh * 0.4, bw);
    g.addColorStop(0, shade(color, 0.3)); g.addColorStop(1, shade(color, -0.15));
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, -bh * 0.4, bw, bh, 0, 0, TAU); ctx.fill();
    const n = 28;
    for (let i = 0; i < n; i++) {
      const fx = (i / (n - 1) - 0.5) * bw * 1.7, len = (28 + rng() * 20) * u, ph = rng() * TAU;
      const tipx = fx + Math.sin(t * 1.4 + ph) * 8 * u, tipy = -bh * 0.4 - len;
      ctx.strokeStyle = shade(color, 0.08 + 0.22 * rng()); ctx.lineWidth = 3.4 * u; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(fx, -bh * 0.4);
      ctx.quadraticCurveTo((fx + tipx) / 2 + Math.sin(t * 1.2 + ph) * 6 * u, -bh * 0.4 - len * 0.5, tipx, tipy);
      ctx.stroke();
      ctx.fillStyle = shade(color, 0.4); ctx.beginPath(); ctx.arc(tipx, tipy, 2.3 * u, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawStarfish(ex, ey, s, color, rng) {
    const u = U() * s;
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(rng() * TAU);
    const R = 36 * u, r = 15 * u, arms = 5;
    ctx.beginPath();
    for (let i = 0; i < arms * 2; i++) {
      const a = (i / (arms * 2)) * TAU - Math.PI / 2, rad = i % 2 === 0 ? R : r;
      const x = Math.cos(a) * rad, y = Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, R);
    g.addColorStop(0, shade(color, 0.28)); g.addColorStop(1, color);
    ctx.fillStyle = g; ctx.fill();
    ctx.fillStyle = shade(color, 0.35);
    for (let i = 0; i < arms; i++) { const a = (i / arms) * TAU - Math.PI / 2; ctx.beginPath(); ctx.arc(Math.cos(a) * R * 0.6, Math.sin(a) * R * 0.6, 2.6 * u, 0, TAU); ctx.fill(); }
    ctx.restore();
  }

  function drawCoralBlue(ex, base, s, color, rng) {
    const u = U() * s;
    ctx.save(); ctx.translate(ex, base + 4);
    for (let i = 0; i < 7; i++) {
      const x = (rng() * 2 - 1) * 34 * u, y = -rng() * 30 * u, r = (8 + rng() * 9) * u;
      const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r);
      g.addColorStop(0, shade(color, 0.3)); g.addColorStop(1, shade(color, -0.15));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawCrab(ex, ey, s, t) {
    const u = U() * s, bw = 26 * u, bh = 15 * u;
    ctx.save(); ctx.translate(ex, ey);
    ctx.strokeStyle = "#8a3b22"; ctx.lineWidth = 2.4 * u; ctx.lineCap = "round";
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 3; i++) {
        const tw = Math.sin(t * 2 + i + (side > 0 ? 0 : 1.5)) * 0.12;
        const lx = side * bw * 0.7;
        ctx.beginPath(); ctx.moveTo(lx, 0);
        ctx.quadraticCurveTo(lx + side * 14 * u, 3 * u + tw * 10 * u, lx + side * 22 * u, 8 * u);
        ctx.stroke();
      }
      // claw
      ctx.beginPath(); ctx.moveTo(side * bw * 0.7, -bh * 0.2);
      ctx.quadraticCurveTo(side * bw * 1.3, -bh * 0.9, side * bw * 1.5, -bh * 0.3); ctx.stroke();
      ctx.fillStyle = "#b04a2c"; ctx.beginPath(); ctx.ellipse(side * bw * 1.5, -bh * 0.3, 5 * u, 4 * u, 0, 0, TAU); ctx.fill();
    }
    const g = ctx.createRadialGradient(0, -bh * 0.3, 2, 0, 0, bw);
    g.addColorStop(0, "#c75a36"); g.addColorStop(1, "#8a3b22");
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, bw, bh, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath(); ctx.arc(-bw * 0.3, -bh * 0.75, 2 * u, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(bw * 0.3, -bh * 0.75, 2 * u, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawReef(t) {
    for (const e of reef) {
      const rng = srand(e.seed);
      const ex = e.x * W, base = floorY;
      if (e.type === "rock") drawRock(ex, base, e.w * W, e.h * H, e.color);
      else if (e.type === "soft") drawSoftCoral(ex, base, e.scale, e.color, rng);
      else if (e.type === "sponge") drawSoftCoral(ex, base, e.scale * 0.9, e.color, rng);
      else if (e.type === "tubes") drawTubes(ex, base, e.scale, e.color, e.tall, rng);
      else if (e.type === "barrel") drawBarrel(ex, base, e.scale, e.color, rng);
      else if (e.type === "staghorn") drawStaghorn(ex, base, e.scale, e.color, rng);
      else if (e.type === "fan") drawSeaFan(ex, base, e.scale, e.color, rng, t);
      else if (e.type === "anemone") drawAnemone(ex, base, e.scale, e.color, rng, t);
      else if (e.type === "coralblue") drawCoralBlue(ex, base, e.scale, e.color, rng);
      else if (e.type === "star") drawStarfish(ex, floorY + (H - floorY) * 0.72, e.scale, e.color, rng);
      else if (e.type === "crab") drawCrab(ex, floorY + (H - floorY) * 0.82, e.scale, t);
    }
  }

  function drawKelp(t) {
    for (const k of kelp) {
      const segs = 10;
      ctx.beginPath();
      for (let i = 0; i <= segs; i++) {
        const f = i / segs, y = floorY - f * k.h, sway = Math.sin(t * k.speed + k.phase + f * 3) * k.amp * f * f, hw = (k.w * (1 - f) * 0.5) + 0.8;
        ctx.lineTo(k.x + sway - hw, y);
      }
      for (let i = segs; i >= 0; i--) {
        const f = i / segs, y = floorY - f * k.h, sway = Math.sin(t * k.speed + k.phase + f * 3) * k.amp * f * f, hw = (k.w * (1 - f) * 0.5) + 0.8;
        ctx.lineTo(k.x + sway + hw, y);
      }
      ctx.closePath();
      const g = ctx.createLinearGradient(0, floorY - k.h, 0, floorY);
      g.addColorStop(0, `hsla(${k.hue},58%,55%,0.92)`); g.addColorStop(1, `hsla(${k.hue},62%,24%,0.92)`);
      ctx.fillStyle = g; ctx.fill();
    }
  }

  function drawBackReef() {
    ctx.save();
    for (const b of backReef) {
      ctx.globalAlpha = b.a; ctx.fillStyle = "#2f6e90";
      ctx.beginPath();
      ctx.moveTo(b.x - b.w / 2, floorY + 6);
      const steps = 7;
      for (let i = 0; i <= steps; i++) { const f = i / steps; ctx.lineTo(b.x - b.w / 2 + f * b.w, floorY + 6 - Math.sin(f * Math.PI) * b.h); }
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // continuous reef mass the corals grow from, so the bottom reads as one
  // dense reef rather than scattered objects on bare sand
  function drawReefBase() {
    const baseBottom = floorY + (H - floorY) * 0.5; // leave a sand strip in front
    const segs = 28;
    ctx.beginPath();
    for (let i = 0; i <= segs; i++) {
      const f = i / segs, x = f * W;
      const y = floorY - H * 0.05 - Math.abs(Math.sin(f * 6 + 1.3)) * H * 0.07 - Math.sin(f * 21) * H * 0.012;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.lineTo(W, baseBottom);
    for (let i = segs; i >= 0; i--) { const f = i / segs, x = f * W; ctx.lineTo(x, baseBottom + Math.sin(f * 9 + 0.5) * H * 0.012); }
    ctx.closePath();
    const g = ctx.createLinearGradient(0, floorY - H * 0.12, 0, baseBottom);
    g.addColorStop(0, "#775b3d"); g.addColorStop(0.6, "#54402a"); g.addColorStop(1, "#3c2d1e");
    ctx.fillStyle = g; ctx.fill();
  }

  function drawRubble() {
    for (const b of rubble) {
      const g = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.4, b.r * 0.2, b.x, b.y, b.r);
      g.addColorStop(0, shade(b.color, 0.28)); g.addColorStop(1, shade(b.color, -0.12));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r, b.r * b.flat, 0, 0, TAU); ctx.fill();
    }
  }

  /* ============================================================
     WATER, LIGHT, SAND, VIGNETTE
     ============================================================ */
  function drawWater() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#18639b");
    g.addColorStop(0.30, "#2a86bd");
    g.addColorStop(0.62, "#3f9ac4");
    g.addColorStop(0.85, "#2f8bb6");
    g.addColorStop(1, "#1d6e9c");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // sunlight pool from the surface (upper-center)
    const r = ctx.createRadialGradient(W * 0.5, -H * 0.12, 0, W * 0.5, -H * 0.12, H * 0.95);
    r.addColorStop(0, "rgba(150,225,250,0.42)"); r.addColorStop(1, "rgba(150,225,250,0)");
    ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
    // haze band at the reef line (depth scattering)
    const hz = ctx.createLinearGradient(0, floorY - H * 0.18, 0, floorY);
    hz.addColorStop(0, "rgba(120,200,225,0)"); hz.addColorStop(1, "rgba(120,200,225,0.18)");
    ctx.fillStyle = hz; ctx.fillRect(0, floorY - H * 0.18, W, H * 0.18);
  }

  // лучи — полосы светодиодов этапа E1 (drawStreaks): и для фото, и для процедурного рифа

  function drawSand() {
    ctx.beginPath();
    ctx.moveTo(0, H); ctx.lineTo(0, floorY + 4);
    const segs = 16;
    for (let i = 0; i <= segs; i++) { const x = (W / segs) * i, y = floorY + 4 + Math.sin(i * 0.9 + 1.3) * 6; ctx.lineTo(x, y); }
    ctx.lineTo(W, H); ctx.closePath();
    const g = ctx.createLinearGradient(0, floorY, 0, H);
    g.addColorStop(0, "#c7c389"); g.addColorStop(0.5, "#bdb277"); g.addColorStop(1, "#a08f5e");
    ctx.fillStyle = g; ctx.fill();
    // greenish lit patch in the center
    const r = ctx.createRadialGradient(W * 0.5, floorY + H * 0.06, 0, W * 0.5, floorY + H * 0.06, W * 0.4);
    r.addColorStop(0, "rgba(205,210,140,0.5)"); r.addColorStop(1, "rgba(205,210,140,0)");
    ctx.fillStyle = r; ctx.fillRect(0, floorY, W, H - floorY);
    // shimmer specks
    ctx.fillStyle = "rgba(255,250,225,0.25)";
    for (let i = 0; i < 46; i++) { const x = (i * 197.3) % W, y = floorY + 14 + ((i * 53.7) % (H - floorY - 16)); ctx.fillRect(x, y, 1.4, 1.4); }
  }

  // виньетка — кэши в 1/4 разрешения по темам (строятся в resize и при смене сцены), на кадр — один
  // drawImage (в переходе тем — два, с весами); цвет и сила — TP[i].vignette [r, g, b, a]
  let vignetteCanvas = null;
  /* V5 (P1.6): виньетка — CSS-слоем: два холста ¼ разрешения поверх #tank с прозрачностью 1−k и k (то же обычное
     наложение, что drawImage с α), без полноэкранного прохода по буферу холста в каждом кадре. ?vigcss=0 — старый путь. */
  const VIG = [null, null], VIG_CSS = PARAMS.get("vigcss") !== "0", VIG_OP = [-1, -1];
  function buildVignette() {
    const vw = Math.max(16, Math.round(W / 4)), vh = Math.max(16, Math.round(H / 4));
    if (!TP[0]) themeParams();
    for (let i = 0; i < 2; i++) {
      let c = VIG[i];
      if (!c) {
        c = document.createElement("canvas");
        if (VIG_CSS) {
          c.style.cssText = "position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:1;opacity:0";
          canvas.parentNode.insertBefore(c, canvas.nextSibling);
        }
      }
      const v = TP[i].vignette;
      c.width = vw; c.height = vh;
      const g = c.getContext("2d");
      g.setTransform(vw / W, 0, 0, vh / H, 0, 0);
      const gr = g.createRadialGradient(W * 0.5, H * 0.44, H * 0.30, W * 0.5, H * 0.5, H * 0.92);
      const col = `${Math.round(v[0])},${Math.round(v[1])},${Math.round(v[2])}`;
      gr.addColorStop(0, `rgba(${col},0)`); gr.addColorStop(1, `rgba(${col},${clamp(v[3], 0, 1)})`);
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
      VIG[i] = c;
    }
    vignetteCanvas = VIG[0];
    VIG.w = W; VIG.h = H; VIG.scene = SCENE;
  }
  function drawVignette() {
    if (VIG.scene !== SCENE || VIG.w !== W || VIG.h !== H) buildVignette();   // сцена (темы) сменилась
    if (!LAYERS.vignette) {                           // P1.1 (зонд «без виньетки»): CSS-слои — прозрачны
      if (VIG_CSS) for (let i = 0; i < 2; i++) if (VIG_OP[i] !== 0) { VIG_OP[i] = 0; VIG[i].style.opacity = "0"; }
      return;
    }
    const k = TH.k;                                   // затемнение краёв — смесь двух виньеток
    if (VIG_CSS) {
      const o0 = Math.round((k < 0.999 ? (k > 0.001 ? 1 - k : 1) : 0) * 64) / 64, o1 = Math.round((k > 0.001 ? (k < 0.999 ? k : 1) : 0) * 64) / 64;
      if (o0 !== VIG_OP[0]) { VIG_OP[0] = o0; VIG[0].style.opacity = String(o0); }
      if (o1 !== VIG_OP[1]) { VIG_OP[1] = o1; VIG[1].style.opacity = String(o1); }
      return;
    }
    if (k < 0.999) { ctx.globalAlpha = k > 0.001 ? 1 - k : 1; ctx.drawImage(VIG[0], 0, 0, W, H); }
    if (k > 0.001) { ctx.globalAlpha = k < 0.999 ? k : 1; ctx.drawImage(VIG[1], 0, 0, W, H); }
    ctx.globalAlpha = 1;
  }

  /* ============================================================
     ENTITY POOLS + RESIZE + LOOP
     ============================================================ */
  // рыбы, стаи, заселение — в разделе «РЫБЫ» (этап E3)
  const targetFishCount = () => clamp(Math.round((W * H) / 100000), 8, 22);

  // буфер холста и всё, что от него зависит (кэши) — без пересева сцены (зовёт и регулятор качества)
  function backingRS() {
    layoutBackdrop();
    const r = Math.min(DPR, Math.sqrt(Math.min(MAX_BACKING_PX, pixelBudget()) / Math.max(1, W * H)), NOVIDCAP ? 8 : Math.max(1, 1.1 / Math.max(1e-3, BGX.sc)));
    return Math.max(0.25, Math.floor(r * QUALITY.rsMul * 16) / 16);
  }
  function applyBacking() { phB(PH_RS); applyBacking0(); phE(); }   // фаза «чёрного ящика»: смена буфера холста
  function applyBacking0() {
    const oRS = RS;
    RS = backingRS();
    canvas.width = Math.max(1, Math.floor(W * RS)); canvas.height = Math.max(1, Math.floor(H * RS));
    if (RS !== oRS) perfEvent("rs", { from: r3(oRS), to: r3(RS), mp: r2((canvas.width * canvas.height) / 1e6) });
    dropBuffers();
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(RS, 0, 0, RS, 0, 0);
    layoutBackdrop(); layoutCamera(); buildVignette(); buildLightCaches(); buildFishLight(); buildDeepRuns();
  }
  // V5: событие resize — CSS-размер сразу (браузер растянет старый буфер), дорогая пересборка (буфер, кэши
  // света, риф, рыбы) — один раз через 150 мс после последнего события (перетаскивание окна, смена режима
  // дисплея давали десятки пересборок по сотни мс). В тесте — сразу (харнесс ждёт кадр нужного размера).
  let resizeTimer = 0;
  function onResize() {
    if (TEST) { resize(); return; }
    canvas.style.width = window.innerWidth + "px"; canvas.style.height = window.innerHeight + "px";
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { resizeTimer = 0; resize(); }, 150);
  }
  // смена бюджета пикселей (питание): буфер пересобирается не сразу и не чаще раза в 3 с
  let budgetTimer = 0;
  function budgetChanged() {
    if (TEST || W <= 0 || budgetTimer) return;
    budgetTimer = setTimeout(() => { budgetTimer = 0; if (Math.abs(backingRS() - RS) > 1e-6) applyBacking(); }, 3000);
  }
  // бюджет от приложения (aquariumSetBudget): до первого кадра и в тесте — сразу, дальше — как смена питания
  function applyBudgetNow() {
    if (W <= 0) return;
    if (TEST || !revealed) { if (Math.abs(backingRS() - RS) > 1e-6) { applyBacking(); if (TEST) renderNow(); } }
    else budgetChanged();
  }
  /* restart-investigation: буферы-черновики (группы вычитания, краб, кэш переднего рифа и его каустика) — заново
     при смене буфера холста (прежние могли вырасти под крупный RS); кэши рифа пересоберутся в следующем кадре */
  function dropBuffers() {
    for (let i = 0; i < SCN.items.length; i++) SCN.items[i].gb = null;
    CB[0] = CB[1] = null; RFB[0] = RFB[1] = null; RLB[0] = RLB[1] = null;
    RFC.ok = false; RCC.ok = false;
  }
  function resize() { phB(PH_RESIZE); resize0(); phE(); }
  function resize0() {
    const oW = W, oH = H, oSS = W > 0 ? sizeScale() : 1;
    W = window.innerWidth; H = window.innerHeight; floorY = H * 0.78;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    perfEvent("resize", { w: W, h: H, dpr: DPR });
    seedParticles();
    applyBacking();
    buildScenery();
    if (oW > 0 && (oW !== W || oH !== H)) rescaleFish(oW, oH, oSS);   // та же точка экрана, та же глубина
    if (TEST) renderNow();
  }

  /* ---------- список отрисовки по глубине ----------
     Один заранее выделенный массив слотов, сортировка вставками на месте (элементов — десятки,
     устойчиво, без замыканий и временных массивов, как у Array.sort). Дальние (больший z) — первыми.
     kind: RK_FISH, RK_BUBBLES (колонна пузырьков одного источника, obj — источник из BSRC);
     следующие этапы добавят пропсы, окклюдеры, качающиеся участки. */
  // E4: RK_GROUP — буфер группы вычитания (part — индекс предмета сцены в SCN.ord); у RK_BUBBLES part — часть колонны
  const RK_FISH = 1, RK_BUBBLES = 2, RK_FLAKE = 3, RK_GROUP = 4, RK_PROP = 5;
  const RL_CAP = 512;
  const RL = new Array(RL_CAP);
  for (let i = 0; i < RL_CAP; i++) RL[i] = { z: 0, kind: 0, obj: null, part: 0 };
  let rlN = 0;
  function rlPush(z, kind, obj, part) {
    if (rlN >= RL_CAP) return;
    const it = RL[rlN++]; it.z = z; it.kind = kind; it.obj = obj; it.part = part | 0;
  }
  function rlSort() {
    for (let i = 1; i < rlN; i++) {
      const it = RL[i], z = it.z;
      let j = i - 1;
      while (j >= 0 && RL[j].z < z) { RL[j + 1] = RL[j]; j--; }
      RL[j + 1] = it;
    }
  }

  /* ---------- симуляция и кадр ----------
     simT — часы симуляции (с): двигают и физику, и фазы анимаций (хвосты, лучи, планктон),
     поэтому прогон по шагам детерминирован (?test=1&seed=N). */
  let simT = 0, stepQ = Promise.resolve();          // stepQ — очередь шагов теста с видео (__aq.step)
  function simulate(dt) {
    simT += dt;
    if (paused) return;
    const t = simT;
    themeStep(dt);                                   // переход между темами (вес ночи TH.k)
    updateLight(t);                                  // лучи этого момента (lightAt доступен симуляции)
    updateCrab(t, dt);                               // краб: стоит/ковыряет, перебежки, уход в тень (E4)
    updateFishAll(dt, t);                            // режиссёр, кормушка, поведение, курс, геометрия тел (E3)
    updateParticles(t, dt);
    updateBubbles(t, dt);                            // источники scene.bubbles; уплотнение пула на месте
    updateFlakes(dt, t);                             // корм: пул хлопьев, уплотнение на месте
  }

  /* порядок (SPEC §3): задник → слой сцены E4 (патчи, тени, пропсы) → каустика (+ отсвет у подножия
     лучей, тени рыб на песке) → полоса поверхности → дальние частицы → список по глубине (рыбы, части
     колонн пузырьков, корм; группы вычитания на z своих предметов сцены) → ближние частицы →
     лучи ('screen') → виньетка */
  let profT = 0;
  const prof = (k) => { if (COUNTING) { const n = performance.now(); CNT[k] += n - profT; profT = n; } };
  // V5: холст проявляется (CSS opacity 0 → 1 за 0.4 с) после первого настоящего кадра; в тесте — сразу
  let revealed = false;
  function reveal() { if (!revealed) { revealed = true; canvas.classList.add("on"); } }
  function render(t) {
    if (!bgSettled) {
      // V5: задник ещё грузится — тёмная вода без рифа и рыб (процедурный риф — только при настоящем отказе
      // задника: bgSettled && !bgReady). Раньше при каждом запуске мелькал «мультяшный» риф до постера.
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#02101c"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      return;
    }
    reveal();
    if (COUNTING) profT = performance.now();
    themeCaches(false);                              // ступени перекраски кэшей темы (обычно — ничего)
    fishTintStep(TEST ? 99 : 1);                     // V5: ночной свет на рыбах (по виду за кадр)
    updateLight(t);
    SCN.frame++;
    if (SCN.built) themePrebuild();                  // V4b: варианты предметов под тему — по одному набору на кадр
    poseScene(t);
    if (bgReady) {
      drawBackdrop();                                // кадр видео/постера (в переходе тем — оба)
      prof("pBack");
      drawSceneLayer(t);                             // до каустики: свет ложится на предметы, как на фото
      if (bgMode === "photo") nightTint(TH.k);       // фото-сцена ночью — общий multiply кадра с её патчами и реквизитом
      prof("pScene");
      if (LAYERS.caustics) drawCaustics(t);
      prof("pCaus");
      if (LAYERS.glow) drawFloorGlow();
      if (LAYERS.shadows) drawFishShadows();
      drawReefLayer(t);                              // V4b: передний риф (колонии + реквизит видео-сцены) со своей каустикой
      prof("pReef");
    } else {
      drawWater();                                   // процедурный риф: без полосы поверхности, свет сверху
      drawBackReef();
      drawSand();
      if (LAYERS.caustics) drawCaustics(t);          // процедурный риф: каустика только на песке
      drawReefBase();
      drawRubble();
      drawKelp(t);
      drawReef(t);
      nightTint(TH.k);                               // ночь — королевский синий поверх
    }
    drawParticles(t, false);
    prof("pBand");

    updateLitCut(); llBegin(t);
    const tb0 = COUNTING ? performance.now() : 0;
    buildRenderList(t);                              // динамика + группы вычитания (E4)
    if (COUNTING) CNT.e4MsList += performance.now() - tb0;
    rlSort();
    ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    for (let i = 0; i < rlN; i++) {
      const it = RL[i];
      if (it.kind === RK_GROUP) drawGroup(it.part, t);
      else drawDyn(it.kind, it.obj, it.part, t);
    }
    ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    prof("pList");
    const tc0 = COUNTING ? performance.now() : 0;
    llComposite();                                   // свет лучей на рыбах — одним слоем (см. «Слой света рыб»)
    if (COUNTING) CNT.e4MsLLC += performance.now() - tc0;
    prof("pLight");
    drawParticles(t, true);
    if (LAYERS.rays) drawStreaks(t);
    drawVignette();
    prof("pTail");
  }

  /* ---------- статистика кадра (только при COUNTING) ---------- */
  const STAT_KEYS = CNT_KEYS.concat("jsMs");
  const STAT = { frames: 0, total: 0, last: {}, sum: {}, max: {} };
  for (const k of STAT_KEYS) { STAT.last[k] = 0; STAT.sum[k] = 0; STAT.max[k] = 0; }
  function resetStats() { STAT.frames = 0; for (const k of STAT_KEYS) { STAT.sum[k] = 0; STAT.max[k] = 0; } }
  function recordStats(ms) {
    STAT.frames++; STAT.total++;
    for (let i = 0; i < CNT_KEYS.length; i++) {
      const k = CNT_KEYS[i], v = CNT[k];
      STAT.last[k] = v; STAT.sum[k] += v; if (v > STAT.max[k]) STAT.max[k] = v;
    }
    STAT.last.jsMs = ms; STAT.sum.jsMs += ms; if (ms > STAT.max.jsMs) STAT.max.jsMs = ms;
  }

  // тело кадра: шаг симуляции + (по желанию) отрисовка; JS-время — performance.now() вокруг всего тела

  let fbMs = 0;
  function frameSim(dt) {
    let t0 = 0;
    if (COUNTING) { for (let i = 0; i < CNT_KEYS.length; i++) CNT[CNT_KEYS[i]] = 0; t0 = performance.now(); }
    // V5 (P1.4): длинный кадр (до 0.1 с) — подшагами не длиннее 1/30 с: рыбы не «притормаживают» на провалах,
    // а поведение и столкновения не прыгают на крупном шаге
    const n = Math.max(1, Math.ceil(dt * 30 - 1e-6)), sub = dt / n;

  function drawDebugGeometry() {
    const S = SCENE;
    ctx.lineWidth = 1.5;
    // горизонт (точка схода; линии воды нет — поверхности в кадре нет)
    ctx.strokeStyle = "rgba(120,220,255,0.9)";

    // safeX — то, что видно на любом мониторе

    for (const bx of S.backdrop.safeX || []) { const x = bgX(bx); ctx.beginPath(); ctx.moveTo(x, BGX.bandH); ctx.lineTo(x, H); ctx.stroke(); }
    ctx.setLineDash([]);

      ctx.beginPath();
      for (let i = 0; i < S.floor.length; i++) { const p = S.floor[i]; if (i) ctx.lineTo(bgX(p[0]), bgY(p[1])); else ctx.moveTo(bgX(p[0]), bgY(p[1])); }

    // точки поведения

      const x = bgX(s.bx), y = bgY(s.by), r = (s.r || 0.03) * BGX.dw;
      ctx.strokeStyle = "rgba(140,255,140,0.95)"; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
      ctx.fillStyle = "#b6ffb6"; ctx.fillText(`${s.type}:${s.id} z${s.z}`, x + 4, y);
    }

    for (const b of S.bubbles) {
      const x = bgX(b.bx), y = bgY(b.by);
      ctx.strokeStyle = "rgba(255,255,255,0.95)"; ctx.beginPath(); ctx.arc(x, y, 6, 0, TAU); ctx.stroke();
      ctx.fillStyle = "#ffffff"; ctx.fillText(`${b.id} z${b.z}`, x + 9, y);
    }
    for (const l of (S.light && S.light.sources) || []) {
      const x = bgX(l.bx);
      ctx.fillStyle = "#fff6b0"; ctx.beginPath(); ctx.arc(x, BGX.bandH + 8, 5, 0, TAU); ctx.fill();
    }
    // E1: оси лучей (то, что считает lightAt) и линия пола из FLOOR_LUT (по ней — песок каустики, тени)
    ctx.strokeStyle = "rgba(255,240,150,0.7)"; ctx.lineWidth = 1;
    for (let k = 0; k < stN; k++) {
      const o = k * ST_F;
      ctx.beginPath(); ctx.moveTo(STV[o], STV[o + 1]); ctx.lineTo(STV[o] + STV[o + 2] * H * 0.5, STV[o + 1] + STV[o + 3] * H * 0.5); ctx.stroke();
    }
    ctx.strokeStyle = "rgba(255,200,120,0.6)"; ctx.setLineDash([3, 4]);
    ctx.beginPath();
    for (let i = 0; i <= 48; i++) { const x = (i / 48) * W; if (i) ctx.lineTo(x, floorYAt(x)); else ctx.moveTo(x, floorYAt(x)); }

  }

  let last = performance.now(), acc = 0, lastShown = 0;
  function frame(now) {
    requestAnimationFrame(frame);

    // движок делал между ними); дальше фазы копятся заново. По часам ВЫЗОВА, не по метке rAF: метка — начало кадра,
    // и кадр, начатый, пока поток был занят, приходит с ней после (Chromium) — застой и фазы ушли бы не в тот кадр
    P.stallNow = false; P.cbAt = cbAt;
    if (gap > STALL_MS && P.armed) stallLog(gap);
    phReset(); P.cbJs = 0;
    P.armed = POWER !== "paused" && !document.hidden;
    let raw = rawMs / 1000; last = now;
    if (raw > 0.25) raw = 0.25; else if (raw < 0) raw = 0;
    // app told us the display is off/occluded, or the view is hidden -> stop work
    if (POWER === "paused" || document.hidden) { lastShown = 0; acc = 0; syncVideos(); return; }
    // V5: пока задник не определился (постер грузится) — ни симуляции, ни отрисовки: холст ещё прозрачен
    if (!bgSettled) { acc = 0; return; }
    perfRaw(rawMs);                                  // P1.1: сырой интервал rAF — оценка vsync
    // V5 (P1.4): 'high' — не чаще 60 к/с (ProMotion 120 Гц — каждый второй vsync), 'low' — ≈30 к/с (и предел
    // приложения: второй экран — 30); допуск 15%: дрожание vsync не должно ронять 60 в 30 и 30 в 20. Время
    // движения — честное (dt ≤ 0.1 с, подшаги ≤ 1/30 с в frameSim). Зонд «как было» — каждый rAF.
    acc += raw;
    const step = PERF.noPace ? 0 : 0.85 / fpsTarget();
    if (acc < step) return;
    const dt = Math.min(acc, 0.1);
    acc = 0;
    const iv = lastShown ? now - lastShown : 0;
    if (iv && GOV_ON && !PROBE.on) govSample(iv);   // зонд — регулятор на паузе
    lastShown = now;
    const t0 = performance.now();
    syncVideos();                                    // видео тем: загрузка/освобождение, play/pause (дёшево)
    frameBody(dt, true);
    const js = performance.now() - t0;
    P.cbJs = js;
    if (iv) perfFrame(iv, js, now);                  // P1.1: кольца HUD/снимка/«чёрного ящика» (и шаг зонда)
  }

  /* ---------- тестовый API: window.__aq ----------
     step(dt, n, {render}) — n шагов по dt с; render: true (каждый шаг, по умолчанию) | false | "last".
     setTime(t), render(), stats(), resetStats(), fish(), scene(), bgMap(bx,by), bgUnmap(x,y),

  window.__aq = {
    version: 1, seed: SEED, test: TEST,
    ready: () => bgSettled && maskSettled && scSettled() && videoSettled() && (bgMode !== "video" || !TEST || (BGS.day.pState >= 2 && BGS.night.pState >= 2)) &&
      PACK.every((p) => !(p.image && p.count > 0) || p.ready || p.failed),
    // тест с видео (?bgvideo=webm|mp4) и отрисовкой — Promise: перед каждым рисуемым шагом видео перематывается

    step(dt, n, opts) {

        return simT;
      }
      const run = async () => {
        for (let i = 0; i < n; i++) {
          if (!(mode === true || (mode === "last" && i === n - 1))) { frameBody(dt, false); continue; }
          frameSim(dt);
          await seekVideosTo(simT);
          frameDraw();
        }
        return simT;
      };
      const p = stepQ.then(run, run);

    },

    theme() { return { mode: TH.mode, target: THEMES[TH.target], p: TH.p, k: TH.k, dark: systemDark(), bgMode, bgSrc,
      sources: THEMES.map((n) => { const S = BGS[n]; return { theme: n, poster: S.pState, video: S.vState, aligned: S.aligned, frame: S.frame,

    setTime(t) { simT = +t || 0; return simT; },

    resetStats() { resetStats(); },

      return {
        counting: COUNTING, frames: STAT.frames, total: STAT.total,
        last: Object.assign({}, STAT.last), avg, max: Object.assign({}, STAT.max),
        backing: { w: canvas.width, h: canvas.height, mp: canvas.width * canvas.height / 1e6 },
        css: { w: W, h: H }, dpr: DPR, RS, quality: Object.assign({}, QUALITY),
        governor: { p90: GOV.p90, fps: GOV.fps, bad: GOV.bad, good: GOV.good, recover: GOV.recover },

    fish() {

        X: f.X, Y: f.Y, L0: f.L0, len: f.len, h: f.h, dir: f.dir, facing: f.facing, yawDeg: f.yaw / DEG, pitchDeg: f.pitch / DEG,
        turning: f.turn.on, turnP: f.turn.p, turnT: f.turn.T, speedBL: f.speedBL, visible: f.visible, visFrac: f.visFrac,
        onScreen: f.onScreen, widthFrac: f.widthFrac, bbox: [f.minX, f.minY, f.maxX, f.maxY], near: !!f.near, leaving: !!f.leaving,
        school: f.school ? (f.isLeader ? "leader" : "follower") : null, target: [projX(f.tX, f.tz), projY(f.tY, f.tz), f.tz],
        depth: f.depth, alpha: f.alpha, sprite: !!(f.pack && f.pack.ready), slices: f.n, litMax: f.litMax, hiddenT: f.hiddenT, aliveT: f.aliveT, viol: f.viol,

    },
    // E3: компактный снимок для 10-минутной симуляции (харнесс sim.js): по 14 чисел на рыбу
    fishGeom() {

    flakesDbg() { const o = []; for (let i = 0; i < flkN; i++) { const k = FLK[i]; o.push({ x: projX(k.X, k.z), y: projY(k.Y, k.z), z: k.z, age: k.age, landed: k.landed, claim: k.claim }); } return o; },

    perfState() {

        stagger: STAGGER, paced: !PERF.noPace, noVidCap: NOVIDCAP, probing: PROBE.on, level: QUALITY.level, fpsTarget: fpsTarget(),

    },
    blackbox() { return { on: BB.on, reload: BB_RELOAD, writes: BB.writes, bytes: BB.bytes, fails: BB.fails, err: BB.err, stalls: BB.stalls, prevLine: BB.prevLine, phases: PH_NAMES.slice() }; },
    // тесты (perf.js): симуляция на паузе (кадры рисуются, рыбы стоят) и сброс кэшей по времени и буферов — кадр «с нуля»
    pause(on) { paused = !!on; return paused; },
    invalidate() { themeInvalidate(); dropBuffers(); return true; },
    // E1: свет и вода — для гейтов и следующих этапов
    layers(o) { if (o) for (const k in o) if (k in LAYERS) LAYERS[k] = !!o[k]; return Object.assign({}, LAYERS); },
    lightAt(x, y) { updateLight(simT); return lightAt(x, y); },
    causticAt(x, y) { return causticAt(x, y, simT); },
    current(x) { return currentAt(simT, x == null ? W / 2 : x); },
    floorYAt(x) { return floorYAt(x); },
    maskAt(x, y) { return maskAtScreen(x, y); },
    burp(id) { return bubbleBurp(id); },
    bubbles() {
      const out = [];
      for (let i = 0; i < bubN; i++) { const b = BUB[i]; out.push({ src: b.src && b.src.id, x: b.x, y: b.y, r: b.r, vy: b.vy, age: b.age }); }
      return { n: bubN, sources: BSRC.map((s) => ({ id: s.id, kind: s.kind, x: s.x, y: s.y, z: s.z })), list: out };
    },
    // маска каустики в экранных координатах (белое = 1) — кадр для проверки «вне маски»
    showMask() {
      if (!maskCan) return false;
      ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(maskCan, 0, BGX.bandH, W, H - BGX.bandH);
      return true;
    },
    streaks() { updateLight(simT); const o = []; for (let k = 0; k < stN; k++) o.push(Array.from(STV.subarray(k * ST_F, k * ST_F + ST_F))); return o; },
    // проверка applyMaskedCaustic (как его зовёт E4): нарисовать img в (x,y,w,h) и наложить его долю каустики
    drawWithCaustic(img, x, y, w, h, opts) {
      ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
      ctx.drawImage(img, x, y, w, h);
      return applyMaskedCaustic(ctx, img, x, y, w, h, opts);
    },
    // E4: предметы сцены (рамки кадра, z, готовность), группы вычитания, краб
    sceneItems() {
      return SCN.items.map((it) => ({ id: it.id, kind: it.kind, z: it.z, ready: it.ready, sub: !!it.sub, core: !!it.core, ops: it.nOps,
        bb: [it.x0, it.y0, it.x1, it.y1], iw: it.iw, ih: it.ih }));
    },
    groups() {
      const o = [];
      for (let s = 0; s < SCN.nOrd; s++) {
        const k = s * 4; if (GRP_U[k + 2] < -1e8) continue;
        const m = [];
        for (let i = 0; i < dynN; i++) { const d = DYN[i]; if (d.g === s) m.push({ kind: d.kind, z: d.z, id: d.kind === RK_FISH ? (d.obj.pack ? d.obj.pack.id : "fish") : d.kind === RK_BUBBLES ? d.obj.id + ":" + d.part : "flake" }); }
        o.push({ item: SCN.ord[s].id, z: SCN.ord[s].z, rect: [GRP_U[k], GRP_U[k + 1], GRP_U[k + 2], GRP_U[k + 3]], members: m });
      }
      return o;
    },
    // V4b: колонии переднего рифа (поза кадра, покой, z) и принудительное поведение рыбы вида id (тесты, кадры-доказательства):
    // what — "coral" (просвет в переднем рифе), "hide" (за колонну), "peek" (выглянуть; рыба уже за колонной)
    buildMs() { return Object.assign({}, BUILD_MS); },
    readyParts() { return { bg: bgSettled, mask: maskSettled, scene: scSettled(), video: videoSettled(), posters: bgMode !== "video" || !TEST || (BGS.day.pState >= 2 && BGS.night.pState >= 2),
      fish: PACK.every((p) => !(p.image && p.count > 0) || p.ready || p.failed), pending: scPending }; },
    corals() { return SCN.corals.map((c) => { const r = c.ready ? coralRest(c) : null; return { id: c.id, z: c.z, ready: c.ready, flip: c.flip, ops: c.nOps,
      bb: [c.x0, c.y0, c.x1, c.y1], rest: r ? [r.x0, r.y0, r.x1, r.y1] : null, kind: c.cat.kind, themes: !!c.timgs }; }); },
    enter(id, what) {
      for (const f of fishes) {
        if (!f.pack || f.pack.id !== id || isOff(f)) continue;
        if (what === "coral") return enterCoral(f, simT);
        if (what === "hide") return enterHide(f, simT);
        if (what === "peek") return f.state === ST.HIDE && !f.hCoral ? enterPeek(f, simT) : false;
      }
      return false;
    },
    crab() { const C = CRAB; return C.it ? { st: C.st, bx: C.bx, by: C.by, z: C.z, shade: C.shade, tuck: C.tuck, legs: C.legs, pick: C.pk.on, shuffles: C.shuffles, retreats: C.retreats } : null; },
    crabBeat() { return crabBeat(simT); },
    crabRetreat() { return CRAB.it ? crabRetreat(simT) : false; },
    // проверка captureLitBackdrop: освещённый задник под img → холст → обратно на то же место
    occluderRoundTrip(img, x, y, w, h) {
      const out = captureLitBackdrop(img, x, y, w, h);
      ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
      ctx.drawImage(out, Math.round(x * RS) / RS, Math.round(y * RS) / RS, out.width / RS, out.height / RS);
      return [out.width, out.height];
    },
  };

  /* ============================================================
     INPUT  (disabled in wallpaper mode — no menu/controls)
     ============================================================ */
  function toggleFullscreen() {
    if (!document.fullscreenElement) (document.documentElement.requestFullscreen || function () {}).call(document.documentElement);
    else (document.exitFullscreen || function () {}).call(document);
  }

  let idleTimer = null;
  function showHint() {
    if (WALLPAPER) return;
    hint.classList.remove("faded"); document.body.classList.remove("hide-cursor");
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { hint.classList.add("faded"); document.body.classList.add("hide-cursor"); }, 3500);
  }

  window.addEventListener("resize", onResize);
  document.addEventListener("visibilitychange", () => {
    perfEvent("vis", { hidden: document.hidden }); last = performance.now(); lastShown = 0; govReset(); syncVideos();
    PERF.armed = false;
    if (document.hidden && PROBE.on) probeEnd("hidden");   // рабочий стол закрыт окнами (WebKit скрыл страницу) — сразу, не через 147 с
    bbWrite(document.hidden ? "hidden" : "visible");       // «чёрный ящик»: скрытую страницу WebKit может выгрузить
  });
  window.addEventListener("pagehide", () => { BB.gone = true; bbWrite("pagehide"); });   // ушла сама (не убита)
  window.addEventListener("pageshow", (e) => { if (e.persisted) BB.gone = false; });

  if (WALLPAPER) {
    hint.style.display = "none";
    document.body.classList.add("hide-cursor");
  } else {
    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k === "f") toggleFullscreen();
      else if (e.code === "Space") { paused = !paused; e.preventDefault(); }
      else if (k === "+" || k === "=") setFishCount(fishes.length + 1);
      else if (k === "-" || k === "_") setFishCount(fishes.length - 1);
      showHint();
    });
    canvas.addEventListener("pointerdown", (e) => dropFoodAt(e.clientX, e.clientY));   // горсть хлопьев (вне обоев)
    window.addEventListener("pointermove", showHint);
  }

  /* ---------- start ---------- */
  preloadScene();                                     // картинки сцены — параллельно с задником (E4)
  buildPropShadow();
  resize();
  buildBubbleSources();
  seedTank(targetFishCount());
  FEEDER.nextAuto = rand(150, 270);                   // первая автокормёжка (обои) — через 2.5–4.5 мин, дальше раз в 6–10
  loadBackdrop();                                     // видео-сцена (постер темы → видео) | фото | процедурный риф
  showHint();
  perfEvent("boot", { boots: PAGE_BOOTS, nav: NAV_TYPE, reason: BOOT && BOOT.loadReason ? String(BOOT.loadReason) : null });
  if (BB.prev) {                                      // «чёрный ящик»: главное о прошлом сеансе — и в журнал этого
    const p = BB.prev, w = p.win;
    perfEvent("prev", p.missing || p.broken ? { boot: p.boot || null, none: 1, died: p.diedIn }
      : { boot: p.boot, up: p.up, why: p.why, max: w ? w.max : null, maxAt: w ? w.maxAt : null, stalls: p.stalls || 0, died: p.diedIn });
  }
  bbWrite("boot");                                    // первая запись — сразу (дальше — каждые 5 с)
  if (BB.on) BB.timer = setInterval(() => bbWrite("timer"), 5000);
  if ((BOOT && BOOT.hud) || flag("hud")) setHud(true);   // P1.1: HUD с самого запуска (приложение помнит галочку)
  // ?test=1: от rAF ничего не идёт — кадры только по window.__aq.step()
  if (!TEST) requestAnimationFrame(frame);
})();
</script>
</body>
