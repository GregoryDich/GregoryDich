[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "snapplay-backend"
version = "2.0.0"
description = "SnapPlay AI control-plane API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.4,<3",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.7,<3",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "websockets>=12",
    "boto3>=1.34",
    "numpy>=1.26",
    "soundfile>=0.12",
    "mido>=1.3",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.2",
    "demucs>=4.0.1",
    "basic-pitch>=0.4",
    "onnxruntime-gpu>=1.17",
    "aubio>=0.4.9",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "moto[s3,sqs]>=5",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query",
    "fastapi.Header", "fastapi.Body", "fastapi.Path",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
