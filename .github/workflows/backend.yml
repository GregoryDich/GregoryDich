name: backend

on:
  push:
    branches: [main]
    paths:
      - "tonamorph/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "tonamorph/backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: tonamorph/backend

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TONAMORPH_PIPELINE: fake
      # Dummy credentials keep boto3/moto away from real AWS during tests.
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tonamorph/backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest pytest-asyncio ruff moto respx
          fi

      - name: Lint
        run: ruff check app tests worker

      - name: Test
        run: python -m pytest -q
