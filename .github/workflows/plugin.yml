name: plugin

on:
  push:
    branches: [main]
    paths:
      - "tonamorph/plugin/**"
      - ".github/workflows/plugin.yml"
  pull_request:
    paths:
      - "tonamorph/plugin/**"
      - ".github/workflows/plugin.yml"

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: tonamorph/plugin
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libcurl4-openssl-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev librubberband-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install pkgconf rubberband

      # JUCE 8.0.8 is fetched by CMake FetchContent (JUCE_SOURCE_DIR is unset
      # on the runners); cache the checkout between runs.
      - name: Cache JUCE sources
        uses: actions/cache@v4
        with:
          path: tonamorph/plugin/build/_deps
          key: juce-8.0.8-${{ runner.os }}-${{ hashFiles('tonamorph/plugin/CMakeLists.txt') }}

      # The bundled demo morph is generated at configure time by plugin/Resources/generate_demo.py.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install demo generator dependencies
        run: python -m pip install --disable-pip-version-check numpy soundfile

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build and run core tests
        run: |
          cmake --build build --config Release --target tonamorph_core_tests --parallel 4
          ctest --test-dir build -C Release --output-on-failure

      - name: Build VST3
        run: cmake --build build --config Release --target Tonamorph_VST3 --parallel 4

      - name: Build AU
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target Tonamorph_AU --parallel 4

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Tonamorph-VST3-${{ runner.os }}
          path: tonamorph/plugin/build/Tonamorph_artefacts/Release/VST3/
          if-no-files-found: error
