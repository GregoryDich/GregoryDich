name: health-probe

# Every five minutes: GET $API_URL/v1/health. A failure opens (or updates) one issue
# labelled `slo-breach`; the next healthy probe closes it. Set the repository variable
# API_URL (Settings → Secrets and variables → Actions → Variables) to the API origin,
# e.g. https://api.tonamorph.com; until it is set the probe is skipped, not failed.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: health-probe
  cancel-in-progress: false

env:
  ISSUE_TITLE: "SLO breach: /v1/health is failing"
  ISSUE_LABEL: slo-breach

jobs:
  probe:
    name: GET /v1/health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Skip when API_URL is not configured
        if: env.API_URL == ''
        run: echo "::notice::API_URL is not set; nothing to probe."

      - name: Probe
        id: probe
        if: env.API_URL != ''
        shell: bash
        run: |
          set -uo pipefail
          url="${API_URL%/}/v1/health"
          started=$(date +%s%3N)
          if body=$(curl -fsS --max-time 15 "$url"); then
            ok=true
          else
            ok=false
            body=""
          fi
          latency_ms=$(( $(date +%s%3N) - started ))
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "latency_ms=$latency_ms" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "probe ok=$ok latency_ms=$latency_ms body=$body"

      - name: Open, update or close the slo-breach issue
        if: env.API_URL != ''
        uses: actions/github-script@v7
        env:
          PROBE_OK: ${{ steps.probe.outputs.ok }}
          PROBE_LATENCY_MS: ${{ steps.probe.outputs.latency_ms }}
          PROBE_URL: ${{ steps.probe.outputs.url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = process.env.ISSUE_TITLE;
            const label = process.env.ISSUE_LABEL;
            const ok = process.env.PROBE_OK === 'true';
            const latency = process.env.PROBE_LATENCY_MS;
            const url = process.env.PROBE_URL;
            const stamp = new Date().toISOString();
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const open = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: label, per_page: 100,
            })).find((issue) => issue.title === title && !issue.pull_request);

            if (ok) {
              if (open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: open.number,
                  body: `Healthy again at ${stamp}: \`GET ${url}\` answered 200 in ${latency} ms ([run](${runUrl})).`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: open.number, state: 'closed', state_reason: 'completed',
                });
                core.info(`closed #${open.number}`);
              } else {
                core.info(`healthy (${latency} ms)`);
              }
              return;
            }

            const line = `Probe failed at ${stamp}: \`GET ${url}\` did not answer 200 within 15 s ([run](${runUrl})).`;
            if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: line });
              core.info(`updated #${open.number}`);
            } else {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner, repo, name: label, color: 'b60205',
                  description: 'An availability or success-rate SLO is being missed',
                });
              }
              const created = await github.rest.issues.create({
                owner, repo, title, labels: [label],
                body: [
                  line,
                  '',
                  'The probe runs every five minutes and closes this issue automatically once `/v1/health` answers 200 again.',
                  'Runbook: docs/GTM_PLAN.md §2.3 (incident texts, `MAINTENANCE_MODE`), docs/LAUNCH_CHECKLIST.md (deploy smoke steps).',
                ].join('\n'),
              });
              core.info(`opened #${created.data.number}`);
            }
            core.setFailed(`GET ${url} is failing`);
