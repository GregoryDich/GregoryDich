name: deploy

on:
  push:
    branches: [main]
    paths:
      - "snapplay-ai/backend/**"
      - "snapplay-ai/infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TERRAFORM_VERSION: "1.9.8"
  PROJECT_NAME: snapplay
  ENVIRONMENT: prod
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  # Per-account values that do not belong in production.tfvars.
  TF_VAR_supabase_url: ${{ vars.SUPABASE_URL }}
  TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}
  TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
  TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Free runner disk space for the CUDA image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: snapplay-ai
          file: snapplay-ai/infra/Dockerfile.api
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}/api:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: snapplay-ai
          file: snapplay-ai/infra/Dockerfile.worker
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}/worker:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}/worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=min

  plan:
    name: Terraform plan
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: snapplay-ai/infra/aws
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${PROJECT_NAME}/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform plan
        run: |
          terraform plan -input=false \
            -var-file=production.tfvars \
            -var="image_tag=${{ github.sha }}" \
            -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: snapplay-ai/infra/aws/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Terraform apply
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://api.snapplay.ai
    defaults:
      run:
        working-directory: snapplay-ai/infra/aws
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${PROJECT_NAME}/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: snapplay-ai/infra/aws

      - name: Terraform apply
        run: terraform apply -input=false tfplan
