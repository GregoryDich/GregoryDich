name: deploy

on:
  push:
    branches: [main]
    paths:
      - "tonamorph/backend/**"
      - "tonamorph/infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TERRAFORM_VERSION: "1.9.8"
  PROJECT_NAME: tonamorph
  ENVIRONMENT: prod
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  # Per-account values that do not belong in production.tfvars.
  TF_VAR_supabase_url: ${{ vars.SUPABASE_URL }}
  TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}
  TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
  TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
  # Kill switch: set the MAINTENANCE_MODE repository variable to true and re-run the workflow.
  TF_VAR_maintenance_mode: ${{ vars.MAINTENANCE_MODE || 'false' }}
  TF_VAR_sentry_dsn: ${{ secrets.SENTRY_DSN }}
  TF_VAR_alarm_phone: ${{ vars.ALARM_PHONE }}

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Free runner disk space for the CUDA image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: tonamorph
          file: tonamorph/infra/Dockerfile.api
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}/api:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: tonamorph
          file: tonamorph/infra/Dockerfile.worker
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}/worker:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}/worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=min

  plan:
    name: Terraform plan
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tonamorph/infra/aws
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${PROJECT_NAME}/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform plan
        run: |
          terraform plan -input=false \
            -var-file=production.tfvars \
            -var="image_tag=${{ github.sha }}" \
            -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: tonamorph/infra/aws/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Terraform apply
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://api.tonamorph.com
    defaults:
      run:
        working-directory: tonamorph/infra/aws
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${PROJECT_NAME}/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: tonamorph/infra/aws

      - name: Terraform apply
        run: terraform apply -input=false tfplan

      # python -m app.checks needs the production Supabase credentials, which live in
      # Secrets Manager and are injected into the API task definition only. Run it there:
      # a one-off Fargate task on the freshly applied task definition, the same way the
      # reaper runs. A non-zero exit (a paid plan with no checkout URL) fails the deploy.
      - name: Deployment checks (python -m app.checks in production)
        run: |
          cluster=$(terraform output -raw ecs_cluster_name)
          task_definition=$(terraform output -raw api_task_definition_arn)
          security_group=$(terraform output -raw api_security_group_id)
          log_group=$(terraform output -raw api_log_group_name)
          subnets=$(terraform output -json private_subnet_ids | jq -r 'join(",")')
          task_arn=$(aws ecs run-task \
            --cluster "$cluster" \
            --task-definition "$task_definition" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$subnets],securityGroups=[$security_group],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["python","-m","app.checks"]}]}' \
            --started-by "deploy-${GITHUB_SHA:0:12}" \
            --query 'tasks[0].taskArn' --output text)
          echo "checks task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          task_id=${task_arn##*/}
          aws logs get-log-events --log-group-name "$log_group" --log-stream-name "api/api/$task_id" \
            --start-from-head --query 'events[].message' --output text || true
          exit_code=$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "python -m app.checks exited with: $exit_code"
          test "$exit_code" = "0"
