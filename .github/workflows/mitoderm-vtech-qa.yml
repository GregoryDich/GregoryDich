name: MITODERM V-TECH quality gates

on:
  push:
    branches:
      - claude/mitoderm-figma-catalog-74tbuw
    paths:
      - 'mitoderm-catalog/codex-site/**'
      - '.github/workflows/mitoderm-vtech-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mitoderm-vtech-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mitoderm-catalog/codex-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm and Node with cached dependencies
        uses: pnpm/setup@v3
        with:
          working-directory: mitoderm-catalog/codex-site
          runtime: node@22
          cache: true
          require-lockfile: true
      - name: Validate product-page bible against registry
        run: |
          node scripts/generate-page-bible.mjs --check
          node scripts/render-approval-package.mjs --check
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
      - name: Prepare Playwright (no project dependency change)
        run: |
          npm install --prefix /tmp/mitoderm-qa --no-save --no-audit --no-fund playwright-core@1.58.2
          which google-chrome || which chromium
      - name: Validate EXO-NAD approval preview
        env:
          MITODERM_PLAYWRIGHT_MODULE: /tmp/mitoderm-qa/node_modules/playwright-core
          MITODERM_CHROME: /usr/bin/google-chrome
        run: node scripts/verify-approval-package.cjs
      - name: Start local V-TECH preview
        run: |
          nohup pnpm dev --host 127.0.0.1 > /tmp/mitoderm-preview.log 2>&1 &
          echo $! > /tmp/mitoderm-preview.pid
          for i in $(seq 1 45); do
            if curl -fsS -o /dev/null http://127.0.0.1:5173/products/v-tech-system; then
              echo "V-TECH preview is responding"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mitoderm-preview.log
          exit 1
      - name: Browser QA (forward/reverse, 5 sizes, reduced motion)
        env:
          MITODERM_URL: http://127.0.0.1:5173
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/vtech-visual-qa.cjs
      - name: Browser QA for 12 cinematic product pages
        env:
          MITODERM_URL: http://127.0.0.1:5173
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/product-cinema-qa.cjs
      - name: Upload screenshot and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitoderm-vtech-v9-visual-proof
          path: |
            mitoderm-catalog/codex-site/production/proof/ci-v9/
            mitoderm-catalog/codex-site/production/page-bible/pages/exo-nad/QA*.png
            mitoderm-catalog/codex-site/production/page-bible/pages/exo-nad/QA.json
            mitoderm-catalog/codex-site/production/page-bible/pages/exo-nad/STORYBOARD*.png
            /tmp/mitoderm-preview.log
          retention-days: 14
          if-no-files-found: warn

