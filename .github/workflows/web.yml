name: web

on:
  push:
    branches: [main]
    paths:
      - "snapplay-ai/web/**"
      - "snapplay-ai/legal/**"
      - "snapplay-ai/THIRD_PARTY_LICENSES.md"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "snapplay-ai/web/**"
      - "snapplay-ai/legal/**"
      - "snapplay-ai/THIRD_PARTY_LICENSES.md"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: snapplay-ai/web
    env:
      # Build-time placeholders only; the legal pages must render with every token substituted.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snapplay-ai/web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The product name may live in exactly one place so the rename stays a one-line change.
      - name: Brand indirection
        run: |
          hits=$(grep -rn "SnapPlay" src public *.ts *.json *.md 2>/dev/null | grep -v "src/lib/brand.ts" || true)
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi
